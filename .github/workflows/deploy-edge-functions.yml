# Deploys the Supabase Edge Functions from the browser.
#
# The functions import from supabase/functions/_shared/, which the Supabase
# dashboard editor cannot reach, so the CLI has to do the bundling. Running it
# here means nobody needs a terminal: set the three secrets once, then press
# "Run workflow".
#
# SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are injected by
# Supabase into every deployed function. They are deliberately absent below —
# the platform reserves the SUPABASE_ prefix and refuses to set them as secrets.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: 'LLM provider (anthropic | openai | mock)'
        type: choice
        options: [anthropic, openai, mock]
        default: anthropic
      llm_model:
        description: 'Model id passed to the provider'
        type: string
        default: claude-sonnet-5

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # tsconfig.json excludes supabase/functions, because the app's compiler
      # cannot resolve Deno's URL imports — which left the functions the only
      # code here that nothing type-checked. A function that type-errors still
      # bundles and deploys, then fails at runtime on every call; and the app
      # answers a failed analysis locally rather than loudly, so the way that
      # shows up is a button that does nothing. Checking before deploying is
      # what makes that impossible.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the functions
        run: |
          set -o pipefail
          deno check --no-lock supabase/functions/*/index.ts 2>&1 | tee check.log || {
            echo "::error::The Edge Functions do not type-check. Nothing was deployed."
            exit 1
          }
          echo "Type-check clean."

      - name: Read the secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # These two get crossed and pasted with their URL around them. Take
          # what was given, work out what it meant, and report every problem
          # at once — one wrong value per run is a slow way to learn four.
          token=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]')

          case "$ref" in
            */dashboard/project/*) ref=${ref##*/dashboard/project/}; ref=${ref%%/*}
                                   echo "note: took the project ref out of the dashboard URL." ;;
            *://*.supabase.co*)    ref=${ref#*://}; ref=${ref%%.*}
                                   echo "note: took the project ref out of the project URL." ;;
            *.supabase.co*)        ref=${ref%%.*}
                                   echo "note: dropped .supabase.co from the project ref." ;;
          esac

          if [ "${ref#sbp_}" != "$ref" ] && [ "${token#sbp_}" = "$token" ]; then
            echo "note: the access token and the project ref were in each other's"
            echo "      slots. Using them the right way round for this run — but"
            echo "      please swap them in Settings so this note goes away."
            swap=$token; token=$ref; ref=$swap
          fi

          fail=0
          say() { echo "::error::$1"; fail=1; }

          if [ -z "$token" ]; then
            say "SUPABASE_ACCESS_TOKEN is not set. Generate one at https://supabase.com/dashboard/account/tokens"
          elif [ "${token#sbp_}" = "$token" ]; then
            say "SUPABASE_ACCESS_TOKEN does not start with sbp_. It comes from https://supabase.com/dashboard/account/tokens (Generate new token) — it is not the project ref, the anon key, or the database password."
          fi

          if [ -z "$ref" ]; then
            say "SUPABASE_PROJECT_REF is not set. It is the id in your dashboard URL after /project/."
          elif [ "${ref#sbp_}" != "$ref" ]; then
            say "SUPABASE_PROJECT_REF holds an access token. It should be the id in your dashboard URL after /project/ — about 20 lowercase letters."
          elif ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{15,30}$'; then
            say "SUPABASE_PROJECT_REF is not shaped like a project ref (expected about 20 lowercase letters and digits). It is the id in your dashboard URL after /project/."
          fi

          case "${{ inputs.llm_provider }}" in
            anthropic) [ -n "$ANTHROPIC_API_KEY" ] || say "ANTHROPIC_API_KEY is not set. Get one at https://console.anthropic.com" ;;
            openai)    [ -n "$OPENAI_API_KEY" ] || say "OPENAI_API_KEY is not set." ;;
          esac

          if [ "$fail" -ne 0 ]; then
            echo "Fix these under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

          # Hand the cleaned-up values to the steps that follow.
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Secrets look right."

      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Written to a file rather than passed as arguments: a key on the
          # command line would be visible in the runner's process list.
          umask 077
          {
            echo "LLM_PROVIDER=${{ inputs.llm_provider }}"
            echo "LLM_MODEL=${{ inputs.llm_model }}"
            if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"; fi
            if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY=$OPENAI_API_KEY"; fi
          } > functions.env
          supabase secrets set --project-ref "$PROJECT_REF" --env-file functions.env
          rm -f functions.env

      # Every function in supabase/functions/, so adding one does not mean
      # remembering to edit this file. _shared/ is a library, not a function.
      - name: Deploy every function
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Summary
        run: |
          {
            echo "### Edge Functions deployed"
            echo ""
            echo "| Function | Provider | Model |"
            echo "| --- | --- | --- |"
            for dir in supabase/functions/*/; do
              name=$(basename "$dir")
              [ "$name" = "_shared" ] && continue
              echo "| $name | ${{ inputs.llm_provider }} | ${{ inputs.llm_model }} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
