name: checks

# Types, tests, and the eval suite that guards what a reading may be.
# The eval runs on every push because the rules it protects are the kind that
# loosen by accident: a prompt tweak, a relaxed threshold, a golden quietly
# deleted. None of that shows up in a screenshot.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: The reading rules are in step with their copy
        run: npm run sync:shared -- --check

      - name: Nothing is written into the void
        # A file put at a path nothing imports does not fail: the type checker
        # and the tests both stay silent, because neither of them ever looks at
        # it. That happened once, so the import graph is checked here.
        run: npm run orphans

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: The Edge Functions type-check
        # tsconfig.json excludes supabase/functions — the app's compiler cannot
        # resolve Deno's URL imports — so until now nothing looked at them
        # until deploy time. That is too late: the functions went a whole
        # rewrite importing a name (`getProvider`) that _shared/llm.ts has
        # never exported, and every test stayed green throughout.
        run: |
          set -o pipefail
          echo '{"nodeModulesDir":"auto"}' > deno.check.json
          deno check --no-lock --config deno.check.json supabase/functions/*/index.ts

      - name: Types
        run: npm run typecheck

      - name: Tests and evals
        run: npm test -- --ci
