<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>crincran ｜ 人生の目次</title>
<meta name="description" content="好きなもの、仕事、人との出会い、心が動いた出来事をつなぎ、自分の輪郭を取り戻す人生編集アプリ。">
<meta name="theme-color" content="#FBF0BE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="crincran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF0BE; --bg-soft:#FDF6D6; --panel:#FFFBE9; --sheet:#FFFCF0;
  --ink:#3E3226; --ink-soft:#6A5A46; --muted:#A5906A; --faint:#C4B189;
  --line:#E6D8A6; --line-soft:#EFE4BC; --scrim:rgba(62,50,38,.34);
  --accent:#C88A5C;
  --k-moved:#C97B6B; --k-effort:#B5924C; --k-hard:#7C8DA6; --k-chose:#6E9885; --k-wish:#9B85AF;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --maxw:520px;
  --navh:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  line-height:1.9; letter-spacing:.02em; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::selection{background:rgba(200,138,92,.24)}

/* ── shell ───────────────────────────────── */
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:100%;max-width:var(--maxw);flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:560px){ body{background:#F4E9BE} .stage{background:var(--bg);box-shadow:0 0 0 1px var(--line-soft)} }

/* ── header ──────────────────────────────── */
.hd{
  flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
  border-bottom:1px solid var(--line-soft); background:var(--bg); z-index:5;
}
.brand{text-decoration:none;font-family:var(--serif);font-weight:600;font-size:.82rem;line-height:1.05;letter-spacing:.02em;color:var(--ink);justify-self:start;text-align:left}
.brand i{display:block;font-style:normal;padding-left:.5em}
.hd-c{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:1.02rem;letter-spacing:.06em;white-space:nowrap}
.hd-c .yr{font-style:italic;color:var(--ink-soft)}
.hd-c button{display:flex;align-items:center;gap:6px;padding:2px 4px;color:inherit}
.chev{width:11px;height:11px;border-right:1.4px solid var(--muted);border-bottom:1.4px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
.hd-r{justify-self:end;font-size:.56rem;font-weight:700;letter-spacing:.18em;color:var(--muted);padding:6px 2px}

/* ── scroll body ─────────────────────────── */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:22px 20px calc(var(--navh) + env(safe-area-inset-bottom) + 40px);display:none}
.view.on{display:block}
.view.flush{padding:0}

/* ── bottom nav ──────────────────────────── */
.nav{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--sheet);border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:var(--navh);font-family:var(--serif);font-size:1.02rem;letter-spacing:.04em;color:var(--faint);
  transition:color .2s}
.nav button .sq{width:26px;height:6px;opacity:0;transition:opacity .25s}
.nav button.on{color:var(--ink)}
.nav button.on .sq{opacity:1}
.nav button i{font-style:italic}

/* ── shared bits ─────────────────────────── */
.eyebrow{font-size:.56rem;font-weight:700;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.plus{width:26px;height:26px;position:relative;flex:none}
.plus::before,.plus::after{content:"";position:absolute;background:var(--muted);left:50%;top:50%}
.plus::before{width:13px;height:1.2px;transform:translate(-50%,-50%)}
.plus::after{width:1.2px;height:13px;transform:translate(-50%,-50%)}
.squig{display:block;margin:14px auto;width:44px;height:9px;opacity:.75}
.hr{height:1px;background:var(--line-soft);margin:26px 0}
.center{text-align:center}
.mono-note{font-size:.72rem;color:var(--muted);line-height:1.8}
.empty{padding:30px 0;text-align:center;color:var(--faint);font-size:.8rem;font-family:var(--serif)}

/* title block */
.titleblock{padding:14px 0 4px;text-align:center;position:relative}
.titleblock h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.25rem,5.6vw,1.55rem);
  line-height:1.75;letter-spacing:.06em;color:var(--ink)}
.titleblock h1 .ph{color:var(--faint)}
.titleblock .pen{display:inline-block;margin-left:.4em;vertical-align:middle;opacity:.55}
.arrowbtn{position:absolute;top:50%;transform:translateY(-50%);padding:10px;color:var(--muted)}
.arrowbtn.l{left:-6px} .arrowbtn.r{right:-6px}
.arrowbtn:disabled{opacity:.22}

/* rows */
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:14px;
  padding:16px 2px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%}
.row .d{font-family:var(--serif);font-size:.74rem;color:var(--accent);letter-spacing:.04em;white-space:nowrap}
.row .t{font-family:var(--serif);font-size:.98rem;line-height:1.7;color:var(--ink)}
.row .t em{font-style:normal;color:var(--muted)}
.row .go{font-size:.9rem;color:var(--faint)}
.row:active{background:var(--bg-soft)}
.dotk{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:.5em;vertical-align:middle}

/* quick log */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;
  border:1px solid var(--line-soft);border-radius:14px;background:var(--panel);transition:transform .12s,border-color .2s}
.quick button:active{transform:scale(.95)}
.quick .bl{width:9px;height:9px;border-radius:50%}
.quick .lb{font-family:var(--serif);font-size:.62rem;letter-spacing:.02em;color:var(--ink-soft);line-height:1.3;text-align:center}

/* chapter card */
.chapter{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:20px 18px;margin-top:16px}
.chapter h3{font-family:var(--serif);font-size:.95rem;letter-spacing:.05em;margin-bottom:10px}
.chapter .lbl{font-size:.6rem;letter-spacing:.16em;color:var(--faint);margin-top:16px;margin-bottom:4px;font-weight:700}
.chapter p{font-family:var(--serif);font-size:.88rem;line-height:2.05;color:var(--ink-soft);letter-spacing:.03em}

/* buttons */
.btn{display:block;width:100%;text-align:center;font-family:var(--serif);font-size:.9rem;letter-spacing:.1em;
  padding:15px;border-radius:999px;background:var(--ink);color:var(--bg);transition:opacity .2s}
.btn:active{opacity:.78}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:.8rem}
.btn:disabled{opacity:.4}
.linkbtn{font-family:var(--serif);font-size:.8rem;color:var(--muted);letter-spacing:.08em;padding:8px}
.linkbtn:active{color:var(--ink)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:.7rem;letter-spacing:.04em;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel);transition:all .18s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);z-index:21;
  width:100%;max-width:var(--maxw);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--sheet);border-radius:22px 22px 0 0;border:1px solid var(--line-soft);border-bottom:0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 26px);
  transition:transform .34s cubic-bezier(.22,.8,.24,1)}
.sheet.on{transform:translate(-50%,0)}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h2{font-family:var(--serif);font-size:1.05rem;letter-spacing:.06em;text-align:center;margin-bottom:6px}
.sheet .sub{text-align:center;font-size:.72rem;color:var(--muted);margin-bottom:18px}
.field{margin-top:16px}
.field label{display:block;font-size:.6rem;font-weight:700;letter-spacing:.16em;color:var(--faint);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:12px;padding:13px 14px;font-family:var(--serif);font-size:.92rem;line-height:1.8;color:var(--ink)}
.field textarea{min-height:104px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);font-family:var(--sans);font-size:.82rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:grid;gap:10px;margin-top:22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 22px);transform:translate(-50%,14px);
  z-index:40;background:var(--ink);color:var(--bg);font-size:.78rem;letter-spacing:.06em;font-family:var(--serif);
  padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── MAP：宇宙 ───────────────────────────── */
#v-map{background:#070916}
.mapwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.maptabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(7,9,22,.92);
  border-bottom:1px solid rgba(169,176,197,.16);position:relative;z-index:8}
.maptabs button{padding:14px 4px 12px;font-family:var(--serif);font-size:.84rem;letter-spacing:.08em;
  color:#868FA9;position:relative}
.maptabs button.on{color:#F7F1E6}
.maptabs button.on::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:36%;height:1.5px;background:#D8B56A}
.maptabs button:focus-visible{outline:2px solid #D8B56A;outline-offset:-3px}

.mapstage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.mapstage.grabbing{cursor:grabbing}
#gcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.maplayer{position:absolute;inset:0;pointer-events:none;z-index:4}

/* 価値観チップ */
.vchips{position:absolute;left:0;right:0;top:42px;z-index:7;display:flex;gap:6px;justify-content:center;
  flex-wrap:wrap;padding:12px 14px 0;pointer-events:none}
.vchip{pointer-events:auto;font-family:var(--serif);font-size:.68rem;letter-spacing:.1em;color:#E9E0CB;
  background:rgba(216,181,106,.12);border:1px solid rgba(216,181,106,.42);border-radius:999px;
  padding:6px 13px;display:inline-flex;align-items:center;gap:7px;line-height:1}
.vchip b{font-weight:400;font-size:.56rem;color:#D8B56A;letter-spacing:.04em}
.vchip.on{background:#D8B56A;color:#12162B;border-color:#D8B56A}
.vchip.on b{color:#12162B}
.vchip:focus-visible{outline:2px solid #D8B56A;outline-offset:2px}

/* 今見えていること */
.mapsum{position:absolute;left:0;right:0;top:90px;z-index:6;padding:0 26px;text-align:center;
  font-family:var(--serif);font-size:.78rem;line-height:1.95;color:#CBD1E0;letter-spacing:.03em;
  pointer-events:none;text-shadow:0 1px 12px rgba(7,9,22,.95)}

/* ノードのラベルと当たり判定 */
.nlabel{position:absolute;pointer-events:auto;transform:translate(-50%,0);background:none;
  font-family:var(--serif);text-align:center;line-height:1.5;letter-spacing:.03em;color:#F7F1E6;
  padding:2px 4px;max-width:136px;text-shadow:0 1px 9px rgba(7,9,22,.98),0 0 3px rgba(7,9,22,.9)}
.nlabel .mk{display:block;font-size:.48rem;letter-spacing:.18em;color:#9AA3BC;margin-bottom:3px}
.nlabel .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nlabel.dim{opacity:.22}
.nlabel:focus-visible{outline:2px solid #D8B56A;outline-offset:2px;border-radius:6px}
.nhit{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border-radius:50%;background:none}
.nhit:focus-visible{outline:2px solid #D8B56A;outline-offset:1px}

/* 操作まわり */
.mapreset{position:absolute;right:12px;top:8px;z-index:10;border:1px solid rgba(169,176,197,.35);
  border-radius:999px;background:rgba(12,16,36,.85);font-family:var(--serif);font-size:.66rem;
  letter-spacing:.06em;color:#CBD1E0;padding:7px 13px}
.mapreset:focus-visible{outline:2px solid #D8B56A;outline-offset:2px}
.maphint{position:absolute;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 6px);
  text-align:center;font-size:.56rem;color:#7B84A0;letter-spacing:.06em;pointer-events:none;padding:0 14px;z-index:5}
.mapempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 44px;
  text-align:center;font-family:var(--serif);font-size:.9rem;line-height:2.1;color:#A9B0C5;z-index:5}

/* 詳細カード＝夜空でひらく紙 */
.ndetail{position:absolute;left:10px;right:10px;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px);
  z-index:9;background:#FBF7EA;border-radius:14px;padding:16px 16px 14px;
  box-shadow:0 14px 44px rgba(0,0,0,.55);transform:translateY(16px);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;max-height:54vh;overflow-y:auto;overscroll-behavior:contain}
.ndetail.on{transform:none;opacity:1;pointer-events:auto}
.ndetail .x{position:absolute;right:6px;top:4px;padding:10px 12px;color:#A8926A;font-size:1.1rem;line-height:1}
.ndetail .x:focus-visible{outline:2px solid #C88A5C;outline-offset:-2px}
.nd-k{font-size:.54rem;font-weight:700;letter-spacing:.2em;color:#B09A6E;display:flex;align-items:center;gap:7px}
.nd-k i{width:7px;height:7px;border-radius:50%;display:block}
.ndetail h4{font-family:var(--serif);font-size:1rem;line-height:1.6;letter-spacing:.04em;margin:7px 34px 9px 0;color:#3B3025}
.ndetail p.sum{font-family:var(--serif);font-size:.83rem;line-height:2;color:#5B4B37}
.nd-sec{margin-top:13px;padding-top:11px;border-top:1px solid rgba(160,138,96,.28)}
.nd-sec h5{font-size:.54rem;font-weight:700;letter-spacing:.18em;color:#B09A6E;margin-bottom:7px}
.nd-sec p{font-family:var(--serif);font-size:.78rem;line-height:1.9;color:#5B4B37}
.nd-ev{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;padding:6px 0;text-align:left;width:100%}
.nd-ev + .nd-ev{border-top:1px solid rgba(160,138,96,.14)}
.nd-ev .d{font-family:var(--serif);font-size:.6rem;color:#B98D62;white-space:nowrap}
.nd-ev .t{font-family:var(--serif);font-size:.75rem;line-height:1.75;color:#4A3C2C}
.nd-ev .t em{font-style:normal;color:#A8926A;font-size:.62rem;letter-spacing:.06em;margin-left:.4em}
.nd-meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:.62rem;color:#A8926A;letter-spacing:.04em}
.nd-fb{display:flex;gap:8px;margin-top:14px}
.nd-fb button{flex:1;font-family:var(--serif);font-size:.76rem;letter-spacing:.06em;padding:11px 4px;
  border-radius:999px;border:1px solid rgba(160,138,96,.42);color:#5B4B37}
.nd-fb button.on{background:#3B3025;color:#FBF7EA;border-color:#3B3025}
.nd-fb button:focus-visible{outline:2px solid #C88A5C;outline-offset:2px}

/* ── LIST ────────────────────────────────── */
.yearhead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 10px;border-bottom:1px solid var(--line)}
.yearhead .y{font-family:var(--serif);font-style:italic;font-size:1.5rem;letter-spacing:.04em}
.yearhead .n{font-size:.6rem;letter-spacing:.16em;color:var(--faint)}
/* ── LIST：スクラップブックの life path ── */
#v-list{
  background-color:#FAF5E2;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
}
.path{position:relative;margin:10px 0 0}
.path > svg{position:absolute;left:0;top:0;pointer-events:none}

/* 貼った紙 */
.stop{position:absolute;z-index:3;background:#FEFBF2;border-radius:1px;
  box-shadow:0 1px 3px rgba(74,60,40,.10), 0 0 0 1px rgba(160,140,100,.10)}
.tape{position:absolute;top:-9px;left:50%;width:56px;height:17px;z-index:1;
  transform:translateX(-50%) rotate(-2deg);background:rgba(200,172,116,.26);
  clip-path:polygon(0 12%,8% 0,22% 10%,38% 2%,54% 11%,70% 1%,86% 10%,100% 3%,100% 90%,88% 100%,72% 91%,56% 100%,40% 90%,24% 100%,10% 91%,0 99%)}
.tag{display:block;width:100%;text-align:left;padding:13px 13px 12px;background:none;position:relative;z-index:2}
.tag .mn{display:block;font-family:var(--serif);font-size:.56rem;font-weight:600;
  letter-spacing:.26em;color:#AE9A6E}
.tag .tt{display:block;font-family:var(--serif);font-size:.83rem;line-height:1.7;
  color:#3B3025;margin-top:5px;letter-spacing:.02em}
.tag .tt.none{color:#C0AE86}
.tag .kd{display:flex;gap:4px;margin-top:9px;align-items:center}
.tag .kd i{width:5px;height:5px;border-radius:50%;display:block}
.tag .kd b{font-weight:400;font-size:.54rem;letter-spacing:.14em;color:#B7A57E;margin-left:3px}

/* その場でひらく出来事 */
.evs{padding:0 13px 12px;position:relative;z-index:2}
.evs::before{content:"";display:block;border-top:1px dashed rgba(160,138,96,.4);margin-bottom:2px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;width:100%;
  text-align:left;padding:8px 0 7px}
.ev + .ev{border-top:1px solid rgba(160,138,96,.14)}
.ev .d{font-family:var(--serif);font-size:.62rem;color:#B98D62;letter-spacing:.04em;white-space:nowrap}
.ev .t{font-family:var(--serif);font-size:.74rem;line-height:1.7;color:#4A3C2C}
.ev .k{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:.45em;vertical-align:middle}
.evs .none{font-family:var(--serif);font-size:.72rem;color:#C0AE86;padding:9px 0 4px;font-style:italic}

/* 道の上の点 */
.node{position:absolute;width:11px;height:11px;border-radius:50%;background:#FAF5E2;
  border:1.5px solid #C08E5E;transform:translate(-50%,-50%);z-index:2}
.node.on{background:#C08E5E}

/* START の旗と NEXT CHAPTER */
.cap{position:absolute;z-index:5;background:#332A20;color:#FAF5E2;
  font-family:var(--serif);font-size:.54rem;font-weight:600;letter-spacing:.24em;padding:6px 16px 6px 12px;
  transform:translate(-50%,-50%) rotate(-1.5deg);
  clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}
.cap.round{border-radius:50%;width:80px;height:80px;padding:0;clip-path:none;
  transform:translate(-50%,-50%) rotate(-2deg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;font-weight:400;
  font-size:.68rem;letter-spacing:.1em;line-height:1.5}
.cap.round em{font-style:normal;font-size:.5rem;color:#C9A227;margin-top:3px}

<script>
/* ═══════════════════════════════════════════════════════════
   crincran — 人生編集アプリ  (single-file / no build step)
   Log = 記録する / Map = 理解する / List = 記憶をたどる
   ═══════════════════════════════════════════════════════════ */
(function(){
"use strict";

/* ── 1. 定数 ───────────────────────────── */
/* 入力カテゴリは3つだけ。分析結果のカテゴリとは分ける。
   保存する値は既存データと同じ moved / effort / hard。
   旧データの chose / wish は表示のうえでこの3つへ寄せる。 */
var KINDS = [
  {id:'moved',  ja:'心が動いた',   en:'MOVED',  v:'--k-moved',
   hint:'好き・うれしい・感動・違和感・嫉妬・憧れ'},
  {id:'effort', ja:'力を使った',   en:'EFFORT', v:'--k-effort',
   hint:'仕事・創作・勉強・誰かを助けたこと。うまくいったかは問わない'},
  {id:'hard',   ja:'引っかかった', en:'SNAG',   v:'--k-hard',
   hint:'つらさ・怒り・疲れ・満たされなさ・うまくいかなかったこと'}
];
var LEGACY_KIND = {chose:'effort', wish:'moved'};
function kindOf(l){ var k=(l&&l.kind)||'moved'; return LEGACY_KIND[k] || k; }
var KIND = {}; KINDS.forEach(function(k){ KIND[k.id]=k; });
var TONES = [
  {id:'hold',  ja:'そっと受け止める'},
  {id:'clear', ja:'まっすぐ整理する'},
  {id:'story', ja:'物語として読む'}
];
var ANGLES = [
  {id:'effort', ja:'頑張りを受け止めたい'},
  {id:'self',   ja:'自分らしさを確かめたい'},
  {id:'doubt',  ja:'迷いを整理したい'},
  {id:'next',   ja:'次の方向を考えたい'}
];
var LS = 'crincran.v1';

/* ── 2. ユーティリティ ─────────────────── */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function ymOf(iso){ return iso.slice(0,7); }
function yearOf(iso){ return iso.slice(0,4); }
function todayISO(d){ d = d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtMD(iso){ if(!iso) return '時期不明'; return (+iso.slice(5,7))+'/'+(+iso.slice(8,10)); }
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shift(ym, delta){
  var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+delta;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y+'-'+pad(m+1);
}
function toast(msg, ms){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); }, ms||2200);
}

/* ── 2b. おまかせ判定と表記ゆれの統合 ───────
   ユーザーには「起きたことを一文」だけ求める。
   カテゴリを選ばなければ、本文から3つのどれかへ自動で寄せる。 */
var AUTO_NEG = ['疲れ','つら','しんど','消耗','空虚','もやもや','うまくいかな','できなかった','言えなかった',
  '違和感','怒','悔','焦','不安','嫌','ばかり','だけで終わ','虚し','無駄','手応えがな','意味がな','つまらな'];
/* 「何も◯◯しなかった」のような、不足を言い表す形も引っかかったに寄せる */
var AUTO_NEG_RE = [/何も[^。]{0,12}(な|ず)/, /(感じ|手応え|実感)が[^。]{0,4}しなかった/, /残らな/];
var AUTO_ACT = ['つくった','作った','書いた','描いた','まとめ','整理','設計','企画','担当','構成','編集',
  '対応','伝えた','提案','相談','面談','決めた','選んだ','始めた','完成','発表','手伝','助け','進めた','考え'];
var AUTO_MOV = ['心が','惹か','よかった','嬉し','美し','好き','감','感動','ぐっと','立ち止ま','見と','心地',
  '気になっ','憧れ','うらやま','沁み','刺さ','静か','ほっと'];
function autoKind(text){
  var t = String(text||'');
  var score = {moved:0, effort:0, hard:0};
  AUTO_NEG.forEach(function(w){ if(t.indexOf(w)>=0) score.hard += 2; });
  AUTO_NEG_RE.forEach(function(re){ if(re.test(t)) score.hard += 2.5; });
  AUTO_ACT.forEach(function(w){ if(t.indexOf(w)>=0) score.effort += 1; });
  AUTO_MOV.forEach(function(w){ if(t.indexOf(w)>=0) score.moved += 1.4; });
  var best='moved', bv=-1;
  ['hard','effort','moved'].forEach(function(k){ if(score[k]>bv){ bv=score[k]; best=k; } });
  return bv<=0 ? 'moved' : best;
}
/* 同じものを別ノードにしないための言い換え統合 */
var ALIAS = {
  'ChatGPT':'AI対話','Claude':'AI対話','生成AI':'AI対話','AIとの壁打ち':'AI対話','AIと話した':'AI対話',
  '美術館':'展示','ギャラリー':'展示','個展':'展示','作品展':'展示',
  '水彩画':'水彩','絵画':'絵','ドローイング':'絵',
  '打ち合わせ':'会議','ミーティング':'会議','MTG':'会議',
  '企画書':'企画','提案書':'企画'
};
function canon(x){ x=String(x||'').trim(); return ALIAS[x] || x; }
function canonList(arr){
  var out=[], seen={};
  (arr||[]).forEach(function(x){ var c=canon(x); if(c && !seen[c]){ seen[c]=1; out.push(c); } });
  return out;
}

/* ── 3. 状態 ──────────────────────────── */
var S = {
  logs:[],        // {id,kind,body,occurred_at,place,people[],tags[]}
  months:{},      // 'YYYY-MM' -> {title, chapter:{...}, tone, angle}
  years:{},       // 'YYYY'    -> {title}
  futures:[],     // {id,body,mode,due,done_at}
  cfg:{ supabaseUrl:'', supabaseKey:'', claudeKey:'', userKey:'', model:'claude-sonnet-4-5', fb:{} },
  ym: todayISO().slice(0,7),
  year: todayISO().slice(0,4),
  view: 'log',
  mapMode: 'all',
  filter: 'all',
  openYM: {}       // Listで開いている月
};

/* ── 4. 保存層（localStorage ＋ Supabase REST）─────────────
   Supabase の URL / anon key が設定されていれば、
   PostgREST 経由で読み書きし、常に localStorage にも複製する。
   未設定なら完全にローカルだけで動く。            */
var Store = (function(){
  function local(){
    try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; }
  }
  function saveLocal(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        logs:S.logs, months:S.months, years:S.years, futures:S.futures, cfg:S.cfg
      }));
    }catch(e){}
  }
  function on(){ return !!(S.cfg.supabaseUrl && S.cfg.supabaseKey && S.cfg.userKey); }
  function url(path){ return S.cfg.supabaseUrl.replace(/\/$/,'') + '/rest/v1/' + path; }
  function hd(extra){
    var h = { 'apikey':S.cfg.supabaseKey, 'Content-Type':'application/json' };
    /* 旧来の anon キー(JWT)は Authorization も必要。
       新形式の sb_publishable_... は apikey だけで anon ロールとして通る。 */
    if(/^eyJ/.test(S.cfg.supabaseKey)) h['Authorization'] = 'Bearer ' + S.cfg.supabaseKey;
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  }
  function q(table, params){
    return fetch(url(table+'?user_key=eq.'+encodeURIComponent(S.cfg.userKey)+(params?'&'+params:'')),
      {headers:hd()}).then(function(r){ if(!r.ok) throw new Error(table+' '+r.status); return r.json(); });
  }
  function upsert(table, row){
    if(!on()) { saveLocal(); return Promise.resolve(); }
    row = Object.assign({user_key:S.cfg.userKey}, row);
    return fetch(url(table), {method:'POST', headers:hd({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(row)}).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); });
  }
  function del(table, id){
    if(!on()) { saveLocal(); return Promise.resolve(); }
    return fetch(url(table+'?id=eq.'+encodeURIComponent(id)+'&user_key=eq.'+encodeURIComponent(S.cfg.userKey)),
      {method:'DELETE', headers:hd()});
  }
  return {
    on:on, saveLocal:saveLocal,
    boot:function(){
      var d = local();
      if(d){
        S.logs = d.logs||[]; S.months = d.months||{}; S.years = d.years||{};
        S.futures = d.futures||[]; S.cfg = Object.assign(S.cfg, d.cfg||{});
      }
      if(!S.cfg.userKey) S.cfg.userKey = 'me-'+uid();
      if(dedupeInMemory()) saveLocal();      /* 重複は読み込み時点で落としておく */
    },
    /* サーバとローカルを「足し合わせて」揃える。
       どちらか一方が空でも、もう一方のデータを消さない。 */
    pull:function(){
      if(!on()) return Promise.resolve(false);
      var mine = {logs:S.logs.slice(), futures:S.futures.slice(),
                  months:Object.assign({},S.months), years:Object.assign({},S.years)};
      return Promise.all([
        q('logs','order=occurred_at.asc'), q('months',''), q('years',''), q('futures','')
      ]).then(function(res){
        var rLogs = (res[0]||[]).map(function(r){
          return {id:r.id, kind:r.kind, body:r.body, occurred_at:r.occurred_at,
                  place:r.place||'', people:r.people||[], tags:r.tags||[]};
        });
        var rFut = (res[3]||[]).map(function(r){
          return {id:r.id, body:r.body, mode:r.mode, due:r.due, done_at:r.done_at};
        });
        var seen={}; rLogs.forEach(function(l){ seen[l.id]=1; });
        var pushLogs = mine.logs.filter(function(l){ return !seen[l.id]; });
        S.logs = rLogs.concat(pushLogs).sort(function(a,b){ return a.occurred_at<b.occurred_at?-1:1; });

        var seenF={}; rFut.forEach(function(f){ seenF[f.id]=1; });
        var pushFut = mine.futures.filter(function(f){ return !seenF[f.id]; });
        S.futures = rFut.concat(pushFut);

        S.months = {}; (res[1]||[]).forEach(function(r){
          S.months[r.ym]={title:r.title, chapter:r.chapter, tone:r.tone, angle:r.angle}; });
        var pushM=[]; Object.keys(mine.months).forEach(function(k){
          if(!S.months[k] || (!S.months[k].title && mine.months[k].title)){ S.months[k]=mine.months[k]; pushM.push(k); } });

        S.years = {}; (res[2]||[]).forEach(function(r){ S.years[r.year]={title:r.title}; });
        var pushY=[]; Object.keys(mine.years).forEach(function(k){
          if(!S.years[k] || (!S.years[k].title && mine.years[k].title)){ S.years[k]=mine.years[k]; pushY.push(k); } });

        dedupeInMemory();
        saveLocal();
        var jobs = pushLogs.map(function(l){ return upsert('logs', l); })
          .concat(pushFut.map(function(f){ return upsert('futures', f); }))
          .concat(pushM.map(function(k){ var m=S.months[k];
            return upsert('months',{id:S.cfg.userKey+':'+k, ym:k, title:m.title||null, chapter:m.chapter||null, tone:m.tone||null, angle:m.angle||null}); }))
          .concat(pushY.map(function(k){
            return upsert('years',{id:S.cfg.userKey+':'+k, year:k, title:(S.years[k]||{}).title||null}); }));
        var pushed = jobs.length;
        return Promise.all(jobs).catch(function(e){ console.warn('push', e); }).then(function(){ return pushed; });
      });
    },
    putLog:function(l){ saveLocal(); return upsert('logs', l).catch(errSync); },
    delLog:function(id){ saveLocal(); return del('logs', id).catch(errSync); },
    putMonth:function(ym){ saveLocal(); var m=S.months[ym]||{};
      return upsert('months', {id:S.cfg.userKey+':'+ym, ym:ym, title:m.title||null, chapter:m.chapter||null,
        tone:m.tone||null, angle:m.angle||null}).catch(errSync); },
    putYear:function(y){ saveLocal(); var v=S.years[y]||{};
      return upsert('years', {id:S.cfg.userKey+':'+y, year:y, title:v.title||null}).catch(errSync); },
    putFuture:function(f){ saveLocal(); return upsert('futures', f).catch(errSync); },
    delFuture:function(id){ saveLocal(); return del('futures', id).catch(errSync); }
  };
  function errSync(e){ console.warn('sync', e); toast('同期に失敗しました（端末には保存済み）'); }
})();

/* 同じ内容の記録は一度きりにする。読み込み・同期のたびに通す。 */
function dedupeInMemory(){
  var seen={}, out=[], removed=0;
  S.logs.slice().sort(function(a,b){ return a.id<b.id?-1:1; }).forEach(function(l){
    var k=kindOf(l)+'|'+l.occurred_at+'|'+String(l.body||'').trim();
    if(seen[k]){ removed++; return; } seen[k]=1; out.push(l);
  });
  S.logs = out.sort(function(a,b){ return a.occurred_at<b.occurred_at?-1:1; });
  var fs={}, fo=[], fr=0;
  S.futures.slice().sort(function(a,b){ return a.id<b.id?-1:1; }).forEach(function(f){
    var k=String(f.body||'').trim()+'|'+(f.mode||'')+'|'+(f.due||'')+'|'+(f.done_at||'');
    if(fs[k]){ fr++; return; } fs[k]=1; fo.push(f);
  });
  S.futures = fo;
  S.dupCount = removed + fr;
  return S.dupCount;
}

/* ── 5. シート（ボトムモーダル）────────── */
var Sheet = (function(){
  var el=$('#sheet'), sc=$('#scrim'), body=$('#sheetBody'), openFlag=false;
  function open(html, after){
    body.innerHTML = html; el.classList.add('on'); sc.classList.add('on'); openFlag=true;
    if(after) after(body);
  }
  function close(){ el.classList.remove('on'); sc.classList.remove('on'); openFlag=false; }
  sc.addEventListener('click', close);
  return {open:open, close:close, isOpen:function(){ return openFlag; }, body:function(){ return body; }};
})();

/* ── 6. LOG 画面 ─────────────────────────── */
function logsOfMonth(ym){
  return S.logs.filter(function(l){ return ymOf(l.occurred_at)===ym; })
               .sort(function(a,b){ return a.occurred_at<b.occurred_at?-1:1; });
}
function renderQuick(){
  var w=$('#quickRow'); w.innerHTML='';
  KINDS.concat([{id:'auto', ja:'おまかせ', v:'--muted', hint:'アプリが3つのどれかに寄せます'}])
   .forEach(function(k){
    var b=document.createElement('button');

function renderFuture(){
  var w=$('#futureList');

  if(!open.length){ w.innerHTML='<p class="empty">叶えたいことを、ここに置いておけます</p>'; return; }
  var order = {exact:0, by:1, after:2, anytime:3};
  open.sort(function(a,b){
    var d = (order[a.mode]||9)-(order[b.mode]||9); if(d) return d;
    return (a.due||'9999')<(b.due||'9999')?-1:1;
  });
  w.innerHTML = open.map(function(f){
    var dd = f.due ? (yearOf(f.due)===todayISO().slice(0,4) ? fmtMD(f.due) : f.due.slice(2,4)+'/'+fmtMD(f.due)) : '';
    var when = f.mode==='anytime' ? 'いつか'
             : f.mode==='by' ? dd+' まで'
             : f.mode==='after' ? dd+' 以降' : dd;

      '<span class="t">'+esc(f.body)+'</span><span class="go">○</span></button>';

    b.onclick = function(){ openFutureSheet(S.futures.filter(function(x){return x.id===b.dataset.id;})[0]); };

function openLogSheet(seed){

    '<h2>'+(isNew?'今日、何が残った？':'ログを編集')+'</h2><p class="sub">一文でかまいません。分類は「おまかせ」でも大丈夫です</p>'+

      };

        f.done_at = f.done_at ? null : todayISO();

        Store.putFuture(f); Sheet.close(); renderAll();

        Store.delFuture(f.id); Sheet.close(); renderAll();
      };
      b.querySelector('#_ng').onclick=Sheet.close;
    });
}

function lexHits(item, text){ var n=0; for(var i=0;i<item.w.length;i++){ if(text.indexOf(item.w[i])>=0) n++; } return n; }
function hash01(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%100000)/100000;
}
function monthsBetween(a,b){                     /* 'YYYY-MM' の差 */

  {v:'対応する',   w:['対応','問い合わせ','依頼','調整','返信']}
];
var NEED_LEX = [
  {n:'創造',   w:['つくった感じがしな','何も残ら','作れな','消化','ルーティン','単調']},
  {n:'完結感', w:['終わらな','細切れ','中途半端','途切れ','散らか']},
  {n:'意味',   w:['意味が','虚し','空虚','何のため','納得できな']},
  {n:'余白',   w:['急ぎ','詰まっ','休めな','余裕がな','時間がな']},
  {n:'裁量',   w:['言われた','指示','決められ','任されな','勝手に決め']}
];
var CHOICE_W = ['決めた','決めない','選んだ','選び直','断っ','やめた','とどまる','進むと','行くと決め'];
var WISH_W   = ['したい','たい。','いつか','来年','叶え','ひらきたい','なりたかった','なりたい','続けたい','試したい'];
function hitAny(t, ws){ for(var i=0;i<ws.length;i++){ if(t.indexOf(ws[i])>=0) return true; } return false; }
function toLogEntry(l){
  if(l.entry) return l.entry;                    /* 既に構造化済みならそのまま使う */
  var k = kindOf(l);
  var text = (l.body||'') + ' ' + (l.tags||[]).join(' ') + ' ' + (l.place||'');
  var et = {moved:'moved', effort:'effort', hard:'pain'}[k] || 'moved';
  var isChoice = hitAny(text, CHOICE_W) || l.kind==='chose';
  var isWish   = hitAny(text, WISH_W)   || l.kind==='wish';
  var val = {moved:.7, effort:.3, pain:-.7}[et];
  var strong = ['泣','怖','勇気','嬉','悔','疲れ','違和感','肩の力','心が','決め','惹か','立ち止ま'];
  var bump = 0; strong.forEach(function(x){ if(text.indexOf(x)>=0) bump += .08; });
  var ids = function(dict){ return dict.filter(function(d){ return lexHits(d,text)>0; }).map(function(d){ return d.id; }); };
  var conds = LEX.conditions.filter(function(d){ return lexHits(d,text)>0; });
  var drain = conds.some(function(c){ return c.energy==='drain'; }) || et==='pain';
  var gain  = conds.some(function(c){ return c.energy==='gain'; })  || et==='moved' || isChoice;
  var energy = drain ? 'drain' : (gain ? 'gain' : 'neutral');
  var dom = 'life';
  if(/仕事|会社|企画|面談|転職|キャリア|評価|職|プロジェクト|資料|上司|部長|問い合わせ|依頼/.test(text)) dom='career';
  else if((l.people||[]).length) dom='relationship';
  else if(ids(LEX.interests).length || et==='moved') dom='likes';
  /* 裁量と創作の余地。自分で決めた記述があれば高く、依頼・指示なら低く。 */
  var autonomy = isChoice ? .9 : et==='effort' ? .65 : et==='pain' ? .25 : .4;
  if(/言われ|指示|依頼|問い合わせ|対応/.test(text)) autonomy = Math.min(autonomy, .25);
  if(/自分で|自分の言葉|勝手に|自主/.test(text)) autonomy = Math.max(autonomy, .85);
  var creative = /つく|作|描|企画|設計|構成|物語|デザイン|制作/.test(text) ? .8
               : /対応|調整|返信|処理/.test(text) ? .15 : .4;
  var verbs = VERB_LEX.filter(function(d){ return hitAny(text, d.w); }).map(function(d){ return d.v; });
  var needs = et==='pain' ? NEED_LEX.filter(function(d){ return hitAny(text, d.w); }).map(function(d){ return d.n; }) : [];
  var social = (l.people||[]).length ? '人と一緒'
             : /依頼|問い合わせ|言われ|指示/.test(text) ? '他者からの依頼' : 'ひとり';
  var inten = Math.max(.15, Math.min(1, Math.abs(val)*0.8 + bump));
  return {
    id:l.id, occurredAt: l.undated ? null : l.occurred_at, rawText:l.body||'', eventType:et, domain:dom,
    isChoice:isChoice, isWish:isWish,
    action: verbs, objects: canonList(l.tags||[]),
    entities: canonList((l.tags||[]).concat(l.people||[]).concat(l.place?[l.place]:[])),
    people: canonList(l.people||[]),
    emotionalValence:val, arousal: inten, emotionalIntensity: inten,
    agency: autonomy, autonomy: autonomy, creativeControl: creative,
    energy:energy, energyDelta: energy==='gain' ? .6 : energy==='drain' ? -.7 : 0,
    socialContext: social,
    candidateValues: ids(LEX.values), candidateStrengths: ids(LEX.strengths),
    candidateInterests: ids(LEX.interests), candidateConditions: conds.map(function(c){ return c.id; }),
    strengthVerbs: verbs, missingNeeds: needs,
    tensions: [], wishes: isWish ? [l.body] : [],
    futureIntent: isWish ? l.body : null,
    importance: l.importance||0, userConfirmed: !!l.userConfirmed,
    confidence: Math.min(1, .45 + verbs.length*0.12 + (l.tags||[]).length*0.06)
  };
}
/* Future Memo も証拠として扱う（未来側の記録） */
function futureEntry(f){
  var text = f.body||'';
  var ids = function(dict){ return dict.filter(function(d){ return lexHits(d,text)>0; }).map(function(d){ return d.id; }); };
  return {
    id:'f:'+f.id, occurredAt: f.done_at || f.due || null, rawText:text, eventType:'wish',
    domain:'life', entities:[], emotionalValence:.5, emotionalIntensity:.5, agency:.6,
    energy:'gain', candidateValues:ids(LEX.values), candidateStrengths:[],
    candidateInterests:ids(LEX.interests), candidateConditions:[],
    tensions:[], wishes:[text], importance:0, userConfirmed:false, isFuture:true, isWish:true, isChoice:false,
    action:[], objects:[], people:[], arousal:.5, autonomy:.6, creativeControl:.5,
    energyDelta:.6, socialContext:'ひとり', strengthVerbs:[], missingNeeds:[],
    futureIntent:text, confidence:.6, due:f.due, doneAt:f.done_at
  };
}

/* ── フィードバック（自分らしい／少し違う）── */
function fbGet(id){ return (S.cfg.fb||{})[id] || 0; }
function fbSet(id, v){
  S.cfg.fb = S.cfg.fb || {};
  if(S.cfg.fb[id]===v) delete S.cfg.fb[id]; else S.cfg.fb[id]=v;
  Store.saveLocal();
}

/* ── 洞察の生成 ── */
var Insight = (function(){
  function mk(kind, id, label, sum, evs){
    return {id:id, kind:kind, label:label, summary:sum, score:0, confidence:0,
            evidenceIds:evs.slice(), relatedValueIds:[], confirmed:false};
  }
  function stats(entries, evs){
    var es = evs.map(function(id){ return entries[id]; }).filter(Boolean);
    var months={}, domains={}, choice=0, effort=0, emo=0, minM=null, maxM=null;
    es.forEach(function(e){
      if(e.occurredAt){ var m=e.occurredAt.slice(0,7); months[m]=1;
        if(!minM||m<minM) minM=m; if(!maxM||m>maxM) maxM=m; }
      domains[e.domain]=1;
      if(e.isChoice||e.agency>=.8) choice++;
      if(e.agency>=.6) effort++;
      emo += e.emotionalIntensity;
    });
    var n = es.length||1;
    return {n:es.length, months:Object.keys(months).length, domains:Object.keys(domains).length,
            choice:choice/n, effort:effort/n, emo:emo/n, minM:minM, maxM:maxM,
            span: (minM&&maxM)? monthsBetween(minM,maxM) : 0};
  }
  function identityScore(st, node){
    var W=MAPC.IDENTITY_W;
    var stated = (fbGet(node.id)>0 ? 1 : 0);
    return  W.choice*st.choice + W.repeat*Math.min(1,(st.n-1)/3) + W.emotion*st.emo +
            W.domain*Math.min(1,(st.domains-1)/2) + W.effort*st.effort +
            W.duration*Math.min(1, st.span/12) + W.stated*stated;
  }
  function tierOf(st){
    if(st.n >= MAPC.PROMOTE.identity && (st.months>=2 || st.domains>=2)) return 'identity';
    if(st.n >= MAPC.PROMOTE.pattern) return 'pattern';
    return 'seed';
  }
  function build(){
    var entries = {}, order = [];
    S.logs.forEach(function(l){ var e=toLogEntry(l); entries[e.id]=e; order.push(e.id); });
    S.futures.forEach(function(f){ var e=futureEntry(f); entries[e.id]=e; order.push(e.id); });

    var nodes = [], byId = {};
    function add(n){ nodes.push(n); byId[n.id]=n; return n; }

    /* self */
    var self = add(mk('self','self','いまの自分','','' ? [] : order.slice(0,1)));
    self.evidenceIds = order.slice();

    /* 価値観・強み・条件・惹かれるもの */
    function collect(dict, kind, field){
      dict.forEach(function(d){
        var evs = order.filter(function(id){ return (entries[id][field]||[]).indexOf(d.id)>=0; });
        if(!evs.length) return;
        var n = add(mk(kind, d.id, d.label, d.sum, evs));
        n.chip = d.chip; n.energy = d.energy;
        var st = stats(entries, evs);
        n.stat = st; n.tier = tierOf(st);
        n.identity = identityScore(st, n);
        n.confidence = Math.min(1, .25 + evs.length*0.25 + (st.domains-1)*.1);
        n.firstSeenAt = st.minM; n.lastSeenAt = st.maxM;
        n.confirmed = fbGet(d.id)>0;
      });
    }
    collect(LEX.values,     'value',     'candidateValues');
    collect(LEX.strengths,  'strength',  'candidateStrengths');
    collect(LEX.conditions, 'condition', 'candidateConditions');
    collect(LEX.interests,  'interest',  'candidateInterests');

    /* 価値観との関係づけ */
    nodes.forEach(function(n){
      if(n.kind==='value'||n.kind==='self') return;
      var vs={};
      n.evidenceIds.forEach(function(id){ (entries[id].candidateValues||[]).forEach(function(v){ vs[v]=(vs[v]||0)+1; }); });
      n.relatedValueIds = Object.keys(vs).filter(function(v){ return byId[v]; })
        .sort(function(a,b){ return vs[b]-vs[a]; }).slice(0,2);
    });

    /* 葛藤 */
    LEX.tensions.forEach(function(t){
      var have = t.need.every(function(id){ return byId[id]; });
      var withN = t.with.filter(function(id){ return byId[id]; });
      if(!have || !withN.length) return;
      var evs = [];
      t.need.concat(withN).forEach(function(id){ (byId[id].evidenceIds||[]).forEach(function(e){ if(evs.indexOf(e)<0) evs.push(e); }); });
      if(!evs.length) return;
      var n = add(mk('tension', t.id, t.label, t.sum, evs.slice(0,6)));
      var st = stats(entries, n.evidenceIds);
      n.stat=st; n.tier = st.n>=2?'pattern':'seed';
      n.identity = identityScore(st, n);
      n.confidence = Math.min(.85, .3 + evs.length*.12);
      n.relatedValueIds = t.need.concat(withN).filter(function(id){ return byId[id] && byId[id].kind==='value'; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(t.id)>0;
    });

    /* 願い（過去から続いているもの・Future Memo）*/
    order.forEach(function(id){
      var e = entries[id];
      if(!(e.isWish || e.isFuture)) return;
      var n = add(mk('wish','w:'+id, e.rawText,
        e.isFuture ? '未来へ置いた願い。いまの記録と線でつながっています。'
                   : '過去に書いた願い。いまの記録の中に、まだ現れています。', [id]));
      n.isFuture = !!e.isFuture; n.due = e.due; n.doneAt = e.doneAt;
      /* 過去の願いが、あとの記録に同じ価値観で現れ直していれば、その線をつなぐ */
      if(!n.isFuture && (e.candidateValues||[]).length){
        var echo = order.filter(function(oid){
          var o = entries[oid];
          if(oid===id || o.isWish) return false;
          return (o.candidateValues||[]).some(function(v){ return e.candidateValues.indexOf(v)>=0; });
        });
        if(echo.length >= 2){
          n.evidenceIds = [id].concat(echo.slice(0,4));
          n.summary = '過去の願いは消えたのではなく、仕事の余白や、心が緩んだ時間の中に繰り返し現れています。';
          n.echo = true;
        }
      }
      var st = stats(entries, n.evidenceIds); n.stat=st; n.tier = n.echo ? 'pattern' : 'seed';
      n.identity = (n.echo? .55 : .3) + identityScore(st,n)*.6;
      n.confidence = n.echo? .7 : .5;
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(n.id)>0;
    });

    /* 転機：選択のうち、主体性と感情が強いもの */
    order.forEach(function(id){
      var e = entries[id];
      if(!e.isChoice) return;
      var w = e.agency*.6 + e.emotionalIntensity*.4;
      if(w < .55) return;
      var n = add(mk('turningPoint','t:'+id, e.rawText, '方向を選び直した場面です。', [id]));
      var st=stats(entries,[id]); n.stat=st; n.tier='seed';
      n.identity = w; n.confidence=.7;
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(n.id)>0;
    });

    /* 章（月・年）*/
    Object.keys(S.months).forEach(function(ym){
      var t=(S.months[ym]||{}).title; if(!t) return;
      var evs = order.filter(function(id){ var o=entries[id].occurredAt; return o && o.slice(0,7)===ym; });
      if(!evs.length) return;
      var n = add(mk('chapter','m:'+ym, t, ym.slice(0,4)+'年'+(+ym.slice(5,7))+'月の章', evs));
      n.ym=ym; n.level='month'; n.identity=.45; n.confidence=.9; n.tier='pattern';
      n.firstSeenAt=ym; n.lastSeenAt=ym;
    });
    Object.keys(S.years).forEach(function(y){
      var t=(S.years[y]||{}).title; if(!t) return;
      var evs = order.filter(function(id){ var o=entries[id].occurredAt; return o && o.slice(0,4)===y; });
      if(!evs.length) return;
      var n = add(mk('chapter','y:'+y, t, y+'年の章', evs));
      n.year=y; n.level='year'; n.identity=.6; n.confidence=.9; n.tier='identity';
      n.firstSeenAt=y+'-01'; n.lastSeenAt=y+'-12';
    });

    /* 根拠ノード */
    order.forEach(function(id){
      var e = entries[id];
      var n = add(mk('evidence','e:'+id, e.rawText, '', [id]));
      n.entry=e; n.identity = .2 + e.emotionalIntensity*.3; n.confidence=1; n.tier='seed';
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt = e.occurredAt ? e.occurredAt.slice(0,7) : null;
      n.lastSeenAt = n.firstSeenAt;
    });

    /* 「次に広げる」候補：上位タグが2つ以上一致したものだけ */
    var strongIds = nodes.filter(function(n){ return n.kind==='interest'||n.kind==='value'; })
      .sort(function(a,b){ return b.identity-a.identity; }).slice(0,5).map(function(n){ return n.id; });
    LEX.recos.forEach(function(r){
      var hit = r.tags.filter(function(t){ return strongIds.indexOf(t)>=0; });
      if(hit.length < 2) return;
      var evs=[]; hit.forEach(function(t){ (byId[t].evidenceIds||[]).slice(0,2).forEach(function(e){ if(evs.indexOf(e)<0) evs.push(e); }); });
      if(!evs.length) return;
      var n = add(mk('recommendation', r.id, r.label,
        hit.map(function(t){ return '「'+byId[t].label+'」'; }).join('と')+'の記録が重なっているので、ここを勧めています。', evs));
      n.identity=.35; n.confidence=.5; n.tier='seed'; n.relatedValueIds=hit.filter(function(t){ return byId[t].kind==='value'; });
    });

    /* 次の小さな実験：強み仮説 × 活力条件 × 最近の関心 から、検証できる一歩を作る。
       「次の正解」ではなく「次に検証すること」を返す。 */
    var topS = nodes.filter(function(n){ return n.kind==='strength'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    var topC = nodes.filter(function(n){ return n.kind==='condition' && n.energy==='gain'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    var topI = nodes.filter(function(n){ return n.kind==='interest'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    if(topS && topC){
      var evs2=[];
      [topS, topC, topI].forEach(function(x){ if(x) (x.evidenceIds||[]).slice(0,2).forEach(function(e){ if(evs2.indexOf(e)<0) evs2.push(e); }); });
      var n2 = add(mk('experiment','x_next', '「'+topS.label+'」を、小さく試す',
        topC.label + '状態で、' + (topI? '「'+topI.label+'」に近いテーマで' : '身近なテーマで') +
        '、5人以下の小さな企画を1つだけ設計してみる。うまくいくかではなく、力が出るかを確かめる実験です。', evs2));
      n2.identity=.5; n2.confidence=.55; n2.tier='seed';
      n2.relatedValueIds = (topS.relatedValueIds||[]).slice(0,2);
      n2.firstSeenAt = topS.lastSeenAt; n2.lastSeenAt = topS.lastSeenAt;
      n2.confirmed = fbGet('x_next')>0;
    }

    self.summary = '';
    self.identity = 1; self.confidence = 1; self.tier='identity';

    return {entries:entries, order:order, nodes:nodes, byId:byId};
  }
  return {build:build, stats:stats};
})();

/* ── ビューごとの選抜とスコア ── */
function viewFit(n, mode){
  if(mode==='likes')  return ({interest:1, value:.85, wish:.6, recommendation:.7, tension:.45, evidence:.3, self:1, strength:.2, condition:.2, turningPoint:.3, chapter:.15, experiment:.3})[n.kind]||.2;
  if(mode==='career') return ({strength:1, condition:.9, experiment:.88, tension:.8, value:.7, wish:.5, turningPoint:.6, evidence:.3, self:1, interest:.25, chapter:.15, recommendation:.2})[n.kind]||.2;
  return ({chapter:1, turningPoint:.95, value:.8, wish:.7, tension:.6, evidence:.5, self:1, interest:.4, strength:.4, condition:.35, recommendation:.2, experiment:.45})[n.kind]||.2;
}
function currentness(n){
  if(!n.lastSeenAt) return .4;
  var m = monthsBetween(n.lastSeenAt.slice(0,7), todayISO().slice(0,7));
  return Math.max(0, 1 - Math.abs(m)/14);
}
function displayScore(n, mode){
  var W = MAPC.DISPLAY_W;
  var bridge = Math.min(1, (n.relatedValueIds||[]).length/2);
  var ev = Math.min(1, (n.evidenceIds||[]).length/3);
  var base = W.identity*(n.identity||0) + W.viewFit*viewFit(n,mode) + W.current*currentness(n) +
             W.bridge*bridge + W.evidence*ev;
  var fb = fbGet(n.id);
  if(fb>0) base = Math.min(1, base*1.25 + .08);
  if(fb<0) base = base*0.45;
  return base;
}

/* ══════════════════════════════════════════════════
   9. MAP：決定論的レイアウト＋宇宙の描画
   ══════════════════════════════════════════════════ */
var Map3 = (function(){
  var stage, cv, ctx, layer, W=0, H=0, dpr=1;
  var G=null, view=null, cam={x:0,y:0,z:1}, sel=null, chip=null, raf=0, intro=0, built=false;
  var nodeDrag=null;
  var stars=[], nebula=[];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 星と星雲は一度だけ決定論的に作る ---- */
  function seedSky(){
    stars=[]; nebula=[];
    for(var i=0;i<110;i++){
      var a=hash01('s'+i), b=hash01('t'+i), c=hash01('u'+i);
      stars.push({x:(a-.5)*1700, y:(b-.5)*1700, r:.4+c*1.1, o:.18+c*.5});
    }
    for(var j=0;j<4;j++){
      nebula.push({x:(hash01('n'+j)-.5)*1100, y:(hash01('m'+j)-.5)*1100,
                   r:260+hash01('r'+j)*260, h:['#1B2450','#22204A','#16303F','#2A1F3D'][j]});
    }
  }

  /* ---- レイアウト（日付とスコアから決まる。毎回同じ位置） ---- */
  function layout(mode, list, labelSet){
    var byId={}; list.forEach(function(n){ byId[n.id]=n; });
    var nowYM = todayISO().slice(0,7);
    function place(n,x,y){ n.x=x; n.y=y; }
    place(byId['self'], 0, 0);

    if(mode==='all'){
      var R=MAPC.ALLRING;
      var vs = list.filter(function(n){ return n.kind==='value'; });
      vs.forEach(function(n,i){
        var a = -Math.PI/2 + i*(Math.PI*2/Math.max(vs.length,1));
        place(n, Math.cos(a)*R.value, Math.sin(a)*R.value);
      });
      var buckets = {};
      list.forEach(function(n){
        if(n.kind==='self'||n.kind==='value') return;
        n.comet=false; n.foggy=false;
        var when = n.lastSeenAt || n.firstSeenAt;
        if(n.kind==='wish' && n.isFuture){
          var ahead = n.due ? Math.max(1, monthsBetween(nowYM, n.due.slice(0,7))) : 6;
          var aa = -Math.PI/2 - 1.05 - ahead*0.13;
          var rr = R.base + ahead*R.step*0.55;
          place(n, Math.cos(aa)*rr, Math.sin(aa)*rr); n.comet=true; return;
        }
        if(!when){                                   /* 時期不明は外側の淡い星雲へ */
          var an = Math.PI*0.74 + hash01(n.id)*0.42;
          place(n, Math.cos(an)*520, Math.sin(an)*520); n.foggy=true; return;
        }
        var ago = Math.max(0, monthsBetween(when.slice(0,7), nowYM));
        (buckets[ago] = buckets[ago] || []).push(n);
      });
      Object.keys(buckets).forEach(function(k){
        var ago=+k, arr=buckets[k];
        arr.sort(function(a,b){ return (b.display||b.identity||0)-(a.display||a.identity||0); });
        var band = Math.min(1.55, 0.30 + arr.length*0.16);
        var mid = -Math.PI/2 + ago*0.66;
        arr.forEach(function(n,i){
          var t = arr.length===1 ? .5 : i/(arr.length-1);
          var a = mid - band/2 + band*t;
          var r = R.base + ago*R.step + (n.kind==='evidence'? 26 : 0) + (hash01(n.id)-.5)*22;
          place(n, Math.cos(a)*r, Math.sin(a)*r);
        });
      });
      return;
    }

    /* 好きなこと／キャリア：中心から外へ、種類ごとに角度領域を固定 */
    var ring = MAPC.RING;
    function ringPlace(arr, radius, from, to){
      arr.forEach(function(n,i){
        var t = arr.length===1 ? .5 : i/(arr.length-1);
        var a = from + (to-from)*t;
        place(n, Math.cos(a)*radius, Math.sin(a)*radius);
      });
    }
    /* ラベルを出す星は広く均等に置き、そうでない星は外側へ回す（重なりを根から減らす）*/
    var LS = labelSet || {};
    var labeledV = list.filter(function(n){ return LS[n.id] && n.kind==='value'; });
    var labeledO = list.filter(function(n){ return LS[n.id] && n.kind!=='value' && n.kind!=='self'; });
    var rest     = list.filter(function(n){ return !LS[n.id] && n.kind!=='self' && n.kind!=='evidence'; });
    var evs      = list.filter(function(n){ return n.kind==='evidence'; });
    labeledV.sort(function(a,b){ return b.display-a.display; });
    labeledO.sort(function(a,b){ return b.display-a.display; });
    ringPlace(labeledV, ring.value, -Math.PI*0.5 - Math.PI*0.66, -Math.PI*0.5 + Math.PI*0.66);
    labeledO.forEach(function(n,i){
      var a = -Math.PI/2 + (i+0.5)*(Math.PI*2/Math.max(labeledO.length,1));
      var r = ring.pattern + (i%2? 34 : 0);
      n.x=Math.cos(a)*r; n.y=Math.sin(a)*r;
    });
    rest.forEach(function(n,i){
      var a = hash01(n.id)*Math.PI*2;
      var r = ring.outer + hash01(n.id+'r')*70;
      n.x=Math.cos(a)*r; n.y=Math.sin(a)*r;
    });
    evs.forEach(function(n){
      var host = byId[(n.relatedValueIds||[])[0]];
      var base = host ? Math.atan2(host.y, host.x) : (hash01(n.id)*Math.PI*2);
      var a = base + (hash01(n.id+'a')-.5)*1.1;
      var r = ring.evidence[0] + hash01(n.id+'r')*(ring.evidence[1]-ring.evidence[0]);
      place(n, Math.cos(a)*r, Math.sin(a)*r);
    });
  }

  /* ---- ビューの組み立て ---- */
  function compose(mode){
    if(!G) G = Insight.build();
    var z = cam.z;
    var pool = G.nodes.filter(function(n){
      if(mode==='likes')  return ['self','value','interest','wish','recommendation','tension','experiment','evidence'].indexOf(n.kind)>=0;
      if(mode==='career') return ['self','value','strength','condition','tension','wish','turningPoint','experiment','evidence'].indexOf(n.kind)>=0;
      if(n.kind==='chapter') return z < MAPC.ZOOM.month ? (z < MAPC.ZOOM.year ? n.level==='year' : true) : true;
      if(n.kind==='evidence') return z >= MAPC.ZOOM.month;
      return true;
    });
    pool.forEach(function(n){ n.display = displayScore(n, mode); });
    var byIdAll={}; pool.forEach(function(n){ byIdAll[n.id]=n; });
    var ranked = pool.slice().sort(function(a,b){ return b.display-a.display; });
    /* ラベルを出す顔ぶれ：ビューの主役を必ず1つずつ確保し、同じ種類が偏らないようにする */
    var must = mode==='likes'  ? ['interest','value','wish','tension']
             : mode==='career'? ['strength','condition','experiment','tension','value']
                              : ['chapter','turningPoint','value','wish'];
    var CAP = {tension:2, turningPoint:2, wish:2, condition:2, chapter:2, recommendation:1, experiment:1};
    var labeled=[], used={}, seenK={};
    function take(n){
      if(!n || used[n.id] || n.kind==='evidence') return false;
      var c = seenK[n.kind]||0;
      if(CAP[n.kind] && c >= CAP[n.kind]) return false;
      if(labeled.length >= MAPC.MAX_LABELED) return false;
      used[n.id]=1; seenK[n.kind]=c+1; labeled.push(n); return true;
    }
    take(byIdAll['self']);
    must.forEach(function(k){
      var top = ranked.filter(function(n){ return n.kind===k; })[0];
      if(top) take(top);
    });
    ranked.forEach(take);
    var labelSet = {}; labeled.forEach(function(n){ labelSet[n.id]=1; });

    /* 線をつくる */
    var edges=[], seen={};
    function link(a,b,w,dashed,why){
      if(!a||!b||a===b) return;
      var k=a.id+'|'+b.id; if(seen[k]) return; seen[k]=1;
      edges.push({a:a,b:b,w:w,dashed:dashed,why:why||''});
    }
    var byId = byIdAll;
    var self = byId['self'];
    ranked.filter(function(n){ return n.kind==='value'; }).slice(0,3).forEach(function(v){
      link(self, v, 1, false, 'いまの自分の軸');
    });
    pool.forEach(function(n){
      if(n.kind==='self'||n.kind==='value') return;
      (n.relatedValueIds||[]).slice(0,2).forEach(function(vid){
        link(byId[vid], n, n.confidence, n.confidence<.55, '同じ価値観に根がある');
      });
      (n.evidenceIds||[]).slice(0,3).forEach(function(eid){
        link(n, byId['e:'+eid], .5, false, 'この出来事が根拠');
      });
    });
    pool.filter(function(n){ return n.kind==='value'; }).forEach(function(v){
      (v.evidenceIds||[]).slice(0,3).forEach(function(eid){ link(v, byId['e:'+eid], .5, v.tier==='seed', 'この出来事が根拠'); });
    });

    /* 初期表示は各ノード2本まで */
    var count={}, primary=[];
    edges.slice().sort(function(a,b){ return b.w-a.w; }).forEach(function(e){
      var ca=count[e.a.id]||0, cb=count[e.b.id]||0;
      if(ca<MAPC.EDGES_PER_NODE && cb<MAPC.EDGES_PER_NODE){
        primary.push(e); count[e.a.id]=ca+1; count[e.b.id]=cb+1;
      }
    });

    layout(mode, pool, labelSet);
    var savedPos = ((S.cfg.pos||{})[mode]) || {};          /* 手で動かした星は、その位置を優先 */
    pool.forEach(function(n){ var q=savedPos[n.id]; if(q){ n.x=q[0]; n.y=q[1]; } });
    return {mode:mode, nodes:pool, byId:byId, edges:edges, primary:primary, labelSet:labelSet,
            ranked:ranked, values: ranked.filter(function(n){ return n.kind==='value'; }).slice(0,3)};
  }

  /* ---- サマリー文 ---- */
  function summarize(v){
    if(!S.logs.length) return '';
    var top = v.ranked.filter(function(n){ return n.kind!=='self'&&n.kind!=='evidence'; })[0];
    if(!top) return 'まだ一つの軸に決めず、記録を集めています。';
    if(v.mode==='likes'){
      var i = v.ranked.filter(function(n){ return n.kind==='interest'; })[0] || top;
      return '「'+i.label+'」に、心が戻っているようです。';
    }
    if(v.mode==='career'){
      var s = v.ranked.filter(function(n){ return n.kind==='strength'; })[0];
      var t = v.ranked.filter(function(n){ return n.kind==='tension'; })[0];
      if(s) return '「'+s.label+'」力が、くり返し現れています。'+(t?' いまは「'+t.label+'」という問いの中にいるようです。':'');
      return '働き方については、まだ言葉を探している途中のようです。';
    }
    var c = v.ranked.filter(function(n){ return n.kind==='chapter'; })[0];
    return (c? '「'+c.label+'」':'いまの章') + 'が、'+ (v.values[0]? '「'+v.values[0].label+'」':'あなたの選び方') +'を中心に進んでいます。';
  }

  /* ---- 描画 ---- */
  function resize(){
    if(!cv) return;
    dpr = Math.min(window.devicePixelRatio||1, 2);
    var r = stage.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw(); syncDom();
  }
  function sx(n){ return W/2 + (n.x+cam.x)*cam.z; }
  function sy(n){ return H/2 + (n.y+cam.y)*cam.z; }
  function related(n){
    if(!sel) return true;
    if(n===sel) return true;
    return view.edges.some(function(e){ return (e.a===sel&&e.b===n)||(e.b===sel&&e.a===n); });
  }
  function chipRelated(n){
    if(!chip) return true;
    if(n.id===chip || n.kind==='self') return true;
    if((n.relatedValueIds||[]).indexOf(chip)>=0) return true;
    if(n.kind==='evidence' && n.entry) return (n.entry.candidateValues||[]).indexOf(chip)>=0;
    return false;
  }
  function alphaOf(n){
    var a = 1;
    if(sel && !related(n)) a = MAPC.DIM;
    if(chip && !chipRelated(n)) a = Math.min(a, MAPC.DIM);
    return a;
  }
  function radiusOf(n){
    var base = n.kind==='self' ? 13 : n.kind==='evidence' ? 2.6 : 4 + (n.display||0)*11;
    return base * (n===sel ? 1.25 : 1);
  }
  function draw(){
    if(!ctx) return;
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070916'); g.addColorStop(.55,'#0C1024'); g.addColorStop(1,'#151A35');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var px = cam.x*0.06*cam.z, py = cam.y*0.06*cam.z;
    nebula.forEach(function(nb){
      var X=W/2+nb.x*.35+px, Y=H/2+nb.y*.35+py;
      var rg=ctx.createRadialGradient(X,Y,0,X,Y,nb.r);
      rg.addColorStop(0, nb.h+'44'); rg.addColorStop(1, nb.h+'00');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(X,Y,nb.r,0,6.284); ctx.fill();
    });
    ctx.fillStyle='#FFFFFF';
    stars.forEach(function(st){
      var X=W/2+st.x*.5+px*2, Y=H/2+st.y*.5+py*2;
      if(X<-10||X>W+10||Y<-10||Y>H+10) return;
      ctx.globalAlpha=st.o*.55; ctx.beginPath(); ctx.arc(X,Y,st.r,0,6.284); ctx.fill();
    });
    ctx.globalAlpha=1;
    if(!view) return;
    var t = intro;

    var list = sel ? view.edges.filter(function(e){ return e.a===sel||e.b===sel; }) : view.primary;
    list.forEach(function(e){
      var A={x:sx(e.a),y:sy(e.a)}, B={x:sx(e.b),y:sy(e.b)};
      var mx=(A.x+B.x)/2 + (B.y-A.y)*0.13, my=(A.y+B.y)/2 - (B.x-A.x)*0.13;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B.x,B.y);
      ctx.strokeStyle = (sel? '#D8B56A' : '#8E97B5');
      ctx.globalAlpha = (sel?0.58:0.15) * Math.min(alphaOf(e.a),alphaOf(e.b)) * t;
      ctx.lineWidth = (sel?0.8:0.5) + e.w*(sel?1.3:0.7);
      ctx.setLineDash(e.dashed?[2,5]:[]);
      ctx.stroke(); ctx.setLineDash([]);
    });
    ctx.globalAlpha=1;

    view.nodes.forEach(function(n){
      var X=sx(n), Y=sy(n), r=radiusOf(n)*cam.z*t;
      if(X<-60||X>W+60||Y<-60||Y>H+60) return;
      var col = MAPCOL[n.kind]||'#8E97B5';
      var a = alphaOf(n) * (0.45 + (n.confidence||.5)*0.55);
      if(n.comet){
        var ang=Math.atan2(n.y,n.x);
        var gx=X-Math.cos(ang)*70*cam.z, gy=Y-Math.sin(ang)*70*cam.z;
        var lg=ctx.createLinearGradient(X,Y,gx,gy);
        lg.addColorStop(0,'rgba(104,203,196,.55)'); lg.addColorStop(1,'rgba(104,203,196,0)');
        ctx.strokeStyle=lg; ctx.lineWidth=Math.max(2,r*1.1); ctx.globalAlpha=a*t;
        ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(gx,gy); ctx.stroke();
      }
      var glow=ctx.createRadialGradient(X,Y,0,X,Y,Math.max(r*4,10));
      glow.addColorStop(0, col+'55'); glow.addColorStop(1, col+'00');
      ctx.globalAlpha=a*0.9; ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(X,Y,Math.max(r*4,10),0,6.284); ctx.fill();
      ctx.globalAlpha=a; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(X,Y,Math.max(r,1.2),0,6.284); ctx.fill();
      if(n.confirmed){ ctx.globalAlpha=a; ctx.strokeStyle='#D8B56A'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(X,Y,r+4,0,6.284); ctx.stroke(); }
      if(n.kind==='tension'){ ctx.globalAlpha=a*.9; ctx.strokeStyle=MAPCOL.tension; ctx.lineWidth=1;
        ctx.setLineDash([2,3]); ctx.beginPath(); ctx.arc(X,Y,r+6,0,6.284); ctx.stroke(); ctx.setLineDash([]); }
      if(n.tier==='seed' && n.kind!=='evidence' && n.kind!=='self'){
        ctx.globalAlpha=a*.35; ctx.strokeStyle=col; ctx.lineWidth=.8;
        ctx.beginPath(); ctx.arc(X,Y,r+3,0,6.284); ctx.stroke();
      }
      if(n===sel){ ctx.globalAlpha=1; ctx.strokeStyle='#F7F1E6'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(X,Y,r+7,0,6.284); ctx.stroke(); }
      ctx.globalAlpha=1;
    });
  }

  /* ---- ラベルと当たり判定（HTML／キーボード対応） ---- */
  function syncDom(){
    if(!view||!layer) return;
    var pad = 66;
    Array.prototype.forEach.call(layer.children, function(el){
      var n = view.byId[el.dataset.id];
      if(!n){ el.style.display='none'; return; }
      var X=sx(n), Y=sy(n), r=radiusOf(n)*cam.z;
      var show = X>-40 && X<W+40 && Y>-30 && Y<H+30;
      el.style.display = show ? '' : 'none';
      if(!show) return;
      if(el.classList.contains('nhit')){
        var d=Math.max(40, r*2+22);
        el.style.width=d+'px'; el.style.height=d+'px';
        el.style.left=X+'px'; el.style.top=Y+'px';
      } else {
        var lx = Math.max(pad, Math.min(W-pad, X));
        el.style.left=lx+'px'; el.style.top=(Y+r+7)+'px';
        el.style.opacity = String(alphaOf(n));
        var labelIt = view.labelSet[n.id] || n===sel ||
                      (sel && view.edges.some(function(e){ return (e.a===sel&&e.b===n)||(e.b===sel&&e.a===n); }));
        el.style.visibility = labelIt ? 'visible' : 'hidden';
        el.style.fontSize = (n.kind==='self'? .82 : n.kind==='evidence'? .62 : .7)+'rem';
      }
    });
    avoidCollisions();
  }
  /* ラベル同士が重なったらずらし、それでも無理なら隠す */
  function avoidCollisions(){
    var sumEl=$('#mapSum'), stageTop=stage.getBoundingClientRect().top;
    var top = sumEl ? Math.min(H*0.4, sumEl.getBoundingClientRect().bottom - stageTop + 10) : 110;
    var bottom = H - 96;                            /* ヒントと「全体を見る」の帯は避ける */
    var items = Array.prototype.filter.call(layer.children, function(el){
      return el.classList.contains('nlabel') && el.style.visibility!=='hidden' && el.style.display!=='none';
    });
    items.sort(function(a,b){
      var na=view.byId[a.dataset.id], nb=view.byId[b.dataset.id];
      return (nb.display||0)-(na.display||0);
    });
    var placed=[];
    items.forEach(function(el){
      var w0=el.offsetWidth, h0=el.offsetHeight;
      var x=parseFloat(el.style.left), y=parseFloat(el.style.top);
      var tries=[[0,0],[0,h0+6],[0,-(h0+24)],[w0*0.55,0],[-w0*0.55,0],[w0*0.55,h0+6],[-w0*0.55,h0+6],[0,(h0+8)*2],[0,-(h0+8)*2],[w0*0.9,h0*0.5],[-w0*0.9,h0*0.5]];
      var ok=false;
      for(var i=0;i<tries.length;i++){
        var cx=Math.max(w0/2+6, Math.min(W-w0/2-6, x+tries[i][0]));
        var cy=Math.max(top, Math.min(bottom-h0, y+tries[i][1]));
        var r={l:cx-w0/2, r:cx+w0/2, t:cy, b:cy+h0};
        var hit = placed.some(function(q){ return !(r.r<q.l-4||r.l>q.r+4||r.b<q.t-2||r.t>q.b+2); });
        if(!hit){ el.style.left=cx+'px'; el.style.top=cy+'px'; placed.push(r); ok=true; break; }
      }
      if(!ok) el.style.visibility='hidden';
    });
  }
  function buildDom(){
    layer.innerHTML='';
    view.nodes.forEach(function(n){
      var hit=document.createElement('button');
      hit.className='nhit'; hit.dataset.id=n.id; hit.type='button';
      hit.setAttribute('aria-label', (KINDJA[n.kind]||'')+'：'+(n.label||'いまの自分')+'。ドラッグで動かせます');
      hit.onclick=function(ev){ ev.stopPropagation(); if(hit._sup){ hit._sup=false; return; } select(n); };
      hit.addEventListener('pointerdown', function(ev){
        ev.stopPropagation(); hit.setPointerCapture(ev.pointerId);
        nodeDrag={n:n, x:ev.clientX, y:ev.clientY, moved:0, id:ev.pointerId};
      });
      hit.addEventListener('pointermove', function(ev){
        if(!nodeDrag || nodeDrag.id!==ev.pointerId) return;
        var dx=ev.clientX-nodeDrag.x, dy=ev.clientY-nodeDrag.y;
        nodeDrag.moved += Math.abs(dx)+Math.abs(dy);
        n.x += dx/cam.z; n.y += dy/cam.z;
        nodeDrag.x=ev.clientX; nodeDrag.y=ev.clientY;
        draw(); syncDom();
      });
      function endDrag(ev){
        if(!nodeDrag || nodeDrag.id!==ev.pointerId) return;
        if(nodeDrag.moved>=8){ hit._sup=true; savePos(n); }
        nodeDrag=null;
      }
      hit.addEventListener('pointerup', endDrag);
      hit.addEventListener('pointercancel', endDrag);
      layer.appendChild(hit);
      var lb=document.createElement('div');
      lb.className='nlabel'; lb.dataset.id=n.id; lb.setAttribute('aria-hidden','true');
      lb.innerHTML = '<span class="mk">'+esc(({value:'VALUE',interest:'LIKES',strength:'STRENGTH',
        condition:'CONDITION',tension:'TENSION',wish:'WISH',turningPoint:'TURNING',chapter:'CHAPTER',
        recommendation:'NEXT',experiment:'EXPERIMENT',self:'NOW',evidence:''})[n.kind]||'')+'</span>'+
        '<span class="lb">'+esc(n.label||'いまの自分')+'</span>';
      layer.appendChild(lb);
    });
  }

  /* 動かした位置を覚えておく（次に開いても同じ場所） */
  function savePos(n){
    S.cfg.pos = S.cfg.pos || {};
    S.cfg.pos[S.mapMode] = S.cfg.pos[S.mapMode] || {};
    S.cfg.pos[S.mapMode][n.id] = [Math.round(n.x), Math.round(n.y)];
    Store.saveLocal();
  }

  /* ---- 選択と詳細カード ---- */
  function select(n){ sel = (sel===n)?null:n; if(sel) showCard(sel); else hideCard(); draw(); syncDom(); }
  function hideCard(){ $('#nodeDetail').classList.remove('on'); }
  function evLine(id){
    var e = G.entries[id]; if(!e) return '';
    var kindJa = ({moved:'心が動いた',effort:'力を使った',pain:'引っかかった'})[e.eventType]||'';
    if(e.isChoice) kindJa += '・選んだ';
    if(e.isWish)   kindJa += '・願った';
    var d = e.occurredAt ? fmtMD(e.occurredAt) : '時期不明';
    return '<div class="nd-ev"><span class="d">'+esc(d)+'</span><span class="t">'+esc(e.rawText)+
           '<em>'+esc(kindJa)+'</em></span></div>';
  }
  function showCard(n){
    var el=$('#nodeDetail'), b=$('#ndBody');
    var col = MAPCOL[n.kind]||'#8E97B5';
    var h='<p class="nd-k"><i style="background:'+col+'"></i>'+esc(KINDJA[n.kind]||'')+'</p>';
    if(n.kind==='self'){
      var vs = view.values;
      var mt = (S.months[todayISO().slice(0,7)]||{}).title;
      h += '<h4>いまの自分</h4><p class="sum">'+
        (vs.length? '記録からは、'+vs.map(function(v){ return '「'+esc(v.label)+'」'; }).join('、')+'が強く現れています。'
                  : 'まだ一つの軸に決めず、記録を集めています。')+'</p>';
      h += '<div class="nd-sec"><h5>今月のテーマ</h5><p>'+esc(mt||'まだ名前がありません')+'</p></div>';
      b.innerHTML=h; el.classList.add('on'); return;
    }
    h += '<h4>'+esc(n.label)+'</h4>';
    if(n.summary) h += '<p class="sum">'+esc(n.summary)+'</p>';
    var st = n.stat||{n:(n.evidenceIds||[]).length, months:1, domains:1};
    var why = n.tier==='identity' ? st.n+'件の記録に、'+st.months+'つの月をまたいで繰り返し現れています。'
            : n.tier==='pattern'  ? st.n+'件の記録に共通して現れています。まだ仮説です。'
            : '1件の記録から見えた芽です。「'+esc(n.label)+'」を大切にしている可能性があります。';
    h += '<div class="nd-sec"><h5>なぜここにある？</h5><p>'+esc(why)+'</p></div>';
    var evs=(n.evidenceIds||[]).slice(0,5).map(evLine).join('');
    if(evs) h += '<div class="nd-sec"><h5>根拠になった記録</h5>'+evs+'</div>';
    var rel=(n.relatedValueIds||[]).map(function(v){ return G.byId[v]? G.byId[v].label : ''; }).filter(Boolean);
    var futures = S.futures.filter(function(f){
      return (n.evidenceIds||[]).indexOf('f:'+f.id)>=0 ||
             (n.kind!=='evidence' && (f.body||'').length && (n.evidenceIds||[]).some(function(id){
               var e=G.entries[id]; return e && e.rawText && f.body && e.rawText.indexOf(f.body.slice(0,4))>=0; }));
    });
    h += '<div class="nd-sec"><div class="nd-meta">'+
      (rel.length? '<span>関連する価値観：'+esc(rel.join('・'))+'</span>':'')+
      (n.firstSeenAt? '<span>最初に現れた：'+esc(n.firstSeenAt)+'</span>':'')+
      (n.lastSeenAt? '<span>最近現れた：'+esc(n.lastSeenAt)+'</span>':'')+
      '</div></div>';
    if(futures.length) h += '<div class="nd-sec"><h5>Future Memo とのつながり</h5><p>'+
      esc(futures.map(function(f){ return f.body; }).join(' / '))+'</p></div>';
    var fb=fbGet(n.id);
    h += '<div class="nd-fb"><button type="button" id="fbYes"'+(fb>0?' class="on"':'')+'>自分らしい</button>'+
         '<button type="button" id="fbNo"'+(fb<0?' class="on"':'')+'>少し違う</button></div>';
    b.innerHTML=h; el.classList.add('on');
    $('#fbYes').onclick=function(){ fbSet(n.id, 1); G=null; rebuild(); toast('覚えました'); };
    $('#fbNo').onclick =function(){ fbSet(n.id,-1); G=null; rebuild(); toast('表示を控えます'); };
  }

  /* ---- 価値観チップ ---- */
  function renderChips(){
    var w=$('#vchips'); w.innerHTML='';
    view.values.forEach(function(v){
      var b=document.createElement('button');
      b.type='button'; b.className='vchip'+(chip===v.id?' on':'');
      b.setAttribute('aria-pressed', chip===v.id ? 'true':'false');
      b.innerHTML=esc(v.chip||v.label)+'<b>'+(v.evidenceIds||[]).length+'</b>';
      b.onclick=function(){ chip = (chip===v.id)?null:v.id; renderChips(); draw(); syncDom(); };
      w.appendChild(b);
    });
  }

  /* ---- 入力 ---- */
  var drag=null, pts={}, pinch=null;
  function bind(){
    stage.addEventListener('pointerdown', function(e){
      stage.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts);
      if(ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]];
        pinch={d:Math.hypot(A.x-B.x,A.y-B.y), z:cam.z}; drag=null; return; }
      drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId}; stage.classList.add('grabbing');
    });
    stage.addEventListener('pointermove', function(e){
      if(pts[e.pointerId]) pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts);
      if(pinch && ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]];
        var d=Math.hypot(A.x-B.x,A.y-B.y);
        setZoom(pinch.z*d/pinch.d); return; }
      if(!drag) return;
      var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      drag.moved+=Math.abs(dx)+Math.abs(dy);
      cam.x+=dx/cam.z; cam.y+=dy/cam.z; drag.x=e.clientX; drag.y=e.clientY;
      draw(); syncDom();
    });
    function up(e){
      delete pts[e.pointerId]; if(Object.keys(pts).length<2) pinch=null;
      stage.classList.remove('grabbing');
      if(drag && drag.id===e.pointerId){
        if(drag.moved<8 && e.target===stage){ sel=null; hideCard(); draw(); syncDom(); }
        drag=null;
      }
    }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', function(e){ e.preventDefault(); setZoom(cam.z*(e.deltaY<0?1.12:0.89)); }, {passive:false});
  }
  function setZoom(z){
    var prev = cam.z;
    cam.z = Math.max(MAPC.ZOOM.min, Math.min(MAPC.ZOOM.max, z));
    var crossed = (view && view.mode==='all') &&
      ((prev<MAPC.ZOOM.year)!==(cam.z<MAPC.ZOOM.year) || (prev<MAPC.ZOOM.month)!==(cam.z<MAPC.ZOOM.month));
    if(crossed) rebuild(true); else { draw(); syncDom(); }
  }

  function fit(){
    if(!view||!view.nodes.length||!W) return;
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    view.nodes.forEach(function(n){
      if(!view.labelSet[n.id] && n.kind==='evidence') return;
      x0=Math.min(x0,n.x); x1=Math.max(x1,n.x); y0=Math.min(y0,n.y); y1=Math.max(y1,n.y);
    });
    if(x0>x1) return;
    var gw=Math.max(x1-x0,140), gh=Math.max(y1-y0,140);
    var topPad=126, botPad=86;
    var z=Math.min((W-130)/gw, (H-topPad-botPad)/gh);
    cam.z=Math.max(MAPC.ZOOM.min, Math.min(1.2, z));
    cam.x=-(x0+x1)/2; cam.y=-(y0+y1)/2 + (topPad-botPad)/2/cam.z;
  }
  function rebuild(keepCam){
    view = compose(S.mapMode);
    if(!keepCam) fit();
    buildDom(); renderChips();
    $('#mapSum').textContent = summarize(view);
    $('#mapHint').textContent = S.mapMode==='all'
      ? '外側ほど過去、中心ほど現在。ピンチで年→月→出来事へ'
      : '星にふれると、根拠になった記録がひらきます';
    draw(); syncDom();
  }
  function animateIn(){
    if(reduce){ intro=1; draw(); syncDom(); return; }
    var t0=performance.now();
    (function step(){
      var k=Math.min(1,(performance.now()-t0)/650);
      intro = k<1 ? (1-Math.pow(1-k,3)) : 1;
      draw(); syncDom();
      if(k<1) raf=requestAnimationFrame(step); else raf=0;
    })();
  }
  return {
    init:function(){
      stage=$('#mapStage'); cv=$('#gcv'); layer=$('#mapLayer');
      if(!cv||!cv.getContext) return;
      ctx=cv.getContext('2d'); seedSky(); bind();
      window.addEventListener('resize', resize);
      $('#mapReset').onclick=function(){
        sel=null; chip=null; hideCard(); G=null; cam={x:0,y:0,z:1};
        if(S.cfg.pos) delete S.cfg.pos[S.mapMode];     /* 手で動かした位置も戻す */
        Store.saveLocal(); rebuild();
      };
      $('#ndClose').onclick=function(){ sel=null; hideCard(); draw(); syncDom(); };
    },
    show:function(mode){
      if(!cv) return;
      S.mapMode = mode||'all';
      sel=null; chip=null; hideCard(); G=null;
      var empty = !S.logs.length;
      var e=$('#mapEmpty');
      if(empty){
        if(!e){ e=document.createElement('p'); e.className='mapempty'; e.id='mapEmpty'; stage.appendChild(e); }
        e.textContent='記録が増えると、ここにあなたの星座が育ちます。';
        layer.innerHTML=''; $('#vchips').innerHTML=''; $('#mapSum').textContent=''; $('#mapHint').textContent='';
        resize(); return;
      }
      if(e) e.remove();
      cam={x:0,y:0,z:1};
      setTimeout(function(){ resize(); rebuild(); intro=0; animateIn(); }, 0);
    },
    resize:resize,
    clearSelection:function(){ sel=null; chip=null; hideCard(); }
  };
})();

function monthStats(ym){
  var rows = logsOfMonth(ym);
  var fut  = S.futures.filter(function(f){ return f.done_at && ymOf(f.done_at)===ym; });
  var kinds = {}; rows.forEach(function(l){ kinds[kindOf(l)]=1; });
