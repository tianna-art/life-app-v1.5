# Puts the demo records into an account, from the browser.
#
# Same route as Run migration: the Management API and the personal access
# token this repository already holds. No database password, no service_role
# key, and nothing to install.
#
# What it writes is only what the spreadsheet says — 480 records and the lens
# they were recorded under. It writes no analysis, no progressions and no month
# readings: those are what the app works out from evidence, and putting them in
# by hand would fake the one thing worth looking at.
name: Load demo data

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'The account to load into (its sign-in email)'
        type: string
        required: true
        default: ''
      action:
        description: 'status = look and change nothing / load / remove / purge_others = DELETE everything else / reset_readings = forget the analysis, keep the records'
        type: choice
        options: [status, load, remove, purge_others, reset_readings]
        default: status
      confirm:
        description: 'Type YES to run it against the live database (purge_others needs DELETE MY RECORDS)'
        type: string
        required: true
        default: ''

concurrency:
  group: load-demo-data
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EMAIL: ${{ inputs.email }}
        run: |
          problems=""
          note() { problems="$problems\n  - $1"; }

          # purge_others deletes records the person wrote and cannot be undone,
          # so it does not share a confirmation word with the reversible ones.
          # Typing YES out of habit must not be enough to reach it.
          #
          # status writes nothing, so it asks for nothing. Making people type a
          # confirmation to look at the state is how looking stops happening,
          # and then the only way to find out what is in an account is to run
          # something that changes it.
          if [ "${{ inputs.action }}" = "status" ]; then
            :
          elif [ "${{ inputs.action }}" = "purge_others" ]; then
            if [ "${{ inputs.confirm }}" != "DELETE MY RECORDS" ]; then
              note "purge_others deletes the account's own records and cannot be undone. Type: DELETE MY RECORDS"
            fi
          elif [ "${{ inputs.confirm }}" != "YES" ]; then
            note "Type YES in the confirm field: this writes to the live database."
          fi

          email=$(printf '%s' "$EMAIL" | tr -d '[:space:]')
          # The address goes into a SQL literal, so it is checked rather than
          # trusted. Anything outside this shape is refused, not escaped.
          case "$email" in
            *[!A-Za-z0-9._%@+-]*|*"'"*|""|*@*@*)
              note "email does not look like an address: '$EMAIL'" ;;
            *@*.*) ;;
            *) note "email does not look like an address: '$EMAIL'" ;;
          esac

          token=$(printf '%s' "$ACCESS_TOKEN" | tr -d '[:space:]')
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]')
          # A project ref pasted as a dashboard URL is an obvious intent.
          case "$ref" in */project/*) ref=${ref##*/project/}; ref=${ref%%/*} ;; esac
          case "$token" in sbp_*) ;; *) note "SUPABASE_ACCESS_TOKEN must start with sbp_." ;; esac
          [ -n "$ref" ] || note "SUPABASE_PROJECT_REF is not set."

          if [ -n "$problems" ]; then
            printf '::error::Cannot run:%b\n' "$problems"
            exit 1
          fi

          case "${{ inputs.action }}" in
            status)        file= ;;
            load)          file=supabase/demo/demo_data.sql ;;
            remove)        file=supabase/demo/demo_data_remove.sql ;;
            purge_others)  file=supabase/demo/purge_others.sql ;;
            reset_readings) file=supabase/demo/reset_readings.sql ;;
            *) echo "::error::unknown action"; exit 1 ;;
          esac

          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "DEMO_FILE=$file" >> "$GITHUB_ENV"
          echo "DEMO_EMAIL=$email" >> "$GITHUB_ENV"
          echo "${{ inputs.action }}: ${file:-（読むだけ）} for $email"
          echo "commit: $GITHUB_SHA"
          if [ -n "$file" ]; then head -8 "$file" | sed 's/^/  | /'; fi

      - name: Run it
        if: inputs.action != 'status'
        run: |
          # The address is substituted here rather than in the committed file,
          # so nobody's email lands in the repository.
          sed "s/__DEMO_EMAIL__/$DEMO_EMAIL/g" "$DEMO_FILE" > statement.sql
          jq -Rs '{query: .}' statement.sql > body.json

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @body.json)

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Failed (HTTP $status)."
            head -c 4000 response.json
            echo
            exit 1
          fi
          echo "Done."

      - name: What is there now
        run: |
          # tee, not >: the job summary is not readable from the API, so a run
          # that cannot be inspected in its own log cannot be checked at all.
          check() {
            printf '{"query":%s}' "$(printf '%s' "$1" | jq -Rs .)" > check.json
            curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @check.json | tee /dev/stderr
          }

          {
            echo "### ${{ inputs.action }} — $DEMO_EMAIL"
            echo ""
            echo "#### records per month"
            echo '```json'
            check "select to_char(occurred_on, 'YYYY-MM') as month, count(*)
                     from public.logs
                    where user_id = (select id from auth.users
                                      where lower(email) = lower('$DEMO_EMAIL'))
                    group by 1 order by 1"
            echo ''
            echo '```'
            echo ""
            echo "#### the lens"
            echo '```json'
            check "select year, cardinality(selected_areas) as areas,
                          cardinality(desired_self_cards) as cards,
                          cardinality(progression_lenses) as lenses, initial_theme
                     from public.year_directions
                    where user_id = (select id from auth.users
                                      where lower(email) = lower('$DEMO_EMAIL'))
                    order by year"
            echo ''
            echo '```'
            echo ""
            echo "#### the declarations"
            echo '```json'
            # §14 looks for the month's first. Without one, every change falls
            # through to a desired-self card and the primary path is never
            # exercised — which looks like a working reading, not a gap.
            check "select year, month, initial_theme, final_theme, source
                     from public.month_themes
                    where user_id = (select id from auth.users
                                      where lower(email) = lower('$DEMO_EMAIL'))
                    order by year, month"
            echo ''
            echo '```'
            echo ""
            echo "#### what has been read"
            echo '```json'
            # Records alone draw nothing. The map needs readings, the readings
            # make progressions, the month's reading turns some of those into
            # published changes, and the cards print the records each change
            # cites — so "nothing is showing" has several possible causes and
            # these separate them. `changes` at 0 with `progressions` above 0
            # is the honest case §31 allows, not a failure.
            check "select
                     (select count(*) from public.logs l
                       where l.user_id = u.id) as records,
                     (select count(*) from public.log_ai_analysis a
                        join public.logs l on l.id = a.log_id
                       where l.user_id = u.id) as read,
                     (select count(*) from public.progressions p
                       where p.user_id = u.id) as progressions,
                     (select count(*) from public.changes c
                       where c.user_id = u.id) as changes,
                     (select count(*) from public.change_evidence e
                        join public.changes c on c.id = e.change_id
                       where c.user_id = u.id) as change_evidence,
                     (select count(*) from public.month_maps m
                       where m.user_id = u.id) as briefs
                   from auth.users u
                   where lower(u.email) = lower('$DEMO_EMAIL')"
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
