<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>crincran ｜ 人生の目次</title>
<meta name="description" content="好きなもの、仕事、人との出会い、心が動いた出来事をつなぎ、自分の輪郭を取り戻す人生編集アプリ。">
<meta name="theme-color" content="#FBF0BE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="crincran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF0BE; --bg-soft:#FDF6D6; --panel:#FFFBE9; --sheet:#FFFCF0;
  --ink:#3E3226; --ink-soft:#6A5A46; --muted:#A5906A; --faint:#C4B189;
  --line:#E6D8A6; --line-soft:#EFE4BC; --scrim:rgba(62,50,38,.34);
  --accent:#C88A5C;
  --k-moved:#C97B6B; --k-effort:#B5924C; --k-hard:#7C8DA6; --k-chose:#6E9885; --k-wish:#9B85AF;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --maxw:520px;
  --navh:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  line-height:1.9; letter-spacing:.02em; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::selection{background:rgba(200,138,92,.24)}

/* ── shell ───────────────────────────────── */
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:100%;max-width:var(--maxw);flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:560px){ body{background:#F4E9BE} .stage{background:var(--bg);box-shadow:0 0 0 1px var(--line-soft)} }

/* ── header ──────────────────────────────── */
.hd{
  flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
  border-bottom:1px solid var(--line-soft); background:var(--bg); z-index:5;
}
.brand{text-decoration:none;min-height:44px;min-width:44px;display:flex;flex-direction:column;justify-content:center;font-family:var(--serif);font-weight:600;font-size:.82rem;line-height:1.05;letter-spacing:.02em;color:var(--ink);justify-self:start;text-align:left}
.brand i{display:block;font-style:normal;padding-left:.5em}
.hd-c{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:1.02rem;letter-spacing:.06em;white-space:nowrap}
.hd-c .yr{font-style:italic;color:var(--ink-soft)}
.hd-c button{display:flex;align-items:center;gap:6px;padding:2px 8px;min-height:44px;color:inherit}
.chev{width:11px;height:11px;border-right:1.4px solid var(--muted);border-bottom:1.4px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
.hd-r{justify-self:end;display:flex;align-items:center;min-height:44px;font-size:.56rem;font-weight:700;letter-spacing:.18em;color:var(--muted);padding:6px 2px}

/* ── scroll body ─────────────────────────── */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:22px 20px calc(var(--navh) + env(safe-area-inset-bottom) + 40px);display:none}
.view.on{display:block}
.view.flush{padding:0}

/* ── bottom nav ──────────────────────────── */
.nav{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--sheet);border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:var(--navh);font-family:var(--serif);font-size:1.02rem;letter-spacing:.04em;color:var(--faint);
  transition:color .2s}
.nav button .sq{width:26px;height:6px;opacity:0;transition:opacity .25s}
.nav button.on{color:var(--ink)}
.nav button.on .sq{opacity:1}
.nav button i{font-style:italic}

/* ── shared bits ─────────────────────────── */
.eyebrow{font-size:.56rem;font-weight:700;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.plus{width:26px;height:26px;position:relative;flex:none}
.plus::before,.plus::after{content:"";position:absolute;background:var(--muted);left:50%;top:50%}
.plus::before{width:13px;height:1.2px;transform:translate(-50%,-50%)}
.plus::after{width:1.2px;height:13px;transform:translate(-50%,-50%)}
.squig{display:block;margin:14px auto;width:44px;height:9px;opacity:.75}
.hr{height:1px;background:var(--line-soft);margin:26px 0}
.center{text-align:center}
.mono-note{font-size:.72rem;color:var(--muted);line-height:1.8}
.empty{padding:30px 0;text-align:center;color:var(--faint);font-size:.8rem;font-family:var(--serif)}

/* title block */
.titleblock{padding:14px 0 4px;text-align:center;position:relative}
.titleblock h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.25rem,5.6vw,1.55rem);
  line-height:1.75;letter-spacing:.06em;color:var(--ink)}
.titleblock h1 .ph{color:var(--faint)}
.titleblock .pen{display:inline-block;margin-left:.4em;vertical-align:middle;opacity:.55}
.arrowbtn{position:absolute;top:50%;transform:translateY(-50%);padding:10px;color:var(--muted)}
.arrowbtn.l{left:-6px} .arrowbtn.r{right:-6px}
.arrowbtn:disabled{opacity:.22}

/* rows */
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:14px;
  padding:16px 2px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%}
.row .d{font-family:var(--serif);font-size:.74rem;color:var(--accent);letter-spacing:.04em;white-space:nowrap}
.row .t{font-family:var(--serif);font-size:.98rem;line-height:1.7;color:var(--ink)}
.row .t em{font-style:normal;color:var(--muted)}
.row .go{font-size:.9rem;color:var(--faint)}
.row:active{background:var(--bg-soft)}
.dotk{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:.5em;vertical-align:middle}

/* quick log */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;
  border:1px solid var(--line-soft);border-radius:14px;background:var(--panel);transition:transform .12s,border-color .2s}
.quick button:active{transform:scale(.95)}
.quick .bl{width:9px;height:9px;border-radius:50%}
.quick .lb{font-family:var(--serif);font-size:.62rem;letter-spacing:.02em;color:var(--ink-soft);line-height:1.3;text-align:center}

/* chapter card */
.chapter{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:20px 18px;margin-top:16px}
.chapter h3{font-family:var(--serif);font-size:.95rem;letter-spacing:.05em;margin-bottom:10px}
.chapter .lbl{font-size:.6rem;letter-spacing:.16em;color:var(--faint);margin-top:16px;margin-bottom:4px;font-weight:700}
.chapter p{font-family:var(--serif);font-size:.88rem;line-height:2.05;color:var(--ink-soft);letter-spacing:.03em}

/* buttons */
.btn{display:block;width:100%;text-align:center;font-family:var(--serif);font-size:.9rem;letter-spacing:.1em;
  padding:15px;border-radius:999px;background:var(--ink);color:var(--bg);transition:opacity .2s}
.btn:active{opacity:.78}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:.8rem}
.btn:disabled{opacity:.4}
.linkbtn{font-family:var(--serif);font-size:.8rem;color:var(--muted);letter-spacing:.08em;padding:8px}
.linkbtn:active{color:var(--ink)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:.7rem;letter-spacing:.04em;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel);transition:all .18s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);z-index:21;
  width:100%;max-width:var(--maxw);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--sheet);border-radius:22px 22px 0 0;border:1px solid var(--line-soft);border-bottom:0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 26px);
  transition:transform .34s cubic-bezier(.22,.8,.24,1)}
.sheet.on{transform:translate(-50%,0)}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h2{font-family:var(--serif);font-size:1.05rem;letter-spacing:.06em;text-align:center;margin-bottom:6px}
.sheet .sub{text-align:center;font-size:.72rem;color:var(--muted);margin-bottom:18px}
.field{margin-top:16px}
.field label{display:block;font-size:.6rem;font-weight:700;letter-spacing:.16em;color:var(--faint);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:12px;padding:13px 14px;font-family:var(--serif);font-size:.92rem;line-height:1.8;color:var(--ink)}
.field textarea{min-height:104px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);font-family:var(--sans);font-size:.82rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:grid;gap:10px;margin-top:22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 22px);transform:translate(-50%,14px);
  z-index:40;background:var(--ink);color:var(--bg);font-size:.78rem;letter-spacing:.06em;font-family:var(--serif);
  padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── MAP：宇宙 ───────────────────────────── */
#v-map{background:#070916}
.mapwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.maptabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(7,9,22,.92);
  border-bottom:1px solid rgba(169,176,197,.16);position:relative;z-index:8}
.maptabs button{padding:14px 4px 12px;font-family:var(--serif);font-size:.84rem;letter-spacing:.08em;
  color:#868FA9;position:relative}
.maptabs button.on{color:#F7F1E6}
.maptabs button.on::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:36%;height:1.5px;background:#D8B56A}
.maptabs button:focus-visible{outline:2px solid #D8B56A;outline-offset:-3px}

.mapstage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.mapstage.grabbing{cursor:grabbing}
#gcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.maplayer{position:absolute;inset:0;pointer-events:none;z-index:4}

/* 価値観チップ */
.vchips{position:absolute;left:0;right:0;top:42px;z-index:7;display:flex;gap:6px;justify-content:center;
  flex-wrap:wrap;padding:12px 14px 0;pointer-events:none}
.vchip{pointer-events:auto;min-height:44px;font-family:var(--serif);font-size:.68rem;letter-spacing:.1em;color:#E9E0CB;
  background:rgba(216,181,106,.12);border:1px solid rgba(216,181,106,.42);border-radius:999px;
  padding:6px 13px;display:inline-flex;align-items:center;gap:7px;line-height:1}
.vchip b{font-weight:400;font-size:.56rem;color:#D8B56A;letter-spacing:.04em}
.vchip.on{background:#D8B56A;color:#12162B;border-color:#D8B56A}
.vchip.on b{color:#12162B}
.vchip:focus-visible{outline:2px solid #D8B56A;outline-offset:2px}

/* 今見えていること */
.maphead{position:absolute;left:0;right:0;top:84px;z-index:6;pointer-events:none}
.mapsum{padding:0 26px 8px;text-align:center;
  font-family:var(--serif);font-size:.76rem;line-height:1.9;color:#CBD1E0;letter-spacing:.03em;
  pointer-events:none;text-shadow:0 1px 12px rgba(7,9,22,.95)}

/* ノードのラベルと当たり判定 */
.nlabel{position:absolute;pointer-events:auto;transform:translate(-50%,0);background:none;
  font-family:var(--serif);text-align:center;line-height:1.5;letter-spacing:.03em;color:#F7F1E6;
  padding:2px 4px;max-width:128px;color:#E8E4D8;text-shadow:0 1px 9px rgba(7,9,22,.98),0 0 3px rgba(7,9,22,.9)}
.nlabel .mk{display:block;font-size:.44rem;letter-spacing:.2em;color:#79839E;margin-bottom:3px}
.nlabel .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nlabel.tight{max-width:88px}
.nlabel.tight .lb{-webkit-line-clamp:1}
.nlabel.tight .mk{display:none}
.nlabel.dim{opacity:.22}
.nlabel:focus-visible{outline:2px solid #D8B56A;outline-offset:2px;border-radius:6px}
.nhit{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border-radius:50%;background:none}
.nhit:focus-visible{outline:2px solid #D8B56A;outline-offset:1px}

/* 操作まわり */
.mapreset{position:absolute;right:12px;top:8px;z-index:10;min-height:44px;border:1px solid rgba(169,176,197,.35);
  border-radius:999px;background:rgba(12,16,36,.85);font-family:var(--serif);font-size:.66rem;
  letter-spacing:.06em;color:#CBD1E0;padding:7px 13px}
.mapreset:focus-visible{outline:2px solid #D8B56A;outline-offset:2px}
/* ── 気づきの帯（鏡・橋・羅針盤）と 物語のレンズ ── */
.insights{display:flex;gap:7px;overflow-x:auto;padding:0 14px 2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;pointer-events:auto}
.insights::-webkit-scrollbar{display:none}
.insights:empty{display:none}
.ins{flex:0 0 auto;width:min(62%,238px);text-align:left;background:rgba(20,25,44,.66);
  border:1px solid rgba(201,177,131,.24);border-radius:12px;padding:8px 11px;color:#E8E0CE;
  backdrop-filter:blur(6px);min-height:44px}
.ins b{display:block;font-size:.56rem;letter-spacing:.16em;color:#C9B183;margin-bottom:3px;font-weight:400}
.ins span{display:block;font-size:.66rem;line-height:1.6;letter-spacing:.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ins em{display:none}
.ins.open{width:min(84%,320px)}
.ins.open span{-webkit-line-clamp:4}
.ins.open em{display:block;font-style:normal;font-size:.64rem;line-height:1.7;color:#A8B0C8;margin-top:5px}
.ins:focus-visible{outline:2px solid #C88A5C;outline-offset:2px}
.lens{position:absolute;left:14px;right:14px;bottom:14px;z-index:7;background:rgba(20,25,44,.86);
  border:1px solid rgba(201,177,131,.3);border-radius:16px;padding:10px 14px;color:#E8E0CE;backdrop-filter:blur(8px)}
.lens.open{padding:14px}
.lens b{display:block;font-size:.58rem;letter-spacing:.16em;color:#C9B183;margin-bottom:4px;font-weight:400}
.lens p{font-size:.74rem;line-height:1.8;letter-spacing:.02em;margin:0 0 4px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lens.open p{-webkit-line-clamp:unset;display:block}
.lens .lq,.lens .lopts,.lens .lshelf{display:none}
.lens.open .lq{display:block;color:#A8B0C8;font-size:.68rem;line-height:1.7;margin-bottom:10px}
.lens.open .lopts{display:flex}
.lens.open .lshelf{display:block}
.lenshead{width:100%;text-align:left;background:transparent;border:0;padding:0;color:inherit;min-height:44px}
.lens .lopts{flex-wrap:wrap;gap:7px}
.lens .lopts button{flex:1 1 46%;min-height:44px;border-radius:999px;font-family:var(--serif);
  font-size:.72rem;letter-spacing:.05em;color:#E8E0CE;background:transparent;
  border:1px solid rgba(201,177,131,.34);padding:9px 8px}
.lens .lopts button:focus-visible{outline:2px solid #C88A5C;outline-offset:2px}
.lens.open .lshelf{margin-top:9px;font-size:.64rem;letter-spacing:.06em;color:#A8B0C8;
  background:transparent;border:0;padding:6px 2px;min-height:32px;text-decoration:underline}
.shelf-item{border-bottom:1px solid var(--line-soft);padding:11px 0}
.shelf-item p{font-size:.78rem;line-height:1.8;color:#4A3B29;margin:0 0 4px}
.shelf-item span{font-size:.62rem;letter-spacing:.06em;color:#A8926A}
.maplegend{position:absolute;left:0;right:0;
  bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 26px);text-align:center;
  font-size:.56rem;letter-spacing:.14em;color:#79839E;pointer-events:none;z-index:4}
.maplvl{position:absolute;left:50%;top:8px;transform:translate(-50%,-6px);
  padding:5px 16px;border-radius:999px;background:rgba(12,16,32,.82);border:1px solid rgba(216,181,106,.4);
  color:#F3E6C8;font-size:12px;letter-spacing:.16em;pointer-events:none;opacity:0;
  transition:opacity .22s ease, transform .22s ease;z-index:6;white-space:nowrap}
.maplvl.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.maplvl{transition:none}}
.maphint{position:absolute;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 6px);
  text-align:center;font-size:.56rem;color:#7B84A0;letter-spacing:.06em;pointer-events:none;padding:0 14px;z-index:5}
.mapempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 44px;
  text-align:center;font-family:var(--serif);font-size:.9rem;line-height:2.1;color:#A9B0C5;z-index:5}

/* 詳細カード＝夜空でひらく紙 */
.ndetail{position:absolute;left:10px;right:10px;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px);
  z-index:9;background:#FBF7EA;border-radius:14px;padding:16px 16px 14px;
  box-shadow:0 14px 44px rgba(0,0,0,.55);transform:translateY(16px);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;max-height:42vh;overflow-y:auto;overscroll-behavior:contain}
.ndetail.on{transform:none;opacity:1;pointer-events:auto}
.ndetail .x{position:absolute;right:6px;top:4px;min-width:44px;min-height:44px;padding:10px 12px;color:#A8926A;font-size:1.1rem;line-height:1}
.ndetail .x:focus-visible{outline:2px solid #C88A5C;outline-offset:-2px}
.nd-layers .ly{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #E6D8A6}
.nd-layers .ly:last-child{border-bottom:0}
.nd-layers .ly b{flex:0 0 92px;font-size:.58rem;font-weight:700;letter-spacing:.08em;color:#A8926A;padding-top:2px}
.nd-layers .ly span{flex:1;font-size:.78rem;line-height:1.7;color:#3E3226}
.nd-fit{margin-top:8px;font-size:.72rem;line-height:1.75;color:#6A5A46;background:#F3ECD8;border-radius:8px;padding:9px 11px}
.nd-sides{display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.nd-sides span{flex:1;font-size:.78rem;line-height:1.6;color:#3E3226;background:#F5EEDC;border-radius:8px;padding:8px 9px}
.nd-sides em{font-style:normal;color:#B09A6E;font-size:.9rem}
.nd-k{font-size:.54rem;font-weight:700;letter-spacing:.2em;color:#B09A6E;display:flex;align-items:center;gap:7px}
.nd-k i{width:7px;height:7px;border-radius:50%;display:block}
.ndetail h4{font-family:var(--serif);font-size:1rem;line-height:1.6;letter-spacing:.04em;margin:7px 34px 9px 0;color:#3B3025}
.ndetail p.sum{font-family:var(--serif);font-size:.83rem;line-height:2;color:#5B4B37}
.nd-sec{margin-top:13px;padding-top:11px;border-top:1px solid rgba(160,138,96,.28)}
.nd-sec h5{font-size:.54rem;font-weight:700;letter-spacing:.18em;color:#B09A6E;margin-bottom:7px}
.nd-sec p{font-family:var(--serif);font-size:.78rem;line-height:1.9;color:#5B4B37}
.nd-ev{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;padding:6px 0;text-align:left;width:100%}
.nd-ev + .nd-ev{border-top:1px solid rgba(160,138,96,.14)}
.nd-ev .d{font-family:var(--serif);font-size:.6rem;color:#B98D62;white-space:nowrap}
.nd-ev .t{font-family:var(--serif);font-size:.75rem;line-height:1.75;color:#4A3C2C}
.nd-ev .t em{font-style:normal;color:#A8926A;font-size:.62rem;letter-spacing:.06em;margin-left:.4em}
.nd-meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:.62rem;color:#A8926A;letter-spacing:.04em}
.nd-fb{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nd-fb button{flex:1 1 46%;min-height:44px;font-family:var(--serif);font-size:.76rem;letter-spacing:.06em;padding:11px 8px;
  border-radius:999px;border:1px solid rgba(160,138,96,.42);color:#5B4B37;background:transparent}
.nd-fb button.on{background:#3B3025;color:#FBF7EA;border-color:#3B3025}
.nd-fb button[data-danger]{flex:1 1 100%;color:#9C6A6A;border-color:rgba(156,106,106,.4)}
.nd-fb button[data-danger].on{background:#8E5E5E;color:#FBF7EA;border-color:#8E5E5E}
.nd-fb button:focus-visible{outline:2px solid #C88A5C;outline-offset:2px}
/* 事実 → 見立て → 問い の帯 */
.nd-band{margin:20px 0 8px;font-size:.6rem;letter-spacing:.24em;color:#A8926A;
  border-top:1px solid var(--line-soft);padding-top:12px}
.nd-factline{font-size:.7rem;line-height:1.85;color:#5B4B37;margin-top:7px}
.nd-hold{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(200,138,92,.10);
  border:1px solid rgba(200,138,92,.28);font-size:.72rem;line-height:1.85;color:#7A5B3E}
.nd-relline{display:flex;align-items:flex-start;gap:7px;font-size:.7rem;line-height:1.8;
  color:#5B4B37;margin-top:7px}
.nd-relline i{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:.52em}
.nd-relline b{flex:0 0 auto;font-weight:400;color:#A8926A;font-size:.62rem;letter-spacing:.08em;margin-top:.15em}
.nd-q{font-family:var(--serif);font-size:.8rem;line-height:1.95;color:#4A3B29;letter-spacing:.02em;
  padding:12px 14px;border-radius:12px;background:rgba(216,181,106,.10)}
.nd-fbnote{margin-top:9px;font-size:.62rem;color:#A8926A;letter-spacing:.04em;line-height:1.7}
/* 仮説がどこまで育ったか */
.nd-stage{display:inline-block;font-size:.62rem;letter-spacing:.1em;padding:4px 11px;border-radius:999px;
  margin:0 0 6px;border:1px solid rgba(160,138,96,.45);color:#8A7A5E}
.nd-stage.stg-seed{color:#9AA98C;border-color:rgba(154,169,140,.55)}
.nd-stage.stg-growing{color:#8A9BC0;border-color:rgba(138,155,192,.55)}
.nd-stage.stg-rooted{color:#A8874A;border-color:rgba(168,135,74,.6);background:rgba(216,181,106,.12)}
.nd-stage.stg-changing{color:#B08153;border-color:rgba(176,129,83,.55)}
.nd-stage.stg-tension{color:#B4728A;border-color:rgba(180,114,138,.55)}
.nd-stagenote{margin-top:6px;font-size:.66rem;color:#8E7B5E;letter-spacing:.03em;line-height:1.8}
.nd-was{font-size:.62rem;color:#A8926A;letter-spacing:.04em;margin:-2px 0 6px}

/* ── LIST ────────────────────────────────── */
.yearhead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 10px;border-bottom:1px solid var(--line)}
.yearhead .y{font-family:var(--serif);font-style:italic;font-size:1.5rem;letter-spacing:.04em}
.yearhead .n{font-size:.6rem;letter-spacing:.16em;color:var(--faint)}
/* ── LIST：スクラップブックの life path ── */
#v-list{
  background-color:#FAF5E2;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
}
.path{position:relative;margin:10px 0 0}
.path > svg{position:absolute;left:0;top:0;pointer-events:none}

/* 貼った紙 */
.stop{position:absolute;z-index:3;background:#FEFBF2;border-radius:1px;
  box-shadow:0 1px 3px rgba(74,60,40,.10), 0 0 0 1px rgba(160,140,100,.10)}
.tape{position:absolute;top:-9px;left:50%;width:56px;height:17px;z-index:1;
  transform:translateX(-50%) rotate(-2deg);background:rgba(200,172,116,.26);
  clip-path:polygon(0 12%,8% 0,22% 10%,38% 2%,54% 11%,70% 1%,86% 10%,100% 3%,100% 90%,88% 100%,72% 91%,56% 100%,40% 90%,24% 100%,10% 91%,0 99%)}
.tag{display:block;width:100%;text-align:left;padding:13px 13px 12px;background:none;position:relative;z-index:2}
.tag .mn{display:block;font-family:var(--serif);font-size:.56rem;font-weight:600;
  letter-spacing:.26em;color:#AE9A6E}
.tag .tt{display:block;font-family:var(--serif);font-size:.83rem;line-height:1.7;
  color:#3B3025;margin-top:5px;letter-spacing:.02em}
.tag .tt.none{color:#C0AE86}
.tag .kd{display:flex;gap:4px;margin-top:9px;align-items:center}
.tag .kd i{width:5px;height:5px;border-radius:50%;display:block}
.tag .kd b{font-weight:400;font-size:.54rem;letter-spacing:.14em;color:#B7A57E;margin-left:3px}

/* その場でひらく出来事 */
.evs{padding:0 13px 12px;position:relative;z-index:2}
.evs::before{content:"";display:block;border-top:1px dashed rgba(160,138,96,.4);margin-bottom:2px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;width:100%;
  text-align:left;padding:8px 0 7px}
.ev + .ev{border-top:1px solid rgba(160,138,96,.14)}
.ev .d{font-family:var(--serif);font-size:.62rem;color:#B98D62;letter-spacing:.04em;white-space:nowrap}
.ev .t{font-family:var(--serif);font-size:.74rem;line-height:1.7;color:#4A3C2C}
.ev .k{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:.45em;vertical-align:middle}
.evs .none{font-family:var(--serif);font-size:.72rem;color:#C0AE86;padding:9px 0 4px;font-style:italic}

/* 道の上の点 */
.node{position:absolute;width:11px;height:11px;border-radius:50%;background:#FAF5E2;
  border:1.5px solid #C08E5E;transform:translate(-50%,-50%);z-index:2}
.node.on{background:#C08E5E}

/* START の旗と NEXT CHAPTER */
.cap{position:absolute;z-index:5;background:#332A20;color:#FAF5E2;
  font-family:var(--serif);font-size:.54rem;font-weight:600;letter-spacing:.24em;padding:6px 16px 6px 12px;
  transform:translate(-50%,-50%) rotate(-1.5deg);
  clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}
.cap.round{border-radius:50%;width:80px;height:80px;padding:0;clip-path:none;
  transform:translate(-50%,-50%) rotate(-2deg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;font-weight:400;
  font-size:.68rem;letter-spacing:.1em;line-height:1.5}
.cap.round em{font-style:normal;font-size:.5rem;color:#C9A227;margin-top:3px}
.quote{text-align:center;font-family:var(--serif);font-style:italic;color:#A8926A;
  font-size:.84rem;line-height:2.1;margin-top:30px;letter-spacing:.05em}
.daygroup{border-left:1px solid var(--line-soft);margin:0 0 4px 8px;padding:6px 0 4px 15px}
.yearsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:0 2px 14px;border-bottom:1px solid rgba(160,138,96,.3)}
.yearsum .n{font-family:var(--serif);font-size:.76rem;color:#A8926A;letter-spacing:.04em}
.yearsum .k{display:flex;gap:9px}
.yearsum .k span{display:flex;align-items:center;gap:4px;font-size:.58rem;color:#B7A57E}
.yearsum .k i{width:6px;height:6px;border-radius:50%;display:block}
.filters{display:flex;gap:7px;overflow-x:auto;padding:4px 0 14px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}

/* settings list */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line-soft)}
.setrow .l{font-family:var(--serif);font-size:.9rem}
.setrow .v{font-size:.72rem;color:var(--muted)}
.badge{font-size:.58rem;letter-spacing:.12em;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--k-chose);border-color:var(--k-chose)}
.badge.off{color:var(--faint)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
<div class="stage">

  <!-- header -->
  <header class="hd">
    <a class="brand" href="#" onclick="return false"><span>cr'n</span><i>cran</i></a>
    <div class="hd-c"><button id="periodBtn"><span id="periodLabel" class="yr">2026</span><span class="chev"></span></button></div>
    <button class="hd-r" id="settingsBtn">SETTINGS</button>
  </header>

  <div class="views">

    <!-- ══════════ LOG ══════════ -->
    <section class="view on" id="v-log">
      <p class="eyebrow center">MONTH TITLE</p>
      <div class="titleblock">
        <button class="arrowbtn l" id="mPrev">‹</button>
        <h1 id="monthTitle"><span class="ph">まだタイトルがありません</span><span class="pen">✎</span></h1>
        <button class="arrowbtn r" id="mNext">›</button>
      </div>
      <svg class="squig" viewBox="0 0 44 9" fill="none"><path d="M1 5.5C5 1 9 1 13 5.5S21 10 25 5.5 33 1 37 5.5 43 8 43 8" stroke="#C88A5C" stroke-width="1.1" stroke-linecap="round"/></svg>

      <div class="sec" style="margin-top:8px">
        <div class="sec-h"><p class="eyebrow">QUICK LOG</p><p class="mono-note" id="todayLabel"></p></div>
        <div class="quick" id="quickRow"></div>
      </div>

      <div class="sec">
        <div class="sec-h"><p class="eyebrow">THIS MONTH'S CHAPTER</p><p class="mono-note" id="chapterMeta"></p></div>
        <div id="chapterBox"></div>
      </div>

      <div class="sec">
        <div class="sec-h"><p class="eyebrow">EVENTS</p><button class="plus" id="addEventBtn" aria-label="ログを追加"></button></div>
        <div id="logList"></div>
      </div>

      <div class="sec">
        <div class="sec-h"><p class="eyebrow">FUTURE MEMO</p><button class="plus" id="addFutureBtn" aria-label="Future Memoを追加"></button></div>
        <div id="futureList"></div>
      </div>

      <div class="hr"></div>
      <button class="btn" id="readMonthBtn">今月を読む</button>
      <p class="mono-note center" style="margin-top:12px">カレンダーを見ながら3つの問いに答えると、<br>今月の章が生まれます。</p>
    </section>

    <!-- ══════════ MAP ══════════ -->
    <section class="view flush" id="v-map" aria-label="Map：わたしを構成する星座">
      <div class="mapwrap">
        <div class="maptabs" id="mapTabs" role="tablist" aria-label="Mapの見かた">
          <button data-m="likes"  role="tab" aria-selected="false">プライベート</button>
          <button data-m="career" role="tab" aria-selected="false">キャリア</button>
          <button data-m="all"    role="tab" aria-selected="true" class="on">全て</button>
        </div>
        <div class="mapstage" id="mapStage">
          <canvas id="gcv" aria-hidden="true"></canvas>
          <div class="maplayer" id="mapLayer"></div>
          <div class="vchips" id="vchips" role="group" aria-label="いま強く現れている価値観"></div>
          <div class="maphead">
            <p class="mapsum" id="mapSum"></p>
            <div class="insights" id="mapInsights" aria-label="いま見えていること"></div>
          </div>
          <div class="lens" id="mapLens" hidden></div>
          <button class="mapreset" id="mapReset">全体を見る</button>
          <p class="maphint" id="mapHint"></p>
          <p class="maplegend" id="mapLegend" hidden>外側ほど過去、中心ほど現在</p>
          <div class="maplvl" id="mapLvl" aria-live="polite"></div>
        </div>
      </div>
      <div class="ndetail" id="nodeDetail" role="dialog" aria-modal="false" aria-label="星の詳細">
        <button class="x" id="ndClose" aria-label="閉じる">×</button><div id="ndBody"></div>
      </div>
    </section>

    <!-- ══════════ LIST ══════════ -->
    <section class="view" id="v-list">
      <p class="eyebrow center">YEAR TITLE</p>
      <div class="titleblock">
        <button class="arrowbtn l" id="yPrev">‹</button>
        <h1 id="yearTitle"><span class="ph">まだタイトルがありません</span><span class="pen">✎</span></h1>
        <button class="arrowbtn r" id="yNext">›</button>
      </div>
      <svg class="squig" viewBox="0 0 44 9" fill="none"><path d="M1 5.5C5 1 9 1 13 5.5S21 10 25 5.5 33 1 37 5.5 43 8 43 8" stroke="#C88A5C" stroke-width="1.1" stroke-linecap="round"/></svg>
      <div class="filters" id="listFilters"></div>
      <div id="yearBody"></div>
    </section>

  </div>

  <!-- bottom nav -->
  <nav class="nav" id="nav">
    <button data-v="log" class="on"><span>Log</span><svg class="sq" viewBox="0 0 26 6" fill="none"><path d="M1 3.5C3.5 1 6 1 8.5 3.5S13.5 6 16 3.5 21 1 25 4" stroke="#C88A5C" stroke-width="1.1" stroke-linecap="round"/></svg></button>
    <button data-v="map"><span>Map</span><svg class="sq" viewBox="0 0 26 6" fill="none"><path d="M1 3.5C3.5 1 6 1 8.5 3.5S13.5 6 16 3.5 21 1 25 4" stroke="#C88A5C" stroke-width="1.1" stroke-linecap="round"/></svg></button>
    <button data-v="list"><span>List</span><svg class="sq" viewBox="0 0 26 6" fill="none"><path d="M1 3.5C3.5 1 6 1 8.5 3.5S13.5 6 16 3.5 21 1 25 4" stroke="#C88A5C" stroke-width="1.1" stroke-linecap="round"/></svg></button>
  </nav>

</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   crincran — 人生編集アプリ  (single-file / no build step)
   Log = 記録する / Map = 理解する / List = 記憶をたどる
   ═══════════════════════════════════════════════════════════ */
(function(){
"use strict";

/* ── 1. 定数 ───────────────────────────── */
/* 入力カテゴリは3つだけ。ここは「どんな入口から書いたか」であって、
   どのMapに出るかではない。表示先は本文からの抽出結果が決める。
   保存する値は既存データと同じ moved / effort / hard（移行不要）。
   旧データの chose / wish は表示のうえでこの3つへ寄せる。 */
var KINDS = [
  {id:'moved',  ja:'好きなこと', en:'LIKES',  v:'--k-moved',
   hint:'惹かれたもの、心地よかったこと、また触れたいもの',
   ph:'惹かれたもの、心地よかったこと、また触れたいもの。一文でかまいません。'},
  {id:'effort', ja:'キャリア',   en:'CAREER', v:'--k-effort',
   hint:'仕事や学びで、残しておきたい出来事や違和感',
   ph:'仕事や学びで、残しておきたい出来事や違和感を、そのまま。'},
  {id:'hard',   ja:'つぶやき',   en:'MURMUR', v:'--k-hard',
   hint:'まだまとまっていなくても、そのまま',
   ph:'まだまとまっていなくても、そのままで大丈夫です。'}
];
var LEGACY_KIND = {chose:'effort', wish:'moved'};
function kindOf(l){ var k=(l&&l.kind)||'hard'; return LEGACY_KIND[k] || k; }
var KIND = {}; KINDS.forEach(function(k){ KIND[k.id]=k; });
var TONES = [
  {id:'hold',  ja:'そっと受け止める'},
  {id:'clear', ja:'まっすぐ整理する'},
  {id:'story', ja:'物語として読む'}
];
var ANGLES = [
  {id:'effort', ja:'頑張りを受け止めたい'},
  {id:'self',   ja:'自分らしさを確かめたい'},
  {id:'doubt',  ja:'迷いを整理したい'},
  {id:'next',   ja:'次の方向を考えたい'}
];
var LS = 'crincran.v1';

/* ── 2. ユーティリティ ─────────────────── */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function ymOf(iso){ return iso.slice(0,7); }
function yearOf(iso){ return iso.slice(0,4); }
function todayISO(d){ d = d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtMD(iso){ if(!iso) return '時期不明'; return (+iso.slice(5,7))+'/'+(+iso.slice(8,10)); }
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shift(ym, delta){
  var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+delta;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y+'-'+pad(m+1);
}
function toast(msg, ms){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); }, ms||2200);
}

/* ── 2b. おまかせ判定 ───────
   ユーザーには「起きたことを一文」だけ求める。
   入口を選ばなければ、本文から3つのどれかへ寄せる。
   ここで決まるのは入口だけで、分析結果ではない。 */
var AUTO_CAREER = ['仕事','会社','職場','上司','同僚','チーム','プロジェクト','企画','資料','会議','打ち合わ',
  '面談','転職','キャリア','評価','成果','売上','数字','納期','締め切り','クライアント','顧客','提案',
  '改善','運用','問い合わせ','実務','業務','学び','勉強','研修','資格','面接','部署','人事','役割'];
var AUTO_LIKE = ['惹か','好き','好きだ','心地','美し','この色','展示','ギャラリー','美術館','作品','作家','音楽','映画',
  '写真','絵','水彩','にじみ','本','小説','詩','光','青','花','散歩','カフェ','静か','眺め','見と','立ち止ま','手を動か',
  'つくって','描いて','聴い','読ん','食べ','旅','自然','海','川','空','朗'];
function autoKind(text){
  var t = String(text||'');
  var score = {moved:0, effort:0, hard:0};
  AUTO_CAREER.forEach(function(w){ if(t.indexOf(w)>=0) score.effort += 1.4; });
  AUTO_LIKE.forEach(function(w){ if(t.indexOf(w)>=0) score.moved  += 1.2; });
  /* 感情・関係・葛藤が中心なら、まだまとまっていない「つぶやき」へ */
  ['なんか','なぜか','でも','けど','もやもや','ゆるさない','わからない','思った','気がする','気分',
   '疲れ','しんど','寂し','不安','怒','悩','迷っ','自分は','自分の'].forEach(function(w){
    if(t.indexOf(w)>=0) score.hard += 1.1;
  });
  var best='hard', bv=0;
  ['hard','effort','moved'].forEach(function(k){ if(score[k]>bv){ bv=score[k]; best=k; } });
  return bv<=0 ? 'hard' : best;
}

/* 同じものを別ノードにしないための言い換え統合 */
var ALIAS = {
  'ChatGPT':'AI対話','Claude':'AI対話','生成AI':'AI対話','AIとの壁打ち':'AI対話','AIと話した':'AI対話',
  '美術館':'展示','ギャラリー':'展示','個展':'展示','作品展':'展示',
  '水彩画':'水彩','絵画':'絵','ドローイング':'絵',
  '打ち合わせ':'会議','ミーティング':'会議','MTG':'会議',
  '企画書':'企画','提案書':'企画'
};
function canon(x){ x=String(x||'').trim(); return ALIAS[x] || x; }
function canonList(arr){
  var out=[], seen={};
  (arr||[]).forEach(function(x){ var c=canon(x); if(c && !seen[c]){ seen[c]=1; out.push(c); } });
  return out;
}

/* ── 3. 状態 ──────────────────────────── */
var S = {
  logs:[],        // {id,kind,body,occurred_at,place,people[],tags[]}
  months:{},      // 'YYYY-MM' -> {title, chapter:{...}, tone, angle}
  years:{},       // 'YYYY'    -> {title}
  futures:[],     // {id,body,mode,due,done_at}
  cfg:{ supabaseUrl:'', supabaseKey:'', claudeKey:'', userKey:'', model:'claude-sonnet-4-5', fb:{} },
  ym: todayISO().slice(0,7),
  year: todayISO().slice(0,4),
  view: 'log',

/* ── 4. 保存層（localStorage ＋ Supabase REST）─────────────
   Supabase の URL / anon key が設定されていれば、
   PostgREST 経由で読み書きし、常に localStorage にも複製する。
   未設定なら完全にローカルだけで動く。            */
var Store = (function(){
  function local(){
    try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; }
  }
  /* お試し表示(?demo=1)のあいだは、何ひとつ保存しない。
     人の記録の上にサンプルを書き込まないための、いちばん外側の栓。 */
  function saveLocal(){
    if(S.preview) return;
    try{
      localStorage.setItem(LS, JSON.stringify({
        logs:S.logs, months:S.months, years:S.years, futures:S.futures, cfg:S.cfg
      }));
    }catch(e){}
  }
  function on(){
    if(S.preview) return false;
    return !!(S.cfg.supabaseUrl && S.cfg.supabaseKey && S.cfg.userKey);
  }
  function url(path){ return S.cfg.supabaseUrl.replace(/\/$/,'') + '/rest/v1/' + path; }
  function hd(extra){
    var h = { 'apikey':S.cfg.supabaseKey, 'Content-Type':'application/json' };
    /* 旧来の anon キー(JWT)は Authorization も必要。
       新形式の sb_publishable_... は apikey だけで anon ロールとして通る。 */
    if(/^eyJ/.test(S.cfg.supabaseKey)) h['Authorization'] = 'Bearer ' + S.cfg.supabaseKey;
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  }
  function q(table, params){
    return fetch(url(table+'?user_key=eq.'+encodeURIComponent(S.cfg.userKey)+(params?'&'+params:'')),
      {headers:hd()}).then(function(r){ if(!r.ok) throw new Error(table+' '+r.status); return r.json(); });
  }
  function upsert(table, row){
    if(!on()) { saveLocal(); return Promise.resolve(); }
    row = Object.assign({user_key:S.cfg.userKey}, row);
    return fetch(url(table), {method:'POST', headers:hd({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(row)}).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); });
  }
  function del(table, id){
    if(!on()) { saveLocal(); return Promise.resolve(); }
    return fetch(url(table+'?id=eq.'+encodeURIComponent(id)+'&user_key=eq.'+encodeURIComponent(S.cfg.userKey)),
      {method:'DELETE', headers:hd()});
  }
  return {
    on:on, saveLocal:saveLocal,
    boot:function(){
      var d = local();
      if(d){
        S.logs = d.logs||[]; S.months = d.months||{}; S.years = d.years||{};
        S.futures = d.futures||[]; S.cfg = Object.assign(S.cfg, d.cfg||{});
      }
      if(!S.cfg.userKey) S.cfg.userKey = 'me-'+uid();
      if(dedupeInMemory()) saveLocal();      /* 重複は読み込み時点で落としておく */
    },
    /* サーバとローカルを「足し合わせて」揃える。
       どちらか一方が空でも、もう一方のデータを消さない。 */
    pull:function(){
      if(!on()) return Promise.resolve(false);
      var mine = {logs:S.logs.slice(), futures:S.futures.slice(),
                  months:Object.assign({},S.months), years:Object.assign({},S.years)};
      return Promise.all([
        q('logs','order=occurred_at.asc'), q('months',''), q('years',''), q('futures','')
      ]).then(function(res){
        var rLogs = (res[0]||[]).map(function(r){
          return {id:r.id, kind:r.kind, body:r.body, occurred_at:r.occurred_at,
                  place:r.place||'', people:r.people||[], tags:r.tags||[]};
        });
        var rFut = (res[3]||[]).map(function(r){
          return {id:r.id, body:r.body, mode:r.mode, due:r.due, done_at:r.done_at};
        });
        var seen={}; rLogs.forEach(function(l){ seen[l.id]=1; });
        var pushLogs = mine.logs.filter(function(l){ return !seen[l.id]; });
        S.logs = rLogs.concat(pushLogs).sort(function(a,b){ return a.occurred_at<b.occurred_at?-1:1; });

        var seenF={}; rFut.forEach(function(f){ seenF[f.id]=1; });
        var pushFut = mine.futures.filter(function(f){ return !seenF[f.id]; });
        S.futures = rFut.concat(pushFut);

        S.months = {}; (res[1]||[]).forEach(function(r){
          S.months[r.ym]={title:r.title, chapter:r.chapter, tone:r.tone, angle:r.angle}; });
        var pushM=[]; Object.keys(mine.months).forEach(function(k){
          if(!S.months[k] || (!S.months[k].title && mine.months[k].title)){ S.months[k]=mine.months[k]; pushM.push(k); } });

        S.years = {}; (res[2]||[]).forEach(function(r){ S.years[r.year]={title:r.title}; });
        var pushY=[]; Object.keys(mine.years).forEach(function(k){
          if(!S.years[k] || (!S.years[k].title && mine.years[k].title)){ S.years[k]=mine.years[k]; pushY.push(k); } });

        dedupeInMemory();
        saveLocal();
        var jobs = pushLogs.map(function(l){ return upsert('logs', l); })
          .concat(pushFut.map(function(f){ return upsert('futures', f); }))
          .concat(pushM.map(function(k){ var m=S.months[k];
            return upsert('months',{id:S.cfg.userKey+':'+k, ym:k, title:m.title||null, chapter:m.chapter||null, tone:m.tone||null, angle:m.angle||null}); }))
          .concat(pushY.map(function(k){
            return upsert('years',{id:S.cfg.userKey+':'+k, year:k, title:(S.years[k]||{}).title||null}); }));
        var pushed = jobs.length;
        return Promise.all(jobs).catch(function(e){ console.warn('push', e); }).then(function(){ return pushed; });
      });
    },
    putLog:function(l){ saveLocal(); return upsert('logs', l).catch(errSync); },
    delLog:function(id){ saveLocal(); return del('logs', id).catch(errSync); },
    putMonth:function(ym){ saveLocal(); var m=S.months[ym]||{};
      return upsert('months', {id:S.cfg.userKey+':'+ym, ym:ym, title:m.title||null, chapter:m.chapter||null,
        tone:m.tone||null, angle:m.angle||null}).catch(errSync); },
    putYear:function(y){ saveLocal(); var v=S.years[y]||{};
      return upsert('years', {id:S.cfg.userKey+':'+y, year:y, title:v.title||null}).catch(errSync); },
    putFuture:function(f){ saveLocal(); return upsert('futures', f).catch(errSync); },
    delFuture:function(id){ saveLocal(); return del('futures', id).catch(errSync); }
  };
  function errSync(e){ console.warn('sync', e); toast('同期に失敗しました（端末には保存済み）'); }
})();

/* 同じ内容の記録は一度きりにする。読み込み・同期のたびに通す。 */
function dedupeInMemory(){
  var seen={}, out=[], removed=0;
  S.logs.slice().sort(function(a,b){ return a.id<b.id?-1:1; }).forEach(function(l){
    var k=kindOf(l)+'|'+l.occurred_at+'|'+String(l.body||'').trim();
    if(seen[k]){ removed++; return; } seen[k]=1; out.push(l);
  });
  S.logs = out.sort(function(a,b){ return a.occurred_at<b.occurred_at?-1:1; });
  var fs={}, fo=[], fr=0;
  S.futures.slice().sort(function(a,b){ return a.id<b.id?-1:1; }).forEach(function(f){
    var k=String(f.body||'').trim()+'|'+(f.mode||'')+'|'+(f.due||'')+'|'+(f.done_at||'');
    if(fs[k]){ fr++; return; } fs[k]=1; fo.push(f);
  });
  S.futures = fo;
  S.dupCount = removed + fr;
  return S.dupCount;
}

/* ── 5. シート（ボトムモーダル）────────── */
var Sheet = (function(){
  var el=$('#sheet'), sc=$('#scrim'), body=$('#sheetBody'), openFlag=false;
  function open(html, after){
    body.innerHTML = html; el.classList.add('on'); sc.classList.add('on'); openFlag=true;

  function close(){ el.classList.remove('on'); sc.classList.remove('on'); openFlag=false; }
  sc.addEventListener('click', close);
  return {open:open, close:close, isOpen:function(){ return openFlag; }, body:function(){ return body; }};
})();

/* ── 補助質問 ────────────────────────────
   毎回は聞かない。抽出の確信度が低いときだけ、保存のあとに一問だけ。
   必ずスキップを用意し、連続では聞かない。 */
var ASK = {
  where: {q:'どこに惹かれましたか？', opts:['色や形','空気感','考え方','体験','うまく言えない'],
          kind:'tag'},
  changed:{q:'あなたがしたことで、何が変わりましたか？', ph:'例：みんなが動けるようになった',
          kind:'text'},
  lack:  {q:'何があれば、少し違っていたと思いますか？', ph:'例：もう少し時間があれば',
          kind:'text'},
  small: {q:'まず小さく試すなら、何ができそうですか？', ph:'例：一回だけ人に見せてみる',
          kind:'text'}
};
function pickAsk(e){
  if(e.confidence >= .58) return null;                  /* 十分に具体なら聞かない */
  if(e.inputTag==='moved' && !e.statedReason && !e.aestheticAttributes.length) return 'where';
  if(e.inputTag==='effort' && e.userAction && !e.outcome) return 'changed';
  if(e.energy==='drain' && !e.statedReason) return 'lack';
  if(e.wish && !e.nextInterest) return 'small';
  if(!e.emotions.length && !e.userAction) return 'lack';
  return null;
}
function maybeAsk(l){
  var e;
  try{ e = extract(l); }catch(err){ return; }
  var key = pickAsk(e);
  if(!key) return;
  if(S.cfg.lastAsk === l.id) return;
  if(S.cfg.askedPrev) { S.cfg.askedPrev = false; Store.saveLocal(); return; }  /* 連続では聞かない */
  var A = ASK[key];
  var body = '<h2>'+esc(A.q)+'</h2><p class="sub">答えなくても大丈夫です。分かるときだけで足ります</p>';
  if(A.kind==='tag') body += '<div class="chips" id="_a"></div>';
  else body += '<div class="field"><textarea id="_t" placeholder="'+esc(A.ph)+'"></textarea></div>';
  body += '<div class="actions">'+
          (A.kind==='text' ? '<button class="btn" id="_ok">これも残す</button>' : '')+
          '<button class="btn ghost sm" id="_skip">スキップ</button></div>';
  function done(added){
    S.cfg.askedPrev = true; S.cfg.lastAsk = l.id; Store.saveLocal();
    Sheet.close();
    if(added){ Store.putLog(l); renderAll(); toast('足しました'); }
  }
  Sheet.open(body, function(b){
    if(A.kind==='tag'){
      var w=b.querySelector('#_a');
      A.opts.forEach(function(o){
        var c=document.createElement('button');
        c.type='button'; c.className='chip'; c.textContent=o;
        c.onclick=function(){
          if(o!=='うまく言えない'){ l.tags=(l.tags||[]).concat([o]); done(true); } else done(false);
        };
        w.appendChild(c);
      });
    } else {
      b.querySelector('#_t').focus();
      b.querySelector('#_ok').onclick=function(){
        var v=b.querySelector('#_t').value.trim();
        if(!v){ done(false); return; }
        l.body = String(l.body||'').replace(/[。.\s]+$/,'') + '。' + v;
        done(true);
      };
    }
    b.querySelector('#_skip').onclick=function(){ done(false); };
  });
}

function splitList(s){
  return String(s||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
}

    function(b){

      function syncDate(){ b.querySelector('#_dw').style.display = f.mode==='anytime'?'none':''; }
      MODES.forEach(function(m){
        var c=document.createElement('button'); c.className='chip'+(m[0]===f.mode?' on':''); c.textContent=m[1];
        c.onclick=function(){ f.mode=m[0]; $$('.chip',mw).forEach(function(x){x.classList.remove('on');}); c.classList.add('on'); syncDate(); };
        mw.appendChild(c);
      });
      syncDate();
      b.querySelector('#_ok').onclick=function(){
        var body=b.querySelector('#_b').value.trim();
        if(!body){ toast('内容を書いてください'); return; }
        f.body=body; f.due = f.mode==='anytime' ? null : (b.querySelector('#_d').value||todayISO());
        var i=S.futures.map(function(x){return x.id;}).indexOf(f.id);
        if(i<0) S.futures.push(f); else S.futures[i]=f;
        Store.putFuture(f); Sheet.close(); renderAll(); toast('置いておきました');
      };
      if(b.querySelector('#_done')) b.querySelector('#_done').onclick=function(){
        f.done_at = f.done_at ? null : todayISO();
        var i=S.futures.map(function(x){return x.id;}).indexOf(f.id); S.futures[i]=f;
        Store.putFuture(f); Sheet.close(); renderAll();
        toast(f.done_at?'叶いました。ログにも入ります':'完了をとりけしました');
      };
      if(b.querySelector('#_del')) b.querySelector('#_del').onclick=function(){
        S.futures=S.futures.filter(function(x){return x.id!==f.id;});
        Store.delFuture(f.id); Sheet.close(); renderAll();
      };
      b.querySelector('#_ng').onclick=Sheet.close;
    });
}

function mixHex(a,b,t){
  function h2(x){ x=x.replace('#',''); if(x.length===3) x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]; }
  var p=h2(a), q=h2(b);
  return 'rgb('+Math.round(p[0]+(q[0]-p[0])*t)+','+Math.round(p[1]+(q[1]-p[1])*t)+','+Math.round(p[2]+(q[2]-p[2])*t)+')';
}
function hash01(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%100000)/100000;
}

                 vw:['数字だけ','結果だけ','成果だけ','売上だけ','一つの指標','点数']}
];

/* 美意識。単体の「好き」ではなく、複数の対象に共通する要素を取り出す。 */
var AESTH = [
  {id:'a_blur',  label:'境界が曖昧なもの',
   sum:'はっきり区切られたものより、混ざって溶けているものに目が止まっている。',
   w:['にじみ','ぼか','グラデ','曖昧','混ざ','溶け','霧','もや','淡い','ふわ']},
  {id:'a_space', label:'余白のある表現',
   sum:'埋めることより、空けておくことに心地よさを感じている。',
   w:['余白','空白','静か','シンプル','少なめ','引き算','間が','すっき','削ぎ']},
  {id:'a_grow',  label:'完成を急がず育てること',
   sum:'仕上がったものより、育っている途中のものに惹かれている。',
   w:['未完成','途中','育て','試作','ラフ','下書き','これから','急がな','じっくり','発酵']},
  {id:'a_flow',  label:'流動的で重なりのある世界',
   sum:'固まったものより、流れて重なっていくものを選んでいる。',
   w:['波','流れ','重な','層','ゆらぎ','うねり','水','川','雲','海','循環']},
  {id:'a_hand',  label:'手のあとが残るもの',
   sum:'均一なものより、手のあとが見えるものに触れていたい。',
   w:['手描き','手仕事','版画','活版','紙','質感','かすれ','手触り','手を動か','アナログ']},
  {id:'a_light', label:'光と透明感',
   sum:'重い色より、光が通るものに繰り返し戻っている。',
   w:['光','透明','透け','青','水色','ガラス','反射','朝','窓','きらめ']}
];

/* 行動の型。「資料作成が得意」ではなく「何を何に変えたか」で持つ。 */
var VERB_LEX = [
  {v:'構成する',   w:['構成','流れを','組み立て','設計','企画','段取り']},
  {v:'編集する',   w:['編集','まとめ','整理','書き直','整え','削っ']},
  {v:'翻訳する',   w:['図に','図解','説明','言語化','伝え','分かる形','動きやすく','噛み砕']},
  {v:'つくる',     w:['つく','作っ','描い','制作','試作','完成','形にし']},
  {v:'つなぐ',     w:['紹介','声をかけ','巻き込','つなぎ','一緒に','引き合わ']},
  {v:'選び直す',   w:['決めた','選んだ','断っ','やめ','決めない','とどま','手放し']},
  {v:'受けとめる', w:['聞い','受け止め','支え','寄り添','待っ']},
  {v:'対応する',   w:['対応','問い合わせ','依頼','調整','返信','処理']},
  {v:'掘り下げる', w:['調べ','読み込','分析','たどっ','深掘','検証']}
];

/* 結果が変わったことの手がかり。強みは「やった」ではなく「変わった」で測る。 */
var OUTCOME_RE = [
  /(ようになった|ようにな|変わった|進み始め|動き出し|決ま(っ|り)|通っ|通った|受かっ|終わ(っ|らせ)|完成し|届いた|できた|うまくいっ|解け|前に進)/,
  /(なくなった|減った|増えた|早くなった|楽になった)/
];
var FEEDBACK_RE = /(と言われ|と言ってもら|褒め|感謝され|喜ばれ|評価され|お礼|ありがとう|助かる|反応があ|伝わった|理解して)/;
var CHOICE_RE   = /(決めた|決めない|決めなくて|選んだ|選び直|断っ|やめた|とどま|進むと|行くと決め|手放し)/;
var TRADEOFF_RE = /(けれど|けど|でも|ても|より|かわりに|代わりに|一方で|ながらも|ものの)/;
var REASON_RE   = /([^。、]{4,40})(ので|から|ため|おかげ)[、。]/;
var WISH_RE     = /([^。]{2,40})(したい|してみたい|なりたい|続けたい|ひらきたい|つくりたい|行きたい|会いたい|やってみたい|試したい)/;
var NEXT_RE     = /(試し|やってみ|行ってみ|始めて|一回|一度|小さく|まずは)/;
var EXPECT_RE   = /(はずだった|と思っていた|つもりだった|期待し|望んで|欲しかった|見てほしかった|分かってほしかった)/;

var CTX_LEX = [
  {c:'仕事',   w:['仕事','会社','職場','上司','同僚','チーム','案件','業務','クライアント','顧客','会議','面談','評価','納期']},
  {c:'制作',   w:['制作','つく','描い','企画','設計','作品','試作','ZINE','版画']},
  {c:'学び',   w:['勉強','学び','研修','読ん','調べ','資格','講座']},
  {c:'人との時間', w:['友','家族','恋人','一緒','会っ','話し','紹介','飲み','相談']},
  {c:'ひとりの時間', w:['ひとり','一人','静か','散歩','眺め','家で','部屋で']},
  {c:'外へ出た日', w:['展示','美術館','ギャラリー','旅','海','山','公園','カフェ','街']}
];

/* 「落ち着かない」を「落ち着く」と読まないための打ち消し判定。
   語のすぐあとに否定が続くときは、当たったことにしない。 */
var NEG_TAIL = /^[いくきしせりれらえまなはくつ]{0,2}(な(い|く|かった|くて|さ)|ませんで|ません|ず|ぬ|ないまま)/;
function negated(t, w){
  var i = t.indexOf(w);
  while(i >= 0){
    if(!NEG_TAIL.test(t.slice(i + w.length, i + w.length + 6))) return false;  /* 否定でない出現がある */
    i = t.indexOf(w, i + 1);
  }
  return true;
}
function hitAny(t, ws){ for(var i=0;i<ws.length;i++){ if(t.indexOf(ws[i])>=0 && !negated(t, ws[i])) return true; } return false; }
function countAny(t, ws){ var n=0; for(var i=0;i<ws.length;i++){ if(t.indexOf(ws[i])>=0 && !negated(t, ws[i])) n++; } return n; }
function clause(t, re){ var m = t.match(re); return m ? m[0] : null; }

/* 一文を、意味のかたまりに割る */
function segs(t){
  return String(t||'').split(/[。．\n]+/).map(function(x){ return x.trim(); }).filter(Boolean);
}

function extract(l){
  var body = String(l.body||'');
  var text = body + ' ' + (l.tags||[]).join(' ') + ' ' + (l.place||'') + ' ' + (l.people||[]).join(' ');
  var tag  = kindOf(l);                       /* 入口。分析の弱い前提としてだけ使う */
  var ss   = segs(body);

  /* ── 何についての出来事か ── */
  var object  = canonList((l.tags||[]).slice());
  AESTH.forEach(function(a){ a.w.forEach(function(w){ if(body.indexOf(w)>=0 && object.indexOf(w)<0) object.push(w); }); });
  var context = CTX_LEX.filter(function(c){ return hitAny(text, c.w); }).map(function(c){ return c.c; });
  if((l.people||[]).length && context.indexOf('人との時間')<0) context.push('人との時間');
  if(l.place) context.push(canon(l.place));

  /* ── 何が起きたか ── */
  var situation = ss[0] || body;
  var verbs = VERB_LEX.filter(function(d){ return hitAny(text, d.w); }).map(function(d){ return d.v; });
  var userAction = verbs.length ? verbs.join('・') : null;
  var outcome = null;
  for(var oi=0; oi<OUTCOME_RE.length; oi++){
    var om = body.match(OUTCOME_RE[oi]);
    if(om){ outcome = (ss.filter(function(x){ return OUTCOME_RE[oi].test(x); })[0]) || om[0]; break; }
  }
  var externalFeedback = FEEDBACK_RE.test(body)
    ? (ss.filter(function(x){ return FEEDBACK_RE.test(x); })[0] || null) : null;

  /* ── 本人の反応 ── */
  var emotions = [], vsum = 0, vn = 0;
  EMO_LEX.forEach(function(d){
    if(hitAny(body, d.w)){ emotions.push(d.e); vsum += d.v; vn++; }
  });
  var valence = vn ? vsum/vn : (tag==='moved' ? .45 : tag==='effort' ? .15 : 0);
  var inten = Math.max(.15, Math.min(1, (vn ? Math.abs(valence) : .3) + Math.min(.3, (vn-1)*0.12) +
                       (/[！!]|とても|すごく|ほんとう|本当に|ずっと/.test(body) ? .15 : 0)));

  /* ── 何が満たされた・侵害されたか ── */
  var satisfied = [], violated = [];
  NEEDS.forEach(function(d){
    var vhit = countAny(body, d.vw), shit = countAny(body, d.w);
    if(vhit > 0 && vhit >= shit) violated.push(d.n);
    else if(shit > 0) satisfied.push(d.n);
  });

  var energy = violated.length > satisfied.length ? 'drain'
             : satisfied.length > violated.length ? 'gain'
             : valence >  .25 ? 'gain'
             : valence < -.25 ? 'drain' : 'neutral';

  /* ── 選択と背景 ── */
  var choice = CHOICE_RE.test(body) ? (ss.filter(function(x){ return CHOICE_RE.test(x); })[0] || null) : null;
  var tradeoff = (choice && TRADEOFF_RE.test(choice)) ? choice : (TRADEOFF_RE.test(body) && choice ? body : null);
  var rm = body.match(REASON_RE);
  var statedReason = rm ? rm[1] : null;

  /* ── 未来への方向 ── */
  var wm = body.match(WISH_RE);
  var wish = wm ? wm[0] : null;
  var nextInterest = (wish && NEXT_RE.test(body)) ? wish : null;

  /* ── 美意識 ── */
  var aesthetic = AESTH.filter(function(a){ return hitAny(body, a.w); }).map(function(a){ return a.id; });

  /* ── 仮説（このあと証拠を横断して重みづけされる）── */
  var ids = function(dict){ return dict.filter(function(d){ return lexHits(d, text)>0; }).map(function(d){ return d.id; }); };
  var conds = LEX.conditions.filter(function(d){ return lexHits(d, text)>0; });

  /* eventType は入口タグではなく、反応と欲求から決める */
  var et = energy==='drain' || valence < -.2 ? 'pain'
         : (verbs.length && valence <= .45)  ? 'effort'
         : 'moved';

  var autonomy = choice ? .9 : hitAny(body, ['言われ','指示','依頼','問い合わせ','対応','決められ']) ? .2
               : hitAny(body, ['自分で','自分の言葉','自主','任され']) ? .85
               : et==='effort' ? .6 : .45;
  var creative = /つく|作っ|描い|企画|設計|構成|物語|デザイン|制作|形にし/.test(body) ? .8
               : /対応|調整|返信|処理|問い合わせ/.test(body) ? .15 : .4;

  /* ── どの領域の話か。断定せず、確からしさも一緒に返す。
        確からしさが低いものは、どちらのMapにも押し込まず「全て」に残す。 ── */
  var dscore = {career:0, private:0, relationship:0, life:0.25};
  if(context.indexOf('仕事')>=0) dscore.career += 1.1;
  if(context.indexOf('学び')>=0) dscore.career += 0.7;
  if(context.indexOf('制作')>=0) dscore.private += 0.7;
  if(context.indexOf('外へ出た日')>=0) dscore.private += 0.6;
  if(context.indexOf('ひとりの時間')>=0) dscore.private += 0.5;
  if(context.indexOf('人との時間')>=0 || (l.people||[]).length) dscore.relationship += 0.9;
  dscore.private += Math.min(1.2, aesthetic.length*0.5 + ids(LEX.interests).length*0.35);
  dscore.career  += Math.min(1.0, ids(LEX.strengths).length*0.45 + (outcome?0.3:0) + (externalFeedback?0.3:0));
  if(tag==='effort') dscore.career  += 0.55;      /* 入口は弱い前提としてだけ足す */
  if(tag==='moved')  dscore.private += 0.55;
  var dranked = Object.keys(dscore).sort(function(x,y){ return dscore[y]-dscore[x]; });
  var dom = dranked[0], dTop = dscore[dranked[0]], dSecond = dscore[dranked[1]] || 0;
  var dsum = dranked.reduce(function(a,k){ return a+dscore[k]; }, 0) || 1;
  var domainConfidence = Math.max(0, Math.min(1, (dTop/dsum) + (dTop-dSecond)*0.22));
  /* 仕事と日常の両方に同じ構造があれば、どちらにも出す（Bridge） */
  var bridged = (dscore.career >= 0.9 && dscore.private >= 0.9);

  /* 繰り返し戻ってくる具体物。美意識の芯になる */
  var motifs = [];
  AESTH.forEach(function(a){ a.w.forEach(function(w){
    if(body.indexOf(w)>=0 && motifs.indexOf(w)<0) motifs.push(w); }); });
  /* つながりを探すときの手がかり。言葉そのものだけでなく、
     その言葉が属する美意識や、満たされた／損なわれた願いも一緒に見る。
     「にじみ」と「波線」を別ものにしないため。 */
  var themes = themeSet(motifs, aesthetic, satisfied, violated, ids(LEX.values));
  var meaning = satisfied.indexOf('意味')>=0 ? .85 : violated.indexOf('意味')>=0 ? .15
              : (externalFeedback ? .65 : .45);
  var completion = outcome ? .8 : violated.indexOf('完結感')>=0 ? .15 : .4;

  /* 確信度：具体が多いほど高い。低いときだけ、あとで一問だけ聞く。 */
  var conf = Math.min(1, .28
    + (emotions.length ? .16 : 0)
    + (verbs.length ? .14 : 0)
    + (outcome ? .12 : 0)
    + (object.length ? .10 : 0)
    + (satisfied.length + violated.length ? .12 : 0)
    + (statedReason ? .08 : 0)
    + ((l.tags||[]).length ? .06 : 0));

  return {
    /* Evidence（仕様の形） */
    object: object, context: canonList(context),
    situation: situation, userAction: userAction, outcome: outcome, externalFeedback: externalFeedback,
    emotions: emotions, emotionalIntensity: inten, energy: energy,
    satisfiedNeeds: satisfied, violatedNeeds: violated,
    choice: choice, tradeoff: tradeoff, statedReason: statedReason,
    wish: wish, nextInterest: nextInterest,
    aestheticAttributes: aesthetic,
    valueCandidates: ids(LEX.values), strengthCandidates: ids(LEX.strengths),
    tensionCandidates: [],
    /* 既存のMap側が読む形（互換） */
    id:l.id, occurredAt: l.undated ? null : l.occurred_at, rawText: body,
    timestamp: l.undated ? null : l.occurred_at,
    source: l.demo ? 'demo' : 'log',
    inputTag: tag, eventType: et, domain: dom,
    domainConfidence: domainConfidence, bridged: bridged,
    motifs: motifs, themes: themes, meaning: meaning, completion: completion,
    places: canonList(l.place ? [l.place] : []),
    actions: verbs, wishCandidates: wish ? [wish] : [],
    isChoice: !!choice, isWish: !!wish,
    action: verbs, objects: object,
    entities: canonList(object.concat(l.people||[]).concat(l.place?[l.place]:[])),
    people: canonList(l.people||[]),
    emotionalValence: valence, arousal: inten,
    agency: autonomy, autonomy: autonomy, creativeControl: creative,
    energyDelta: energy==='gain' ? .6 : energy==='drain' ? -.7 : 0,
    socialContext: (l.people||[]).length ? '人と一緒'
                 : /依頼|問い合わせ|言われ|指示/.test(body) ? '他者からの依頼' : 'ひとり',
    candidateValues: ids(LEX.values), candidateStrengths: ids(LEX.strengths),
    candidateInterests: ids(LEX.interests), candidateConditions: conds.map(function(c){ return c.id; }),
    candidateAesthetics: aesthetic,
    strengthVerbs: verbs, missingNeeds: violated,
    tensions: [], wishes: wish ? [wish] : [], futureIntent: wish,
    importance: l.importance||0, userConfirmed: !!l.userConfirmed,
    confidence: conf
  };
}
function toLogEntry(l){
  if(l.entry) return l.entry;                    /* 既に構造化済みならそのまま使う */
  return extract(l);
}

/* Future Memo も証拠として扱う（未来側の記録）。形は Evidence とそろえる。 */
function futureEntry(f){
  var text = f.body||'';
  var ids = function(dict){ return dict.filter(function(d){ return lexHits(d,text)>0; }).map(function(d){ return d.id; }); };
  var aesthetic = AESTH.filter(function(a){ return hitAny(text, a.w); }).map(function(a){ return a.id; });
  return {
    object:[], context:['これから'], situation:text, userAction:null, outcome:null, externalFeedback:null,
    emotions:['憧れ'], emotionalIntensity:.5, energy:'gain',
    satisfiedNeeds:[], violatedNeeds:[],
    choice:null, tradeoff:null, statedReason:null,
    wish:text, nextInterest:text, aestheticAttributes:aesthetic,
    valueCandidates:ids(LEX.values), strengthCandidates:[], tensionCandidates:[],
    id:'f:'+f.id, occurredAt: f.done_at || f.due || null, rawText:text, inputTag:'moved',
    timestamp: f.done_at || f.due || null, source:'future_memo',
    domainConfidence:.5, bridged:false,
    motifs: (function(){ var ms=[]; AESTH.forEach(function(a){ (a.w||[]).forEach(function(w){
      if(text.indexOf(w)>=0 && ms.indexOf(w)<0) ms.push(w); }); }); return ms; })(),
    themes: (function(){ var ms=[]; AESTH.forEach(function(a){ (a.w||[]).forEach(function(w){
      if(text.indexOf(w)>=0 && ms.indexOf(w)<0) ms.push(w); }); });
      return themeSet(ms, aesthetic, [], [], ids(LEX.values)); })(),
    meaning:.7, completion:.2,
    places:[], actions:[], wishCandidates:[text],
    eventType:'wish', domain:'life', entities:[], emotionalValence:.5, agency:.6, arousal:.5,
    autonomy:.6, creativeControl:.5, energyDelta:.6, socialContext:'ひとり',
    candidateValues:ids(LEX.values), candidateStrengths:[],
    candidateInterests:ids(LEX.interests), candidateConditions:[], candidateAesthetics:aesthetic,
    action:[], objects:[], people:[], strengthVerbs:[], missingNeeds:[],
    tensions:[], wishes:[text], futureIntent:text,
    importance:0, userConfirmed:false, isFuture:true, isWish:true, isChoice:false,
    confidence:.6, due:f.due, doneAt:f.done_at
  };
}

/* ── フィードバック（自分らしい／少し違う）── */
function fbGet(id){ return (S.cfg.fb||{})[id] || 0; }
function fbSet(id, v){
  S.cfg.fb = S.cfg.fb || {};
  if(S.cfg.fb[id]===v) delete S.cfg.fb[id]; else S.cfg.fb[id]=v;
  Store.saveLocal();
}

/* ── 仮説の育ち方 ──
   仮説は「当たっている／外れている」ではなく、どこまで育ったかで扱う。
   芽 → 育ちつつある → 根づいた／変わりつつある／ゆれている。
   本人の言葉が最終決定権を持つので、5つの応答をここに保存する。 */
var STAGEJA = {
  seed:'仮説の芽', growing:'育ちつつある仮説', rooted:'根づいた仮説',
  changing:'変わりつつある仮説', tension:'ゆれている仮説'
};
var STAGENOTE = {
  seed:'まだ1つの記録から見えた芽です。合っているかは、これから確かめます。',
  growing:'まだ確かめている途中です。合わなければ、いつでも書き換えられます。',
  rooted:'時間をまたいで何度も現れています。それでも、決めつけではありません。',
  changing:'言葉が合わなくなってきているかもしれません。書き換えていける段階です。',
  tension:'どちらも本当で、いまは片方を選ばなくて大丈夫です。'
};
var HYPOPT = [
  {v:'me',     t:'自分らしい'},
  {v:'off',    t:'少し違う'},
  {v:'unsure', t:'今は分からない'},
  {v:'reword', t:'言葉を変える'},
  {v:'del',    t:'この仮説を削除する'}
];
function hypGet(id){
  var h = (S.cfg.hyp||{})[id];
  if(h) return h;
  var f = fbGet(id);                     /* 旧データ（自分らしい／少し違う）も読む */
  return f>0 ? {v:'me'} : f<0 ? {v:'off'} : null;
}
function hypSet(id, v, text){
  S.cfg.hyp = S.cfg.hyp || {};
  if(!v) delete S.cfg.hyp[id];
  else S.cfg.hyp[id] = {v:v, text:text||'', at:todayISO()};
  /* 旧キーも合わせて動かし、既存の並び替えを壊さない */
  S.cfg.fb = S.cfg.fb || {};
  if(v==='me') S.cfg.fb[id]=1;
  else if(v==='off'||v==='del') S.cfg.fb[id]=-1;
  else delete S.cfg.fb[id];
  Store.saveLocal();
}
/* 削除は「なかったこと」にはしない。地図から外すだけで、記録そのものは残る。 */
function hypDropped(id){ var h=hypGet(id); return !!(h && h.v==='del'); }
function hypLabel(n){ var h=hypGet(n.id); return (h && h.v==='reword' && h.text) ? h.text : n.label; }
function stageOf(n){
  if(!n || n.kind==='self' || n.kind==='evidence' || n.kind==='chapter') return null;
  var h = hypGet(n.id);
  if(h && (h.v==='reword' || h.v==='unsure')) return 'changing';
  if(n.kind==='tension') return 'tension';
  var st = n.stat || {n:(n.evidenceIds||[]).length, months:1, days:1, domains:1};
  if(n.tier==='identity' || (h && h.v==='me' && st.n>=2)) return 'rooted';
  if(n.tier==='pattern' || st.n>=2) return 'growing';
  return 'seed';
}

function themeSet(motifs, aestheticIds, satisfied, violated, valueIds){
  var out = [];
  function add(x){ if(x && out.indexOf(x)<0) out.push(x); }
  (motifs||[]).forEach(add);
  (aestheticIds||[]).forEach(function(id){
    var a = AESTH.filter(function(x){ return x.id===id; })[0]; if(a) add(a.label);
  });
  (valueIds||[]).forEach(function(id){
    var v = LEX.values.filter(function(x){ return x.id===id; })[0]; if(v) add(v.chip||v.label);
  });
  (satisfied||[]).forEach(add);
  (violated||[]).forEach(add);
  return out;
}

/* ── つながりの種類 ──
   線は6種類だけ。どれも「こうだ」ではなく「こう見える」と言う。 */
var REL_MAX = 2;                       /* 1つの記録が最初から持つ線の本数 */
var RELJA = {
  foreshadow:  {t:'伏線',            c:'#9587DE'},
  recurrence:  {t:'繰り返し',        c:'#D8B56A'},
  reversal:    {t:'反転',            c:'#C76F87'},
  cross_domain:{t:'領域をまたぐ',    c:'#68CBC4'},
  tension:     {t:'ゆれ',            c:'#B4728A'},
  orphan:      {t:'まだつながらない',c:'#8E97B5'}
};
function DOMJA(d){
  return d==='career' ? '仕事' : d==='private' ? '暮らし' :
         d==='relationship' ? '人との関わり' : '生活';
}

/* ── 洞察の生成 ── */
var Insight = (function(){
  function mk(kind, id, label, sum, evs){
    return {id:id, kind:kind, label:label, summary:sum, score:0, confidence:0,
            evidenceIds:evs.slice(), relatedValueIds:[], confirmed:false};
  }
  function stats(entries, evs){
    var es = evs.map(function(id){ return entries[id]; }).filter(Boolean);
    var months={}, days={}, domains={}, choice=0, effort=0, emo=0, minM=null, maxM=null;
    es.forEach(function(e){
      if(e.occurredAt){ var m=e.occurredAt.slice(0,7); months[m]=1; days[e.occurredAt]=1;
        if(!minM||m<minM) minM=m; if(!maxM||m>maxM) maxM=m; }
      domains[e.domain]=1;
      if(e.isChoice||e.agency>=.8) choice++;
      if(e.agency>=.6) effort++;
      emo += e.emotionalIntensity;
    });
    var n = es.length||1;
    return {n:es.length, months:Object.keys(months).length, days:Object.keys(days).length,
            domains:Object.keys(domains).length,
            choice:choice/n, effort:effort/n, emo:emo/n, minM:minM, maxM:maxM,
            span: (minM&&maxM)? monthsBetween(minM,maxM) : 0};
  }
  function identityScore(st, node){
    var W=MAPC.IDENTITY_W;
    var stated = (fbGet(node.id)>0 ? 1 : 0);
    return  W.choice*st.choice + W.repeat*Math.min(1,(st.n-1)/3) + W.emotion*st.emo +
            W.domain*Math.min(1,(st.domains-1)/2) + W.effort*st.effort +
            W.duration*Math.min(1, st.span/12) + W.stated*stated;
  }

  /* ── 種類ごとのスコア。抽象語の申告回数ではなく、証拠の性質で測る。 ──
     どれも 0〜1。identity（＝その人らしさの確からしさ）として使う。 */

  /* 価値観：犠牲を払ってでも選んだか / 強く動いたか / 繰り返すか /
     侵害されたときに痛んだか / 未来の願いにも出てくるか */
  function valueScore(es, id){
    var n = es.length || 1;
    var sacrifice = es.filter(function(e){ return e.choice && (e.tradeoff || e.emotionalIntensity>=.5); }).length / n;
    var moved     = es.reduce(function(a,e){ return a + Math.min(1, e.emotionalIntensity); }, 0) / n;
    var repeat    = Math.min(1, (es.length-1)/3);
    var violated  = es.filter(function(e){ return e.violatedNeeds.length && e.energy==='drain'; }).length / n;
    var future    = es.some(function(e){ return e.wish || e.isFuture; }) ? 1 : 0;
    return .30*sacrifice + .20*moved + .20*repeat + .15*violated + .15*future;
  }

  /* 美意識：複数の対象に共通するか / 戻ってきているか / 自分から時間を使ったか /
     感情が動いたか / 理由を語っているか */
  function aestheticScore(es){
    var n = es.length || 1;
    var objs = {}; es.forEach(function(e){ (e.object||[]).forEach(function(o){ objs[o]=1; }); });
    var across  = Math.min(1, (Object.keys(objs).length)/3);
    var repeat  = Math.min(1, (es.length-1)/3);
    var own     = es.filter(function(e){ return e.autonomy>=.6 && e.socialContext!=='他者からの依頼'; }).length / n;
    var moved   = es.reduce(function(a,e){ return a + Math.min(1, e.emotionalIntensity); }, 0) / n;
    var stated  = es.some(function(e){ return e.statedReason; }) ? 1 : 0;
    return .30*across + .20*repeat + .20*own + .20*moved + .10*stated;
  }

  /* 強み：同じ行動を複数場面で / それで結果が変わったか / 他者の反応があるか /
     エネルギーが増えたか / 違う領域でも再現したか */
  function strengthScore(es){
    var n = es.length || 1;
    var sits = {}; es.forEach(function(e){ (e.context||[]).forEach(function(c){ sits[c]=1; }); });
    var doms = {}; es.forEach(function(e){ doms[e.domain]=1; });
    var repeat = Math.min(1, Object.keys(sits).length/3) * .5 + Math.min(1, (es.length-1)/3) * .5;
    var changed = es.filter(function(e){ return e.outcome; }).length / n;
    var praised = es.filter(function(e){ return e.externalFeedback; }).length / n;
    var gained  = es.filter(function(e){ return e.energy==='gain'; }).length / n;
    var cross   = Math.min(1, (Object.keys(doms).length-1)/2);
    return .25*repeat + .25*changed + .20*praised + .15*gained + .15*cross;
  }

  /* 次のステップ適合度：繰り返す強みを使えるか / 願いに近いか / 力の出る条件を満たすか /
     いまの制約で小さく試せるか / 新しい自己理解につながるか */
  function stepScore(parts){
    return .30*(parts.strength||0) + .25*(parts.wish||0) + .20*(parts.energy||0) +
           .15*(parts.small||0)    + .10*(parts.newness||0);
  }
  function tierOf(st){
    if(st.n >= MAPC.PROMOTE.identity && (st.months>=2 || st.domains>=2)) return 'identity';
    if(st.n >= MAPC.PROMOTE.pattern) return 'pattern';
    return 'seed';
  }
  function build(){
    var entries = {}, order = [];
    S.logs.forEach(function(l){ var e=toLogEntry(l); entries[e.id]=e; order.push(e.id); });
    S.futures.forEach(function(f){ var e=futureEntry(f); entries[e.id]=e; order.push(e.id); });

    var nodes = [], byId = {};
    function add(n){ nodes.push(n); byId[n.id]=n; return n; }

    /* self */
    var self = add(mk('self','self','いまの自分','','' ? [] : order.slice(0,1)));
    self.evidenceIds = order.slice();

    /* 価値観・強み・条件・惹かれるもの・美意識。
       種類ごとに違うスコア式を使う。抽象語の申告回数では測らない。 */
    function collect(dict, kind, field, scorer){
      dict.forEach(function(d){
        var evs = order.filter(function(id){ return (entries[id][field]||[]).indexOf(d.id)>=0; });
        if(!evs.length) return;
        var n = add(mk(kind, d.id, d.label, d.sum, evs));
        n.chip = d.chip; n.energy = d.energy;
        var st = stats(entries, evs);
        var es = evs.map(function(id){ return entries[id]; });
        n.stat = st; n.tier = tierOf(st);
        n.identity = scorer ? scorer(es, d.id) : identityScore(st, n);
        n.identity = Math.max(0, Math.min(1, n.identity*0.75 + identityScore(st,n)*0.25));
        n.confidence = Math.min(1, .25 + evs.length*0.25 + (st.domains-1)*.1);
        n.firstSeenAt = st.minM; n.lastSeenAt = st.maxM;
        n.confirmed = fbGet(d.id)>0;
        /* 根拠の内訳。カードで「なぜここにあるか」を具体で説明するために持つ。 */
        n.evidenceMix = {
          choice:   es.filter(function(e){ return e.choice; }).length,
          outcome:  es.filter(function(e){ return e.outcome; }).length,
          praised:  es.filter(function(e){ return e.externalFeedback; }).length,
          violated: es.filter(function(e){ return e.violatedNeeds.length; }).length,
          gain:     es.filter(function(e){ return e.energy==='gain'; }).length,
          objects:  (function(){ var o={}; es.forEach(function(e){ (e.object||[]).forEach(function(x){ o[x]=1; }); }); return Object.keys(o); })()
        };
      });
    }
    collect(LEX.values,     'value',     'candidateValues',     valueScore);
    collect(LEX.strengths,  'strength',  'candidateStrengths',  strengthScore);
    collect(LEX.conditions, 'condition', 'candidateConditions', null);
    collect(LEX.interests,  'interest',  'candidateInterests',  null);
    collect(AESTH,          'aesthetic', 'candidateAesthetics', aestheticScore);

    /* 価値観との関係づけ */
    nodes.forEach(function(n){
      if(n.kind==='value'||n.kind==='self') return;
      var vs={};
      n.evidenceIds.forEach(function(id){ (entries[id].candidateValues||[]).forEach(function(v){ vs[v]=(vs[v]||0)+1; }); });
      n.relatedValueIds = Object.keys(vs).filter(function(v){ return byId[v]; })
        .sort(function(a,b){ return vs[b]-vs[a]; }).slice(0,2);
    });

    /* 葛藤：どちらかを正解にせず、相反する2つを両方残したまま問いとして立てる。 */
    LEX.tensions.forEach(function(t){
      var have = t.need.every(function(id){ return byId[id]; });
      var withN = t.with.filter(function(id){ return byId[id]; });
      if(!have || !withN.length) return;
      var evs = [];
      t.need.concat(withN).forEach(function(id){ (byId[id].evidenceIds||[]).forEach(function(e){ if(evs.indexOf(e)<0) evs.push(e); }); });
      if(!evs.length) return;
      var n = add(mk('tension', t.id, t.label, t.sum, evs.slice(0,6)));
      var st = stats(entries, n.evidenceIds);
      n.stat=st; n.tier = st.n>=2?'pattern':'seed';
      n.identity = identityScore(st, n);
      n.confidence = Math.min(.85, .3 + evs.length*.12);
      n.relatedValueIds = t.need.concat(withN).filter(function(id){ return byId[id] && byId[id].kind==='value'; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(t.id)>0;
    });

    /* 相反する2つの価値が、どちらも証拠を持っているときに立てる葛藤。
       片方が満たされた記録と、もう片方が侵害された記録の両方があるほど強い。 */
    OPPOSE.forEach(function(o){
      var A=byId[o.a], B=byId[o.b];
      if(!A || !B || byId[o.id]) return;
      var evs=[];
      [A,B].forEach(function(x){ (x.evidenceIds||[]).slice(0,4).forEach(function(e){ if(evs.indexOf(e)<0) evs.push(e); }); });
      if(evs.length < 2) return;
      var es = evs.map(function(id){ return entries[id]; });
      var pull = es.filter(function(e){ return e.energy==='gain'; }).length;
      var push = es.filter(function(e){ return e.energy==='drain' || e.violatedNeeds.length; }).length;
      if(!pull || !push) return;                       /* 引っ張り合っていなければ葛藤にしない */
      var n = add(mk('tension', o.id, o.label, o.sum, evs.slice(0,6)));
      var st = stats(entries, n.evidenceIds);
      n.stat=st; n.tier = st.n>=3?'pattern':'seed';
      n.identity = Math.min(1, .35 + Math.min(.35, (pull+push)*.06) + identityScore(st,n)*.4);
      n.confidence = Math.min(.85, .35 + evs.length*.1);
      n.relatedValueIds = [o.a, o.b];
      n.sides = [A.label, B.label];
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(o.id)>0;
    });

    /* モヤモヤ：起きたこと → 期待していたこと → 不足していた条件 → 侵害された価値観。
       うまくいかなかった理由を能力不足に閉じず、本人と環境の相性として分けて置く。 */
    (function(){
      var byNeed = {};
      order.forEach(function(id){
        var e = entries[id];
        if(e.isFuture || e.energy!=='drain') return;
        (e.violatedNeeds||[]).forEach(function(nd){ (byNeed[nd] = byNeed[nd] || []).push(id); });
      });
      Object.keys(byNeed).forEach(function(nd){
        var F = FRICTION[nd]; if(!F) return;
        var evs = byNeed[nd];
        var es = evs.map(function(x){ return entries[x]; });
        var n = add(mk('friction', 'fr_'+nd, F.label, F.sum, evs.slice(0,6)));
        var st = stats(entries, n.evidenceIds);
        n.stat = st; n.tier = st.n>=3 ? 'identity' : st.n>=2 ? 'pattern' : 'seed';
        /* 繰り返しているほど、また感情が強いほど「いま残っている」ものとして上げる */
        n.identity = Math.min(1, .28 + Math.min(.34, (evs.length-1)*.14) +
                     (es.reduce(function(a,e){ return a+e.emotionalIntensity; },0)/es.length)*.30);
        n.confidence = Math.min(.9, .35 + evs.length*.14);
        n.need = nd;
        n.layers = {
          happened: (es.filter(function(e){ return e.outcome || e.situation; })[0]||es[0]).situation,
          expected: es.map(function(e){ return e.statedReason; }).filter(Boolean)[0] || F.expect,
          lacked:   F.lack,
          violated: (function(){
            var v={}; es.forEach(function(e){ (e.violatedNeeds||[]).forEach(function(x){ v[x]=1; }); });
            return Object.keys(v);
          })()
        };
        n.fitNote = '力が足りなかったという話ではなく、「'+nd+'」を必要とするあなたと、'+
                    F.envw+'を重く見る環境の、相性として置いています。';
        n.relatedValueIds = (function(){
          var vs={}; es.forEach(function(e){ (e.candidateValues||[]).forEach(function(v){ if(byId[v]) vs[v]=(vs[v]||0)+1; }); });
          return Object.keys(vs).sort(function(a,b){ return vs[b]-vs[a]; }).slice(0,2);
        })();
        n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(n.id)>0;
      });
    })();

    /* 願い（過去から続いているもの・Future Memo）*/
    order.forEach(function(id){
      var e = entries[id];
      if(!(e.isWish || e.isFuture)) return;
      var n = add(mk('wish','w:'+id, e.rawText,
        e.isFuture ? '未来へ置いた願い。いまの記録と線でつながっています。'
                   : '過去に書いた願い。いまの記録の中に、まだ現れています。', [id]));
      n.isFuture = !!e.isFuture; n.due = e.due; n.doneAt = e.doneAt;
      /* 過去の願いが、あとの記録に同じ価値観で現れ直していれば、その線をつなぐ */
      if(!n.isFuture && (e.candidateValues||[]).length){
        var echo = order.filter(function(oid){
          var o = entries[oid];
          if(oid===id || o.isWish) return false;
          return (o.candidateValues||[]).some(function(v){ return e.candidateValues.indexOf(v)>=0; });
        });
        if(echo.length >= 2){
          n.evidenceIds = [id].concat(echo.slice(0,4));
          n.summary = '過去の願いは消えたのではなく、仕事の余白や、心が緩んだ時間の中に繰り返し現れています。';
          n.echo = true;
        }
      }
      var st = stats(entries, n.evidenceIds); n.stat=st; n.tier = n.echo ? 'pattern' : 'seed';
      n.identity = (n.echo? .55 : .3) + identityScore(st,n)*.6;
      n.confidence = n.echo? .7 : .5;
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(n.id)>0;
    });

    /* 転機：選択のうち、主体性と感情が強いもの */
    order.forEach(function(id){
      var e = entries[id];
      if(!e.isChoice) return;
      var w = e.agency*.6 + e.emotionalIntensity*.4;
      if(w < .55) return;
      var n = add(mk('turningPoint','t:'+id, e.rawText, '方向を選び直した場面です。', [id]));
      var st=stats(entries,[id]); n.stat=st; n.tier='seed';
      n.identity = w; n.confidence=.7;
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt=st.minM; n.lastSeenAt=st.maxM; n.confirmed = fbGet(n.id)>0;
    });

    /* 章：年 → 月 → 週。記録のある期間はすべて作り、内訳の推移を持たせる。 */
    function trendOf(evs){
      var t={moved:0, effort:0, pain:0, n:evs.length, energy:0};
      evs.forEach(function(id){
        var e=entries[id]; if(!e) return;
        if(t[e.eventType]!==undefined) t[e.eventType]++;
        t.energy += (e.energyDelta||0);
      });
      t.energy = evs.length ? t.energy/evs.length : 0;
      return t;
    }
    function weekOf(iso){ return Math.min(5, Math.floor((+iso.slice(8,10)-1)/7)+1); }
    var periods={};
    order.forEach(function(id){
      var e=entries[id]; if(!e.occurredAt || e.isFuture) return;
      var y=e.occurredAt.slice(0,4), ym=e.occurredAt.slice(0,7);
      var wk=ym+'-W'+weekOf(e.occurredAt);
      (periods['y:'+y]  = periods['y:'+y]  || []).push(id);
      (periods['m:'+ym] = periods['m:'+ym] || []).push(id);
      (periods['w:'+wk] = periods['w:'+wk] || []).push(id);
    });
    Object.keys(periods).sort().forEach(function(pid){
      var evs=periods[pid], head=pid.charAt(0), key=pid.slice(2), label, level, first, last;
      if(head==='y'){ level='year';  label=(S.years[key]||{}).title || (key+'年'); first=key+'-01'; last=key+'-12'; }
      else if(head==='m'){ level='month'; label=(S.months[key]||{}).title || ((+key.slice(5,7))+'月'); first=last=key; }
      else { level='week'; label=(+key.slice(5,7))+'月 第'+key.slice(-1)+'週'; first=last=key.slice(0,7); }
      var t=trendOf(evs);
      var mix='心が動いた'+t.moved+'・力を使った'+t.effort+'・引っかかった'+t.pain;
      var n=add(mk('chapter', pid, label,
        (level==='year'? key+'年' : level==='month'? key+'の章' : key.slice(0,7)+' の週')+
