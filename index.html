        'に残った'+t.n+'件。'+mix+'。', evs));
      n.level=level; n.key=key; n.trend=t; n.ym = level==='month'? key : (level==='week'? key.slice(0,7) : null);
      n.year = level==='year'? key : key.slice(0,4);
      n.identity = level==='year'? .6 : level==='month'? .45 : .3;
      n.confidence=.9; n.tier = level==='week' ? 'pattern' : 'identity';
      n.firstSeenAt=first; n.lastSeenAt=last;
    });

    /* 根拠ノード */
    order.forEach(function(id){
      var e = entries[id];
      var n = add(mk('evidence','e:'+id, e.rawText, '', [id]));
      n.entry=e; n.identity = .2 + e.emotionalIntensity*.3; n.confidence=1; n.tier='seed';
      n.relatedValueIds = (e.candidateValues||[]).filter(function(v){ return byId[v]; }).slice(0,2);
      n.firstSeenAt = e.occurredAt ? e.occurredAt.slice(0,7) : null;
      n.lastSeenAt = n.firstSeenAt;
    });

    /* 「次に広げる」候補：上位タグが2つ以上一致したものだけ */
    var strongIds = nodes.filter(function(n){ return n.kind==='interest'||n.kind==='value'; })
      .sort(function(a,b){ return b.identity-a.identity; }).slice(0,5).map(function(n){ return n.id; });
    LEX.recos.forEach(function(r){
      var hit = r.tags.filter(function(t){ return strongIds.indexOf(t)>=0; });
      if(hit.length < 2) return;
      var evs=[]; hit.forEach(function(t){ (byId[t].evidenceIds||[]).slice(0,2).forEach(function(e){ if(evs.indexOf(e)<0) evs.push(e); }); });
      if(!evs.length) return;
      var n = add(mk('recommendation', r.id, r.label,
        hit.map(function(t){ return '「'+byId[t].label+'」'; }).join('と')+'の記録が重なっているので、ここを勧めています。', evs));
      n.identity=.35; n.confidence=.5; n.tier='seed'; n.relatedValueIds=hit.filter(function(t){ return byId[t].kind==='value'; });
    });

    /* 次に試せる小さな実験。
       一般的なキャリア助言ではなく、蓄積された本人の証拠から出す。
       いきなり「転職すべき」とは言わず、検証できる小ささに落とす。 */
    var topS = nodes.filter(function(n){ return n.kind==='strength'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    var gainC = nodes.filter(function(n){ return n.kind==='condition' && n.energy==='gain'; }).sort(function(a,b){ return b.identity-a.identity; });
    var topC = gainC[0];
    var topI = nodes.filter(function(n){ return n.kind==='interest'||n.kind==='aesthetic'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    var topW = nodes.filter(function(n){ return n.kind==='wish'; }).sort(function(a,b){ return b.identity-a.identity; })[0];
    if(topS){
      var evs2=[];
      [topS, topC, topI, topW].forEach(function(x){ if(x) (x.evidenceIds||[]).slice(0,2).forEach(function(e){ if(evs2.indexOf(e)<0) evs2.push(e); }); });
      /* 候補を4つ作り、適合度が最も高いものを1つだけ出す */
      var cands = [
        {t:'クリエイティブな案件を、ひとつだけ担当してみる',
         d:'いまの持ち場のなかで、'+(topI? '「'+topI.label+'」':'自分の感覚')+'を使える案件を1件だけ引き受けてみる。',
         small:1, newness:.5, needI:0},
        {t:'5人以下の小さなワークショップを1回だけ開く',
         d:'完成度ではなく、「'+topS.label+'」が実際に働くかを見るための1回。',
         small:.8, newness:.9, needI:.4},
        {t:'企画と場づくりを、ひとつにして試す',
         d:'考える役と場に立つ役を分けずに、小さく1本だけ通してみる。',
         small:.6, newness:.8, needI:.3},
        {t:'気になっている人と、1回だけ話す',
         d:'転職や結論のためではなく、'+(topW? '「'+topW.label.slice(0,14)+'」':'いまの願い')+'が言葉になるかを見るための1回。',
         small:1, newness:.7, needI:0}
      ];
      var best=null;
      cands.forEach(function(c){
        var sc = stepScore({
          strength: Math.min(1, topS.identity + (topS.tier==='identity'?.2:0)),
          wish:     topW ? Math.min(1, topW.identity+.3) : .2,
          energy:   topC ? Math.min(1, topC.identity+.35) : .2,
          small:    c.small,
          newness:  c.newness
        }) + (topI ? c.needI*topI.identity : -c.needI*.5);
        if(!best || sc>best.sc) best={c:c, sc:sc};
      });
      var n2 = add(mk('experiment','x_next', best.c.t,
        best.c.d + (topC ? ' 力が出やすいのは「'+topC.label+'」なので、その形に寄せます。' : '') +
        ' うまくいくかではなく、力が出るかを確かめる実験です。', evs2));
      n2.identity = Math.max(.35, Math.min(.9, best.sc));
      n2.confidence=.55; n2.tier='seed';
      n2.relatedValueIds = (topS.relatedValueIds||[]).slice(0,2);
      n2.firstSeenAt = topS.lastSeenAt; n2.lastSeenAt = topS.lastSeenAt;
      n2.confirmed = fbGet('x_next')>0;
    }

    self.summary = '';
    self.identity = 1; self.confidence = 1; self.tier='identity';

    var rels = relate(entries, order, byId);
    return {entries:entries, order:order, nodes:nodes, byId:byId, rels:rels};
  }

  /* ── つながりの種類 ──
     線は「関係がある」ではなく「どういう関係か」を持つ。
     つながらない記録は、つながらないまま置く。無理に結ばない。 */
  function relate(entries, order, byId){
    /* 日付のない記録も外さない。「小さい頃」は、いちばん古い出来事として置く。 */
    function when(e){
      if(e.occurredAt) return e.occurredAt;
      return /小さい頃|子どもの頃|昔|幼い/.test(e.rawText||'') ? '1990-01-01' : todayISO();
    }
    var ids = order.filter(function(id){ return !!entries[id]; })
                   .sort(function(a,b){ return when(entries[a]) < when(entries[b]) ? -1 : 1; });
    var out = [], deg = {};
    function days(a,b){ return Math.abs((new Date(b)-new Date(a))/86400000); }
    function gapJA(d){
      if(d >= 365*3) return 'ずいぶん長い時間を';
      if(d >= 300)   return Math.round(d/365*10)/10+'年';
      if(d >= 60)    return Math.round(d/30)+'か月';
      return Math.round(d/7)+'週';
    }
    function shared(x,y){
      var mx = x.themes || x.motifs || [], my = y.themes || y.motifs || [];
      return mx.filter(function(m){ return my.indexOf(m)>=0; });
    }
    function push(kind, a, b, why, w){
      if(deg[a]>=REL_MAX || deg[b]>=REL_MAX) return;
      out.push({kind:kind, a:a, b:b, why:why, w:w||.5});
      deg[a]=(deg[a]||0)+1; deg[b]=(deg[b]||0)+1;
    }
    var cand = [];
    for(var i=0;i<ids.length;i++){
      for(var j=i+1;j<ids.length;j++){
        var A=entries[ids[i]], B=entries[ids[j]];
        var sh = shared(A,B); if(!sh.length) continue;
        var gap = days(when(A), when(B));
        var word = sh[0];
        /* 伏線：先に願いとして書かれ、あとで実際に起きている */
        if((!A.occurredAt || A.eventType==='wish' || A.isWish) && gap>=60)
          cand.push({kind:'foreshadow', a:ids[i], b:ids[j], w:.62+Math.min(.3,gap/900),
            why:'「'+word+'」が、'+(A.occurredAt?'先に願いとして書かれ':'ずっと前から書かれていて')+
                '、あとの出来事にも出てきています。'});
        /* 領域をまたぐ：同じものが仕事と暮らしの両方に出ている */
        else if(A.domain!==B.domain && A.domain!=='life' && B.domain!=='life')
          cand.push({kind:'cross_domain', a:ids[i], b:ids[j], w:.6,
            why:'「'+word+'」が、'+DOMJA(A.domain)+'と'+DOMJA(B.domain)+'の両方に出ています。'});
        /* 反転：同じものへの感じ方が、逆に変わっている */
        else if(A.energy && B.energy && A.energy!==B.energy && A.energy!=='flat' && B.energy!=='flat')
          cand.push({kind:'reversal', a:ids[i], b:ids[j], w:.55,
            why:'「'+word+'」への感じ方が、'+(A.energy==='gain'?'力が出る':'消耗する')+'から'+
                (B.energy==='gain'?'力が出る':'消耗する')+'へ変わっています。'});
        /* 繰り返し：時間をあけて、同じものが何度も現れている */
        else if(gap>=21)
          cand.push({kind:'recurrence', a:ids[i], b:ids[j], w:.5+Math.min(.3,gap/600),
            why:'「'+word+'」が、'+gapJA(gap)+'あけてまた現れています。'});
      }
    }
    /* ゆれ：同じ時期に、逆向きの気持ちが同時に出ている */
    for(var k=0;k<ids.length;k++){
      for(var m=k+1;m<ids.length;m++){
        var X=entries[ids[k]], Y=entries[ids[m]];
        if(days(when(X),when(Y))>45) continue;
        var conf = (X.satisfiedNeeds||[]).filter(function(nd){ return (Y.violatedNeeds||[]).indexOf(nd)>=0; });
        if(!conf.length) continue;
        cand.push({kind:'tension', a:ids[k], b:ids[m], w:.6,
          why:'同じころに、「'+conf[0]+'」が満たされた記録と、そうでなかった記録の両方があります。'});
      }
    }
    cand.sort(function(x,y){ return y.w-x.w; });
    cand.forEach(function(c){ push(c.kind, c.a, c.b, c.why, c.w); });
    /* 孤児：どこにもつながらなかった記録。つながらないことも情報として残す */
    ids.forEach(function(id){
      if(!deg[id]) out.push({kind:'orphan', a:id, b:null, w:.2,
        why:'いまはまだ、ほかの記録とつながっていません。無理につなげずに置いています。'});
    });
    return out;
  }
  return {build:build, stats:stats, relate:relate};
})();

/* ── ビューごとの選抜とスコア ── */
/* プライベート＝価値観／美意識／惹かれるもの／葛藤
   キャリア＝強み／力の出る条件／モヤモヤ／願う働き方／次の実験
   全て＝それらがいつ、どの経験から生まれたか */
function viewFit(n, mode){
  if(mode==='likes')  return ({value:1, aesthetic:.98, interest:.92, tension:.85, wish:.6, recommendation:.7,
                               evidence:.3, self:1, strength:.2, condition:.2, friction:.25, turningPoint:.35, chapter:.15, experiment:.3})[n.kind]||.2;
  if(mode==='career') return ({strength:1, condition:.95, friction:.92, experiment:.88, wish:.6, value:.62,
                               tension:.5, turningPoint:.6, evidence:.3, self:1, interest:.2, aesthetic:.2, chapter:.15, recommendation:.2})[n.kind]||.2;
  return ({chapter:1, turningPoint:.95, value:.8, wish:.7, tension:.6, friction:.55, evidence:.5, self:1,
           interest:.4, aesthetic:.45, strength:.4, condition:.35, recommendation:.2, experiment:.45})[n.kind]||.2;
}
function currentness(n){
  if(!n.lastSeenAt) return .4;
  var m = monthsBetween(n.lastSeenAt.slice(0,7), todayISO().slice(0,7));
  return Math.max(0, 1 - Math.abs(m)/14);
}
function displayScore(n, mode){
  var W = MAPC.DISPLAY_W;
  var bridge = Math.min(1, (n.relatedValueIds||[]).length/2);
  var ev = Math.min(1, (n.evidenceIds||[]).length/3);
  var base = W.identity*(n.identity||0) + W.viewFit*viewFit(n,mode) + W.current*currentness(n) +
             W.bridge*bridge + W.evidence*ev;
  var h = hypGet(n.id);
  if(h && h.v==='me')     base = Math.min(1, base*1.25 + .08);
  if(h && h.v==='off')    base = base*0.45;
  if(h && h.v==='unsure') base = base*0.85;
  /* 強みは、日付の違う2件以上の記録がないと上位に置かない。
     一度うまくいっただけのことを「あなたの強み」と言い切らないため。 */
  if(n.kind==='strength'){
    var sd = (n.stat && n.stat.days) || (n.evidenceIds||[]).length;
    if(sd < 2) base = base*0.5;
  }
  return base;
}

/* ══════════════════════════════════════════════════
   9. MAP：決定論的レイアウト＋宇宙の描画
   ══════════════════════════════════════════════════ */
var Map3 = (function(){
  var stage, cv, ctx, layer, W=0, H=0, dpr=1;
  var G=null, view=null, cam={x:0,y:0,z:1,base:0,v:1}, sel=null, chip=null, raf=0, iraf=0, intro=0, built=false;
  var lvl=0;   /* 0=年 1=月 2=週 3=出来事 */
  var opened={};   /* ひらいている中項目。最初はどれもたたまれている */
  var carded=false;  /* いま詳細カードを出しているか */
  var nodeDrag=null;
  var stars=[], nebula=[];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 星と星雲は一度だけ決定論的に作る ---- */
  function seedSky(){
    stars=[]; nebula=[];
    for(var i=0;i<46;i++){                        /* 数を絞り、静かな夜空にする */
      var a=hash01('s'+i), b=hash01('t'+i), c=hash01('u'+i);
      stars.push({x:(a-.5)*1900, y:(b-.5)*1900, r:.35+c*.75, o:.10+c*.26});
    }
    for(var j=0;j<2;j++){
      nebula.push({x:(hash01('n'+j)-.5)*900, y:(hash01('m'+j)-.5)*900,
                   r:340+hash01('r'+j)*220, h:['#141A38','#17203C'][j]});
    }
  }

  /* ---- レイアウト（m-note と同じ、自分を根にした放射ツリー）----
     すべてのノードは必ず親を持ち、たどると「自分」に着く。
     角度を再帰的に分け合うので、点が重なりにくい。 */
  /* ---- レイアウト ----------------------------------------------
     1. place() が親から子へ、角度と広がりと深さごとの半径で放射状に置く
     2. step() が毎フレーム、斥力・ばね・中心への重力・減衰で解いていく
     星は動かしたときだけ動き、静まったら止まる
     枝の自然長はどの深さでも同じなので、距離は変わらず形だけが有機的に動く。 */
  var RAD  = [0, 94, 188, 282, 376, 470];        /* 深さごとの半径。間隔は一定 */
  var LINK = 94;
  var SIMC = {
    DT      : 0.085,   /* 一歩の大きさ。小さいほどゆっくり動く */
    BURST0  : 48,      /* 開いた直後だけ、計算を強めて一気に落ち着かせる */
    repel   : 780,     /* 斥力 f = repel·qa·qb / d² */
    repelCut: 300,     /* これ以上離れていたら押し合わない */
    repelMax: 30,      /* 斥力の上限。近すぎる星が弾け飛ばないように */
    kTree   : 0.055,   /* 幹のばね */
    kPost   : 0.045,   /* 根拠へのばね */
    kOther  : 0.014,   /* ゆるい参照のばね */
    spreadL : 1.0,     /* 自然長の倍率 */
    grav    : 0.009,   /* 中心へ引き戻す弱い重力 */
    damp    : 0.88,    /* 1コマごとの減衰。小さいほど早く静まる */
    vmax    : 16,      /* 速さの上限。これで「暴れる」ことがなくなる */
    spin    : 0.0006,  /* 初期配置のときだけ、親のまわりを子がわずかに回る */
    carry   : 0.45,    /* 中心を動かしたとき、まわりが遅れて付いてくる度合い */
    stop    : 1.2,     /* 速度がこれ以下（1コマ0.1px弱）になったら、きっぱり止める */
    cool    : 0.965,   /* 1コマごとの冷めかた。だんだん遅くなり、必ず止まる */
    cold    : 0.03,    /* ここまで冷めたら終わり */
    settle  : 420      /* 初期化のとき、内部で回す回数 */
  };
  var sim = {list:[], links:[], root:null, burst:0, quiet:0, alpha:0, drag:null, held:null, moving:false};

  function simBuild(list, byId, tree, edges){
    var ls = [];
    /* 幹：親から子へ。ここが形の芯 */
    Object.keys(tree.parentOf).forEach(function(cid){
      var p = byId[tree.parentOf[cid]], c = byId[cid];
      if(p && c) ls.push({a:p, b:c, k:SIMC.kTree, len:LINK});
    });
    /* 参照：根拠へは少し強く、価値観へはごくゆるく */
    (edges||[]).forEach(function(e){
      if(e.trunk || !e.a || !e.b) return;
      var post = (e.b.kind==='evidence' || e.a.kind==='evidence');
      ls.push({a:e.a, b:e.b, k: post ? SIMC.kPost : SIMC.kOther, len: post ? LINK*0.9 : LINK*1.6});
    });
    sim.links = ls; sim.list = list; sim.root = byId['self'] || null;
    list.forEach(function(n){
      n.vx = 0; n.vy = 0;
      n.q  = 0.7 + Math.min(1, n.display||0)*1.3;   /* 大きい星ほど強く押す */
    });
    sim.burst = SIMC.BURST0; sim.quiet = 0; sim.drag = null; sim.held = null; sim.moving = false;
  }

  function step(dt, spin){
    var L = sim.list, n = L.length, i, j, a, b, dx, dy, d2, d, f, ux, uy;
    var cx = sim.root ? sim.root.x : 0, cy = sim.root ? sim.root.y : 0;
    var cut2 = SIMC.repelCut*SIMC.repelCut;

    /* 斥力：総当たり。近いほど強く押し合う */
    for(i=0;i<n;i++){
      a = L[i];
      for(j=i+1;j<n;j++){
        b = L[j];
        dx = b.x-a.x; dy = b.y-a.y;
        d2 = dx*dx+dy*dy;
        if(d2 >= cut2) continue;
        if(d2 < 1){ dx = hash01(a.id+b.id)-.5; dy = hash01(b.id+a.id)-.5; d2 = dx*dx+dy*dy || 1; }
        d = Math.sqrt(d2);
        f = Math.min(SIMC.repelMax, SIMC.repel * a.q * b.q / d2);
        ux = dx/d; uy = dy/d;
        a.vx -= ux*f; a.vy -= uy*f;
        b.vx += ux*f; b.vy += uy*f;
      }
    }
    /* ばね：自然長へ引き戻す。枝の長さが変わらないのはここ */
    for(i=0;i<sim.links.length;i++){
      var e = sim.links[i];
      a = e.a; b = e.b;
      dx = b.x-a.x; dy = b.y-a.y;
      d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      f = (d - e.len*SIMC.spreadL) * e.k;
      ux = dx/d; uy = dy/d;
      a.vx += ux*f; a.vy += uy*f;
      b.vx -= ux*f; b.vy -= uy*f;
      /* 初期配置のときだけ、子を親のまわりにわずかに回す。
         形に自然な偏りが出る。操作中は切る（回り続けると動きが止まらない）。 */
      if(spin && e.k===SIMC.kTree){
        b.vx += -uy*spin*d; b.vy += ux*spin*d;
      }
    }
    /* 中心への弱い重力。中心そのものは動かさない */
    var damp = SIMC.damp, maxv = 0;
    for(i=0;i<n;i++){
      a = L[i];
      if(a === sim.root || (sim.drag && sim.drag === a.id)){ a.vx = 0; a.vy = 0; continue; }
      a.vx += (cx - a.x)*SIMC.grav;
      a.vy += (cy - a.y)*SIMC.grav;
      a.vx *= damp; a.vy *= damp;
      var sp = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
      if(sp > SIMC.vmax){ a.vx *= SIMC.vmax/sp; a.vy *= SIMC.vmax/sp; sp = SIMC.vmax; }
      a.x += a.vx*dt; a.y += a.vy*dt;
      if(sp > maxv) maxv = sp;
    }
    return maxv;
  }

  function simSettle(){                            /* 初期形を、決まった回数だけ解く */
    for(var t=0; t<SIMC.settle; t++) step(SIMC.DT * (t < SIMC.BURST0 ? 2.2 : 1), t < SIMC.settle*0.6 ? SIMC.spin : 0);
    sim.burst = 0; sim.quiet = 99;
  }
  /* ひらいた小項目が、親のところから弧を描いて出てくる */
  function stepFlight(){
    var F = sim.flight; if(!F) return false;
    var t = Math.min(1, (performance.now()-F.t0)/F.dur);
    var k = 1 - Math.pow(1-t, 3);                  /* ease-out cubic */
    F.items.forEach(function(it){
      it.n.x = it.fx + (it.tx-it.fx)*k;
      it.n.y = it.fy + (it.ty-it.fy)*k;
      it.n.vx = 0; it.n.vy = 0;
    });
    if(t>=1){ sim.flight = null; return false; }
    return true;
  }
  function simWake(){                              /* 動きだす。触った瞬間ではなく、動かしたときだけ */
    if(view && view.mode==='all'){ draw(); syncDom(); return; }  /* 星図は動かさない */
    sim.quiet = 0; sim.alpha = 1;                  /* 動かすたびに、また少し熱を持つ */
    if(!raf) raf = requestAnimationFrame(simStep);
  }
  function simStep(){
    raf = 0;
    if(!view || S.view!=='map'){ sim.quiet = 99; return; }
    if(sim.burst>0) sim.burst--;
    var flying = stepFlight();
    /* 冷めるほど一歩が小さくなる。揺れ続けることがなく、動きも穏やかになる */
    if(!sim.drag) sim.alpha *= SIMC.cool;
    var v = step(SIMC.DT * Math.max(sim.alpha, 0.15), 0);
    var done = !sim.drag && !flying && (v < SIMC.stop || sim.alpha < SIMC.cold);
    if(done){ sim.list.forEach(function(m){ m.vx = 0; m.vy = 0; }); sim.alpha = 0; }
    draw(); syncDom();
    if(!done) raf = requestAnimationFrame(simStep);
    else sim.quiet = 99;
  }

  /* ---- 「全て」の配置：時系列の星図 ------------------------------------
     中心が現在の自分。外へ行くほど過去。
     日付を古い順に正規化して半径を決め、角度は時系列順と黄金角で配る。
     同じ月は近い角度にまとめ、Future Memo は中心から未来へ伸びる別軌道に置く。
     毎回まったく同じ位置になる。揺れる力学計算は使わない。 */
  var GOLD = Math.PI * (3 - Math.sqrt(5));       /* 黄金角 ≒ 137.5° */
  var SPIRAL = { rMin: 70, rMax: 430, monthSpan: 0.42, comet: [96, 150, 204] };

  function layoutTimeline(list, tree){
    var self = null, dated = [], future = [], undated = [], marks = [];
    list.forEach(function(n){
      if(n.id==='self'){ self = n; return; }
      if(n.isFuture || (n.entry && n.entry.source==='future_memo')){ future.push(n); return; }
      if(n.kind==='chapter'){ marks.push(n); return; }   /* 章は、その期間の目印として後で置く */
      var t = n.lastSeenAt || n.firstSeenAt || (n.entry && n.entry.occurredAt) || null;
      if(t) { n._t = t; dated.push(n); } else undated.push(n);
    });
    if(self){ self.x = 0; self.y = 0; self.depth = 0; }

    /* 古い順に並べ、順位で半径を決める。古いほど外側。 */
    dated.sort(function(a,b){ return a._t < b._t ? -1 : a._t > b._t ? 1 : (a.id<b.id?-1:1); });
    var n = dated.length;
    /* 月ごとの塊をつくる。同じ月は角度が近くなる。 */
    var months = [], seen = {};
    dated.forEach(function(d){ var m = d._t.slice(0,7); if(!seen[m]){ seen[m]=1; months.push(m); } });
    months.sort();                                  /* 古い月が先 */
    var mIndex = {}; months.forEach(function(m,i){ mIndex[m] = i; });

    dated.forEach(function(d, i){
      var m = d._t.slice(0,7);
      /* 半径：古いほど外。順位を使うので、記録の密度が偏っても均等に散る */
      var k = n<=1 ? 0 : (n-1-i)/(n-1);            /* 0=最新 → 1=最古 */
      var r = SPIRAL.rMin + Math.pow(k, 0.82) * (SPIRAL.rMax - SPIRAL.rMin);
      /* 角度：月ごとの基準角（黄金角）＋ 月内での小さなずらし */
      var base = mIndex[m] * GOLD;
      var within = 0, cnt = 0;
      dated.forEach(function(o){ if(o._t.slice(0,7)===m){ if(o===d) within = cnt; cnt++; } });
      var off = cnt<=1 ? 0 : (within/(cnt-1) - .5) * SPIRAL.monthSpan;
      var ang = base + off;
      d.x = Math.cos(ang)*r; d.y = Math.sin(ang)*r;
      d.depth = 1 + Math.round(k*3);
      d.ring = k;
    });

    /* 章（年・月・週）は、その期間の記録たちの重心のすこし外に置く。時間の見出しになる。 */
    marks.forEach(function(mk){
      var key = mk.key || '';
      var mine = dated.filter(function(d){ return key && d._t.indexOf(key.slice(0,7))===0; });
      if(!mine.length) mine = dated.filter(function(d){ return key && d._t.indexOf(key.slice(0,4))===0; });
      if(!mine.length){ mk.x = 0; mk.y = -SPIRAL.rMin*0.6; mk.depth = 1; return; }
      var ax=0, ay=0;
      mine.forEach(function(d){ ax += d.x; ay += d.y; });
      ax/=mine.length; ay/=mine.length;
      var len = Math.sqrt(ax*ax+ay*ay) || 1;
      mk.x = ax/len * (len + 40); mk.y = ay/len * (len + 40);
      mk.depth = 1;
    });

    /* Future Memo は、中心から未来へ伸びる別の軌道に。彗星として上向きに置く。 */
    future.sort(function(a,b){ return (a.due||'9999') < (b.due||'9999') ? -1 : 1; });
    future.forEach(function(f, i){
      var ang = -Math.PI/2 + (i - (future.length-1)/2) * 0.34;   /* 上方向へ扇形に */
      var r = SPIRAL.comet[Math.min(i, SPIRAL.comet.length-1)];
      f.x = Math.cos(ang)*r; f.y = Math.sin(ang)*r;
      f.depth = 1; f.comet = ang;
    });

    /* 日付のない記録は、外周のいちばん外側へ静かに置く */
    undated.forEach(function(u, i){
      var ang = GOLD * (months.length + i + 1);
      u.x = Math.cos(ang)*(SPIRAL.rMax+34); u.y = Math.sin(ang)*(SPIRAL.rMax+34);
      u.depth = 4; u.ring = 1;
    });
  }

  function layout(mode, list, tree){
    var byId={}; list.forEach(function(n){ byId[n.id]=n; n.depth=0; });
    if(mode==='all'){ layoutTimeline(list, tree); return; }   /* 「全て」は時系列の星図 */
    var kids = tree.kids, cnt = {};
    (function count(id){                          /* 枝の重さ＝ぶら下がる葉の数 */
      var ks = kids[id]||[];
      if(!ks.length){ cnt[id]=1; return 1; }
      var t=0; ks.forEach(function(c){ t += count(c); });
      cnt[id]=t; return t;
    })('self');
    (function place(id, ang, from, to, depth){
      var n = byId[id]; if(!n) return;
      var r = RAD[Math.min(depth, RAD.length-1)];
      n.x = Math.cos(ang)*r; n.y = Math.sin(ang)*r; n.depth = depth;
      var ks = kids[id] || []; if(!ks.length) return;
      var total = 0; ks.forEach(function(c){ total += (cnt[c]||1); });
      var acc = from;
      ks.forEach(function(c){
        var spread = (to-from) * ((cnt[c]||1)/total);
        place(c, acc + spread/2, acc, acc+spread, depth+1);
        acc += spread;
      });
    })('self', 0, -Math.PI/2 - Math.PI, -Math.PI/2 + Math.PI, 0);
    list.forEach(function(n){
      if(n.id!=='self' && n.x===undefined){
        var an = hash01(n.id)*Math.PI*2;
        n.x=Math.cos(an)*430; n.y=Math.sin(an)*430; n.depth=3;
      }
    });
  }

  /* ---- 親子関係をつくる：ここで「全部が自分につながる」ことを保証する ---- */
  function buildTree(pool, byId, mode){
    var parentOf={}, kids={};
    function setP(c, p){
      if(!c || !p || c===p || parentOf[c.id]) return;
      parentOf[c.id]=p.id; (kids[p.id]=kids[p.id]||[]).push(c.id);
    }
    var self = byId['self'];
    var years  = pool.filter(function(n){ return n.kind==='chapter' && n.level==='year'; });
    var months = pool.filter(function(n){ return n.kind==='chapter' && n.level==='month'; });
    years.sort(function(a,b){ return a.key<b.key?-1:1; });
    years.forEach(function(y){ setP(y, self); });
    var weeks = pool.filter(function(n){ return n.kind==='chapter' && n.level==='week'; });
    months.sort(function(a,b){ return a.key<b.key?-1:1; });
    months.forEach(function(m){
      var y = years.filter(function(y2){ return y2.key===m.key.slice(0,4); })[0];
      setP(m, y || self);
    });
    weeks.sort(function(a,b){ return a.key<b.key?-1:1; });
    weeks.forEach(function(w){
      var m = months.filter(function(x){ return x.key===w.key.slice(0,7); })[0];
      setP(w, m || self);
    });
    var values = pool.filter(function(n){ return n.kind==='value'; })
                     .sort(function(a,b){ return b.display-a.display; });
    values.forEach(function(v){ setP(v, self); });
    function hostValue(n){
      var v = (n.relatedValueIds||[]).map(function(id){ return byId[id]; }).filter(Boolean)[0];
      return v || self;
    }
    /* プライベート／キャリアでは、仕様の大きな星座（価値観・美意識・惹かれるもの・葛藤／
       強み・条件・モヤモヤ・願い・次の一歩）がすべて第一階層に並ぶようにする。
       第二階層は、その根拠になった出来事。 */
    var flat = (mode!=='all');
    ['aesthetic','interest','strength','condition','friction','tension','experiment','recommendation','wish']
      .forEach(function(k){
        pool.filter(function(n){ return n.kind===k; })
            .sort(function(a,b){ return b.display-a.display; })
            .forEach(function(n){ setP(n, flat ? self : hostValue(n)); });
      });
    pool.filter(function(n){ return n.kind==='turningPoint'; })
        .sort(function(a,b){ return (a.firstSeenAt||'')<(b.firstSeenAt||'')?-1:1; })
        .forEach(function(n){
          var m = n.firstSeenAt ? months.filter(function(x){ return x.key===n.firstSeenAt; })[0] : null;
          setP(n, m || hostValue(n));
        });
    /* 根拠は、それを支えている星の下へ。無ければその月の章の下へ。 */
    var owners = pool.filter(function(n){ return n.kind!=='evidence' && n.kind!=='self' && n.kind!=='chapter'; })
                     .sort(function(a,b){ return b.display-a.display; });
    pool.filter(function(n){ return n.kind==='evidence'; }).forEach(function(e){
      var raw = e.id.slice(2);
      var own = null;
      if(mode==='all'){                                   /* 時系列ビューでは週の下へ */
        own = weeks.filter(function(w){ return (w.evidenceIds||[]).indexOf(raw)>=0; })[0]
           || months.filter(function(x){ return (x.evidenceIds||[]).indexOf(raw)>=0; })[0];
      }
      if(!own) own = owners.filter(function(o){ return (o.evidenceIds||[]).indexOf(raw)>=0; })[0];
      setP(e, own || self);
    });
    pool.forEach(function(n){ if(n.id!=='self') setP(n, self); });   /* 取りこぼしも必ず自分へ */
    return {parentOf:parentOf, kids:kids};
  }

  /* ---- ビューの組み立て ---- */
  function compose(mode){
    if(!G){
      G = Insight.build();
      /* 本人が言い換えた仮説は、本人の言葉で表示する。生成元の言葉は残す。 */
      G.nodes.forEach(function(n){
        var h = hypGet(n.id);
        if(h && h.v==='reword' && h.text){ n.autoLabel = n.autoLabel || n.label; n.label = h.text; }
      });
    }
    /* lvl 0=年 1=月 2=週 3=出来事。ピンチで一段ずつ深くなる */
    var pool = G.nodes.filter(function(n){
      /* 本人が「この仮説を削除する」と答えたものは地図から外す。
         元の記録は消さない。 */
      if(hypDropped(n.id)) return false;
      if(mode==='likes')  return ['self','value','aesthetic','interest','wish','recommendation','tension','experiment','evidence'].indexOf(n.kind)>=0;
      if(mode==='career') return ['self','value','strength','condition','friction','tension','wish','turningPoint','experiment','evidence'].indexOf(n.kind)>=0;
      /* 「全て」は記録を時間で見るビュー。仮説はプライベートとキャリアに置く。 */
      if(['self','chapter','turningPoint','wish','evidence'].indexOf(n.kind)<0) return false;
      if(n.kind==='chapter'){
        if(n.level==='year')  return true;
        if(n.level==='month') return lvl >= 1;
        return lvl >= 2;                                   /* 週 */
      }
      /* 出来事は小項目。全てビューではピンチの深さで、
         プライベート／キャリアでは中項目を押したときにひらく。
         ただし領域の確からしさが低い記録は、どちらかに決めつけず「全て」だけに残す。 */
      if(n.kind==='evidence'){
        if(mode==='all') return true;      /* 星図では記録そのものが星 */
        var e = n.entry;
        if(e && e.domainConfidence < MAPC.DOMAIN_MIN && !e.bridged) return false;
        return true;
      }
      return true;
    });
    pool.forEach(function(n){ n.display = displayScore(n, mode); });

    /* 最初は中項目だけを枝として出す。押された中項目の下だけ、小項目がひらく。
       いきなり全部を出すと、どこが幹でどこが枝葉か読めなくなるため。 */
    (function fold(){
      if(mode==='all'){ pool.forEach(function(n){ n.hidden = 0; }); return; }
      var by0={}; pool.forEach(function(n){ by0[n.id]=n; });
      var t0 = buildTree(pool, by0, mode);
      var show = {self:1}, mid = {}, sub = {};
      /* 中項目＝自分から直接のびる枝。ここまでは常に見せる */
      (t0.kids['self']||[]).forEach(function(id){ show[id]=1; mid[id]=1; });
      /* ひらいた枝の下だけ、小項目をたどって見せる。
         ただし年→月→週の連なりはピンチが決めるので、たたまない。 */
      (function walk(x){
        (t0.kids[x]||[]).forEach(function(c){
          var period = by0[c] && by0[c].kind==='chapter';
          if(!opened[x] && !period && x!=='self') return;
          if(x!=='self'){ show[c]=1; if(!period) sub[c]=1; }
          if(opened[c] || period) walk(c);
        });
      })('self');
      /* たたまれている枝には、いくつ隠れているかを持たせる（点線の印を出すため）*/
      pool.forEach(function(n){
        var ks = t0.kids[n.id]||[];
        n.hidden = show[n.id] ? ks.filter(function(c){ return !show[c]; }).length : 0;
      });
      pool = pool.filter(function(n){ return show[n.id]; });

      /* 中項目そのものも絞る。全部を第一階層に並べると、
         どれが今の自分の話なのか読めなくなるため。
         同じ種類は上位3つまで。そのうえで全体をMIDCAPで抑える。 */
      if(mode!=='all'){
        var MIDCAP = 13, PERKIND = 3;
        var mids = pool.filter(function(n){ return mid[n.id] && n.kind!=='chapter'; })
                       .sort(function(x,y){ return y.display-x.display; });
        var perk = {}, midKeep = {}, midRest = [];
        mids.forEach(function(n){
          perk[n.kind] = (perk[n.kind]||0) + 1;
          if(perk[n.kind] <= PERKIND) midKeep[n.id]=1; else midRest.push(n);
        });
        var room = MIDCAP - Object.keys(midKeep).length;
        midRest.slice(0, Math.max(0, room)).forEach(function(n){ midKeep[n.id]=1; });
        /* ひらいている枝は、たとえ順位が下でも閉じない */
        mids.forEach(function(n){ if(opened[n.id]) midKeep[n.id]=1; });
        mids.forEach(function(n){ if(!midKeep[n.id]) delete mid[n.id]; });
        pool = pool.filter(function(n){
          return n.id==='self' || n.kind==='chapter' || mid[n.id] || sub[n.id];
        });
        /* 落とした中項目のぶん、隠れている数を自分の星に持たせ直す */
        by0['self'] && (by0['self'].hidden = Math.max(0, (t0.kids['self']||[]).length - Object.keys(mid).length));
      }

      /* 一度に出す星の数を抑える。読めなくなるのを防ぐ。
         中項目と、いまひらいている小項目は削らない。 */
      var CAPN = (mode==='all' ? [22,26,32,999][lvl] : 30) + Object.keys(sub).length;
      var keep = {}, rest = [];
      pool.forEach(function(n){
        if(n.kind==='self' || n.kind==='chapter' || mid[n.id] || sub[n.id]) keep[n.id]=1;
        else rest.push(n);
      });
      rest.sort(function(x,y){ return y.display-x.display; });
      rest.slice(0, Math.max(0, CAPN - Object.keys(keep).length)).forEach(function(n){ keep[n.id]=1; });
      /* 残す星が参照している価値観は、線が切れないよう一緒に残す */
      pool.forEach(function(n){
        if(!keep[n.id]) return;
        (n.relatedValueIds||[]).forEach(function(v){ keep[v]=1; });
      });
      pool = pool.filter(function(n){ return keep[n.id]; });
    })();

    var byIdAll={}; pool.forEach(function(n){ byIdAll[n.id]=n; });
    var ranked = pool.slice().sort(function(a,b){ return b.display-a.display; });
    /* ラベルを出す顔ぶれ：ビューの主役を必ず1つずつ確保し、同じ種類が偏らないようにする */
    /* そのMapの主役は必ず1つずつ名前を出す。
       プライベート＝価値観・美意識・惹かれるもの・葛藤／
       キャリア＝強み・力の出る条件・モヤモヤ・願い・次の実験 */
    var must = mode==='likes'  ? ['value','aesthetic','interest','tension','wish']
             : mode==='career'? ['strength','condition','friction','experiment','wish']
                              : ['chapter','turningPoint','value','tension','wish'];
    var CAP = {tension:2, friction:2, aesthetic:2, interest:2, turningPoint:2, wish:2,
               condition:2, chapter:2, recommendation:1, experiment:1};
    var labeled=[], used={}, seenK={};
    function take(n){
      if(!n || used[n.id] || n.kind==='evidence') return false;
      var c = seenK[n.kind]||0;
      if(CAP[n.kind] && c >= CAP[n.kind]) return false;
      if(labeled.length >= MAPC.MAX_LABELED) return false;
      used[n.id]=1; seenK[n.kind]=c+1; labeled.push(n); return true;
    }
    take(byIdAll['self']);
    must.forEach(function(k){
      var top = ranked.filter(function(n){ return n.kind===k; })[0];
      if(top) take(top);
    });
    ranked.forEach(take);
    var labelSet = {}; labeled.forEach(function(n){ labelSet[n.id]=1; });

    /* 線をつくる。幹（自分へ戻る道）は常に描き、枝葉の参照線は選択時だけ出す。 */
    var byId = byIdAll;
    var tree = buildTree(pool, byId, mode);
    var edges=[], primary=[], seen={};
    function link(a,b,w,dashed,why,trunk){
      if(!a||!b||a===b) return;
      var k=a.id+'|'+b.id; if(seen[k]) return; seen[k]=1;
      var e={a:a,b:b,w:w,dashed:dashed,why:why||'',trunk:!!trunk};
      edges.push(e); if(trunk) primary.push(e);
    }
    Object.keys(tree.parentOf).forEach(function(cid){
      var c=byId[cid], p=byId[tree.parentOf[cid]];
      link(p, c, c && c.confidence!=null ? c.confidence : .6,
           !!(c && stageOf(c)==='seed'),
           'ここから伸びています', true);
    });
    pool.forEach(function(n){
      if(n.kind==='self'||n.kind==='value'||n.kind==='evidence') return;
      (n.relatedValueIds||[]).slice(0,2).forEach(function(vid){
        link(byId[vid], n, .5, true, '同じ価値観に根がある', false);
      });
      (n.evidenceIds||[]).slice(0,4).forEach(function(eid){
        link(n, byId['e:'+eid], .4, true, 'この出来事が根拠', false);
      });
    });
    /* 記録どうしの関係。種類ごとに色と説明を持たせる。
       つながらなかった記録（孤児）は、線を引かずに印だけ付ける。 */
    var orphans = {};
    (G.rels||[]).forEach(function(r){
      if(r.kind==='orphan'){ var o=byId['e:'+r.a]; if(o){ o.orphan=1; o.orphanWhy=r.why; } orphans[r.a]=1; return; }
      var A=byId['e:'+r.a], B=byId['e:'+r.b];
      if(!A||!B) return;
      var e0 = {a:A,b:B,w:r.w,dashed:true,why:r.why,trunk:false,rel:r.kind};
      var k0 = A.id+'|'+B.id; if(seen[k0]) return; seen[k0]=1;
      edges.push(e0);
    });

    /* 幹ごとに色を配り、子孫へ受け継ぐ。色をたどれば枝がわかる。 */
    var BRANCH = ['#D8B56A','#E58A8A','#9587DE','#6D9BC3','#5FA9A0','#C76F87','#68CBC4','#B9A3D8','#8FB98F'];
    (function paint(){
      var tops = tree.kids['self'] || [];
      tops.forEach(function(id,i){
        var c = BRANCH[i % BRANCH.length];
        (function walk(x){ var n=byId[x]; if(!n) return; n.branch=c; (tree.kids[x]||[]).forEach(walk); })(id);
      });
      if(byId['self']) byId['self'].branch = '#F3E6C8';
    })();

    layout(mode, pool, tree);
    if(mode==='all'){
      /* 時系列の星図は、日付から位置が決まる。毎回まったく同じ場所に出す。
         力学計算は使わないので、揺れもドリフトもない。 */
      sim.list = pool; sim.links = []; sim.root = byIdAll['self'] || null;
      pool.forEach(function(n){ n.vx=0; n.vy=0; });
      sim.alpha = 0; sim.drag = null;
    } else {
      simBuild(pool, byIdAll, tree, edges);
      simSettle();                                         /* 力で解いて、有機的な形に落ち着かせる */
    }
    return {mode:mode, nodes:pool, byId:byId, edges:edges, primary:primary, labelSet:labelSet, tree:tree,
            ranked:ranked, values: ranked.filter(function(n){ return n.kind==='value'; }).slice(0,3)};
  }

  /* ---- 気づきの帯：鏡・橋・羅針盤 ----
     鏡＝繰り返し現れているもの／橋＝離れた記録どうしの線／羅針盤＝次の小さな一歩。
     どれも最大1つ。並べすぎると、読むのではなく浴びるものになるため。
     言い方の順番は、事実 → 仮説 → 問い。断定はしない。 */
  function insightsFor(v){
    var out = [];
    function grown(n){ var g=stageOf(n); return g && g!=='seed'; }
    /* 鏡：いちばん繰り返し現れているもの */
    var m = v.ranked.filter(function(n){
      return ['value','strength','aesthetic','interest','condition'].indexOf(n.kind)>=0 && grown(n);
    })[0];
    if(m){
      var st = m.stat||{n:(m.evidenceIds||[]).length, months:1};
      out.push({k:'mirror', t:'鏡',
        f: st.n+'件の記録に、「'+m.label+'」が出ています。',
        q: 'これは、あなたが選んできたことでしょうか。それとも、選ばされてきたことでしょうか。',
        node: m});
    }
    /* 橋：離れた時間や領域をまたいでつながっている線 */
    var chain = bridgeChain();
    if(chain && chain.length>=3){
      out.push({k:'bridge', t:'橋',
        f: chain.map(function(x){ return x.short; }).join(' → '),
        q: 'この並びの真ん中にあるものに、名前をつけるとしたら何でしょう。'});
    } else {
      var br = (G.rels||[]).filter(function(r){ return r.kind==='foreshadow'||r.kind==='cross_domain'; })[0];
      if(br && G.entries[br.a] && G.entries[br.b])
        out.push({k:'bridge', t:'橋',
          f: br.why,
          q: 'この2つは、あなたの中では同じことでしょうか。'});
    }
    /* 羅針盤：次に試せる小さなこと */
    var c = v.ranked.filter(function(n){ return n.kind==='experiment'||n.kind==='recommendation'; })[0];
    if(c){
      out.push({k:'compass', t:'羅針盤',
        f: c.label,
        q: 'うまくいくかではなく、やってみて力が出るかを見てみませんか。',
        node: c});
    }
    return out.slice(0,3);
  }
  /* 記録から記録へ、関係の線をいちばん長くたどる。時間の古い順に並べる。 */
  function bridgeChain(){
    var rels = (G.rels||[]).filter(function(r){ return r.b && r.kind!=='orphan'; });
    if(!rels.length) return null;
    var adj = {};
    rels.forEach(function(r){
      (adj[r.a]=adj[r.a]||[]).push(r.b); (adj[r.b]=adj[r.b]||[]).push(r.a);
    });
    function when(id){ var e=G.entries[id]; if(!e) return '9999';
      return e.occurredAt || (/小さい頃|子どもの頃|昔|幼い/.test(e.rawText||'') ? '1990-01-01' : todayISO()); }
    var best = [];
    Object.keys(adj).forEach(function(startId){
      (function walk(id, path, seen){
        if(path.length > best.length) best = path.slice();
        if(path.length >= 5) return;
        (adj[id]||[]).forEach(function(nx){
          if(seen[nx]) return;
          seen[nx]=1; path.push(nx); walk(nx, path, seen);
          path.pop(); delete seen[nx];
        });
      })(startId, [startId], (function(){ var o={}; o[startId]=1; return o; })());
    });
    if(best.length < 3) return null;
    best.sort(function(a,b){ return when(a) < when(b) ? -1 : 1; });
    return best.map(function(id){
      var e=G.entries[id]||{};
      var txt=(e.rawText||'').replace(/[。、！？\n].*$/,'');
      return {id:id, short: txt.length>13 ? txt.slice(0,13)+'…' : txt};
    });
  }
  function renderInsights(){
    var w=$('#mapInsights'); if(!w) return;
    w.innerHTML='';
    if(!S.logs.length) return;
    insightsFor(view).forEach(function(i){
      var b=document.createElement('button');
      b.type='button'; b.className='ins ins-'+i.k;
      b.setAttribute('aria-label', i.t+'：'+i.f+' '+i.q);
      b.innerHTML='<b>'+esc(i.t)+'</b><span>'+esc(i.f)+'</span><em>'+esc(i.q)+'</em>';
      b.onclick=function(){
        /* 1回目でひらいて問いを見せ、2回目でその星へ寄る */
        if(!b.classList.contains('open')){
          Array.prototype.forEach.call(w.children, function(c){ c.classList.remove('open'); });
          b.classList.add('open'); return;
        }
        if(i.node){ sel=i.node; carded=true; computeKin(); showCard(i.node); panIntoView(i.node); draw(); syncDom(); }
      };
      w.appendChild(b);
    });
  }

  /* ---- 物語のレンズ ----
     世界の見え方を1つだけ差し出す。答えは5つ。押さなくても消えない。
     受け取った見方は「世界観の棚」に積まれる。 */
  function lensFor(v){
    function grown(n){ var g=stageOf(n); return g && g!=='seed'; }
    var top = v.ranked.filter(function(n){
      return ['value','aesthetic','strength','condition','tension'].indexOf(n.kind)>=0 && grown(n); });
    var cands = [];
    top.slice(0,4).forEach(function(n){
      if(n.kind==='tension')
        cands.push({id:'lens:'+n.id, title:'どちらも本当',
          p:'「'+n.label+'」。この2つは、どちらかを選ぶものではなく、両方あるまま進めるものかもしれません。',
          q:'いまのあなたには、この見方はどう映りますか。'});
      else if(n.kind==='condition')
        cands.push({id:'lens:'+n.id, title:'場所の話',
          p:'「'+n.label+'」。これは、あなたの能力ではなく、あなたに合う場所の話かもしれません。',
          q:'いまのあなたには、この見方はどう映りますか。'});
      else
        cands.push({id:'lens:'+n.id, title:'続いているもの',
          p:'「'+n.label+'」。これは一時の気分ではなく、あなたが何度も戻ってきている場所かもしれません。',
          q:'いまのあなたには、この見方はどう映りますか。'});
    });
    /* まだ答えていないものを、日ごとに1つだけ */
    var open0 = cands.filter(function(c){ return !lensGet(c.id); });
    if(!open0.length) return null;
    var i = Math.floor(hash01(todayISO()+'|'+v.mode) * open0.length);
    return open0[Math.min(i, open0.length-1)];
  }
  function lensGet(id){ return (S.cfg.lens||{})[id] || null; }
  function lensSet(id, rec){
    S.cfg.lens = S.cfg.lens || {};
    if(!rec) delete S.cfg.lens[id]; else S.cfg.lens[id]=rec;
    Store.saveLocal();
  }
  var LENSOPT = [
    {v:'fit',    t:'しっくりくる'},
    {v:'off',    t:'少し違う'},
    {v:'unsure', t:'今は分からない'},
    {v:'reword', t:'言葉を変える'},
    {v:'close',  t:'この見方は閉じる'}
  ];
  function renderLens(){
    var w=$('#mapLens'); if(!w) return;
    var L = S.logs.length ? lensFor(view) : null;
    if(!L){ w.hidden=true; w.innerHTML=''; w.dataset.has='0'; return; }
    w.dataset.has='1'; w.hidden = !!sel;
    var wasOpen = w.classList.contains('open');
    w.innerHTML='<button type="button" class="lenshead" id="lensHead" aria-expanded="'+(wasOpen?'true':'false')+'">'+
      '<b>物語のレンズ</b><p>'+esc(L.p)+'</p></button>'+
      '<p class="lq">'+esc(L.q)+'</p>'+
      '<div class="lopts">'+LENSOPT.map(function(o){
        return '<button type="button" data-v="'+o.v+'">'+esc(o.t)+'</button>'; }).join('')+'</div>'+
      '<button type="button" class="lshelf" id="lensShelf">世界観の棚を見る</button>';
    $('#lensHead').onclick=function(){
      var on = w.classList.toggle('open');
      $('#lensHead').setAttribute('aria-expanded', on?'true':'false');
    };
    Array.prototype.forEach.call(w.querySelectorAll('.lopts button'), function(btn){
      btn.onclick=function(){
        var v=btn.getAttribute('data-v'), text=L.p;
        if(v==='reword'){
          var t=window.prompt('あなたの言葉で書き換えてください', L.p);
          if(t===null) return; t=t.trim(); if(!t) return; text=t;
        }
        lensSet(L.id, {v:v, text:text, title:L.title, at:todayISO()});
        renderLens();
        toast(v==='close' ? '閉じました' : '棚に置きました');
      };
    });
    $('#lensShelf').onclick=openShelf;
  }
  function openShelf(){
    var m = S.cfg.lens||{};
    var ks = Object.keys(m).filter(function(k){ return m[k].v!=='close'; });
    var h='<h3 class="sh-t">世界観の棚</h3><p class="mono-note">受け取った見方が積まれています。いつでも降ろせます。</p>';
    if(!ks.length) h += '<p class="mono-note" style="margin-top:14px">まだ何も置かれていません。</p>';
    ks.forEach(function(k){
      var r=m[k];
      var ja = (LENSOPT.filter(function(o){ return o.v===r.v; })[0]||{}).t || '';
      h += '<div class="shelf-item"><p>'+esc(r.text)+'</p><span>'+esc(r.at)+' ・ '+esc(ja)+
           '</span> <button type="button" class="lshelf" data-k="'+esc(k)+'">棚から降ろす</button></div>';
    });
    Sheet.open(h, function(b){
      Array.prototype.forEach.call(b.querySelectorAll('[data-k]'), function(btn){
        btn.onclick=function(){ lensSet(btn.getAttribute('data-k'), null); openShelf(); renderLens(); };
      });
    });
  }

  /* ---- サマリー文 ---- */
  function summarize(v){
    if(!S.logs.length) return '';
    /* 上のまとめには「芽」を出さない。1件だけ見えたことを、
       あなたはこういう人です、と言ってしまわないため。 */
    function grown(n){ var g=stageOf(n); return g && g!=='seed'; }
    var pool0 = v.ranked.filter(function(n){ return n.kind!=='self'&&n.kind!=='evidence'&&grown(n); });
    /* 「全て」は時間のビュー。仮説ではなく、いまの章の話をする。 */
    if(v.mode==='all'){
      var c0 = v.ranked.filter(function(n){ return n.kind==='chapter'; })[0];
      var v0 = v.values.filter(grown)[0] || v.values[0];
      return (c0? '「'+c0.label+'」':'いまの章') + 'が、' +
             (v0? '「'+v0.label+'」':'あなたの選び方') + 'を中心に進んでいます。';
    }
    var top = pool0[0];
    if(!top) return 'まだ言葉にはせず、記録が集まってきているところです。';
    if(v.mode==='likes'){
      var i = pool0.filter(function(n){ return n.kind==='interest'; })[0] || top;
      return '「'+i.label+'」に、心が戻っているようです。';
    }
    if(v.mode==='career'){
      var s = pool0.filter(function(n){ return n.kind==='strength'; })[0];
      var t = pool0.filter(function(n){ return n.kind==='tension'; })[0];
      if(s) return '「'+s.label+'」力が、くり返し現れています。'+(t?' いまは「'+t.label+'」という問いの中にいるようです。':'');
      return '働き方については、まだ言葉を探している途中のようです。';
    }
    var c = v.ranked.filter(function(n){ return n.kind==='chapter'; })[0];
    var v0 = v.values.filter(grown)[0] || v.values[0];
    return (c? '「'+c.label+'」':'いまの章') + 'が、'+ (v0? '「'+v0.label+'」':'あなたの選び方') +'を中心に進んでいます。';
  }

  /* ---- 描画 ---- */
  function resize(){
    if(!cv) return;
    dpr = Math.min(window.devicePixelRatio||1, 2);
    var r = stage.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw(); syncDom();
  }
  /* 上に出ている文字（まとめと気づきの帯）の下端。星をそこに重ねないため */
  function headBottom(stageTop){
    var b = 110;
    ['#mapSum','#mapInsights'].forEach(function(q){
      var el=$(q); if(!el || el.hidden || !el.offsetHeight) return;
      b = Math.max(b, el.getBoundingClientRect().bottom - stageTop);
    });
    return b;
  }
  function sx(n){ return W/2 + (n.x+cam.x)*cam.z; }
  function sy(n){ return H/2 + (n.y+cam.y)*cam.z; }
  var selKin={};
  function computeKin(){
    selKin={};
    if(!sel || !view || !view.tree) return;
    selKin[sel.id]=1;
    var p = view.tree.parentOf[sel.id];                 /* 自分へ戻る道すじ */
    while(p){ selKin[p]=1; p = view.tree.parentOf[p]; }
    (function down(id){ (view.tree.kids[id]||[]).forEach(function(c){ selKin[c]=1; down(c); }); })(sel.id);
    view.edges.forEach(function(e){                     /* 参照でつながる相手も */
      if(e.trunk) return;
      if(e.a===sel) selKin[e.b.id]=1;
      if(e.b===sel) selKin[e.a.id]=1;
    });
  }
  function related(n){ return !sel || !!selKin[n.id]; }
  function chipRelated(n){
    if(!chip) return true;
    if(n.id===chip || n.kind==='self') return true;
    if((n.relatedValueIds||[]).indexOf(chip)>=0) return true;
    if(n.kind==='evidence' && n.entry) return (n.entry.candidateValues||[]).indexOf(chip)>=0;
    return false;
  }
  function alphaOf(n){
    var a = 1;
    if(sel && !related(n)) a = MAPC.DIM;
    if(chip && !chipRelated(n)) a = Math.min(a, MAPC.DIM);
    return a;
  }
  function radiusOf(n){
    var base = n.kind==='self' ? 4.5 : n.kind==='evidence' ? (view && view.mode==='all' ? 2.2 : 1.2) : 1.7 + (n.display||0)*4.75;
    return base * (n===sel ? 1.25 : 1);
  }
  function draw(){
    if(!ctx) return;
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070916'); g.addColorStop(.6,'#090C1C'); g.addColorStop(1,'#0C1024');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var px = cam.x*0.06*cam.z, py = cam.y*0.06*cam.z;
    nebula.forEach(function(nb){
      var X=W/2+nb.x*.35+px, Y=H/2+nb.y*.35+py;
      var rg=ctx.createRadialGradient(X,Y,0,X,Y,nb.r);
      rg.addColorStop(0, nb.h+'2A'); rg.addColorStop(1, nb.h+'00');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(X,Y,nb.r,0,6.284); ctx.fill();
    });
    ctx.fillStyle='#FFFFFF';
    stars.forEach(function(st){
      var X=W/2+st.x*.5+px*2, Y=H/2+st.y*.5+py*2;
      if(X<-10||X>W+10||Y<-10||Y>H+10) return;
      ctx.globalAlpha=st.o*.5; ctx.beginPath(); ctx.arc(X,Y,st.r,0,6.284); ctx.fill();
    });
    ctx.globalAlpha=1;
    if(!view) return;
    var t = intro;

    /* 時系列の星図では、時間の輪をごく薄く敷く。外へ行くほど過去。 */
    if(view.mode==='all'){
      var c0x = sx({x:0,y:0}), c0y = sy({x:0,y:0});
      ctx.strokeStyle='#3E4A78'; ctx.lineWidth=.9;
      [SPIRAL.rMin, 170, 300, SPIRAL.rMax].forEach(function(rr, i){
        ctx.globalAlpha = (0.50 - i*0.08) * t;
        ctx.beginPath(); ctx.arc(c0x, c0y, rr*cam.z, 0, 6.284); ctx.stroke();
      });
      ctx.globalAlpha=1;
    }

    /* 幹は常に、細く静かに。選んだときだけその線が起きあがる。 */
    var lit = {};
    if(sel) view.edges.forEach(function(e){ if(e.a===sel||e.b===sel) lit[e.a.id+'|'+e.b.id]=1; });
    var list = sel ? view.primary.concat(view.edges.filter(function(e){ return !e.trunk && (e.a===sel||e.b===sel); }))
                   : view.primary;
    list.forEach(function(e){
      var on = sel && selKin[e.a.id] && selKin[e.b.id];   /* 道すじ全体が光る */
      var touch = sel && (e.a===sel || e.b===sel);         /* 選んだ星につながる関係線 */
      /* 参照線（同じ価値観に根がある、など）は、選んだときだけ出す。
         いつも出すと点線だらけになって、幹がどれか分からなくなる。
         時系列の星図では、幹の線も引かない。位置そのものが時間を語るため。 */
      if(!e.trunk && !on && !(e.rel && touch)) return;
      if(view.mode==='all' && !on && !(e.rel && touch)) return;
      var A={x:sx(e.a),y:sy(e.a)}, B={x:sx(e.b),y:sy(e.b)};
      var mx=(A.x+B.x)/2 + (B.y-A.y)*0.09, my=(A.y+B.y)/2 - (B.x-A.x)*0.09;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B.x,B.y);
      ctx.strokeStyle = e.rel ? (RELJA[e.rel]||{}).c || '#C9B183'
                    : on ? (e.b.branch||'#C9B183') : mixHex(e.b.branch||'#39405E', '#232A44', .62);
      ctx.globalAlpha = (e.rel ? .88 : on ? .95 : (sel ? .10 : .78)) * Math.min(alphaOf(e.a),alphaOf(e.b)) * t;
      ctx.lineWidth = e.rel ? 1.3 : on ? (e.trunk ? 1.6 : 1.1) : .9;
      ctx.setLineDash(e.rel ? [5,4] : !e.trunk ? [2,5] : []);
      if(e.rel) e.hit = {ax:A.x, ay:A.y, bx:B.x, by:B.y, mx:mx, my:my};
      ctx.stroke(); ctx.setLineDash([]);
    });
    ctx.globalAlpha=1;

    view.nodes.forEach(function(n){
      var X=sx(n), Y=sy(n), r=radiusOf(n)*cam.z*t;
      if(X<-60||X>W+60||Y<-60||Y>H+60) return;
      var full = n.branch || MAPCOL[n.kind] || '#8E97B5';
      var near = !sel || n===sel || related(n);
      var col = near ? full : mixHex(full, '#6E7794', 0.55);
      var a = alphaOf(n) * (0.5 + (n.confidence||.5)*0.5);
      if(n.comet){
        var ang=Math.atan2(n.y,n.x);
        var gx=X-Math.cos(ang)*70*cam.z, gy=Y-Math.sin(ang)*70*cam.z;
        var lg=ctx.createLinearGradient(X,Y,gx,gy);
        lg.addColorStop(0,'rgba(104,203,196,.55)'); lg.addColorStop(1,'rgba(104,203,196,0)');
        ctx.strokeStyle=lg; ctx.lineWidth=Math.max(2,r*1.1); ctx.globalAlpha=a*t;
        ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(gx,gy); ctx.stroke();
      }
      if(n.kind==='self'){
        var sg=ctx.createRadialGradient(X,Y,0,X,Y,r*7);
        sg.addColorStop(0,'rgba(243,230,200,.30)'); sg.addColorStop(1,'rgba(243,230,200,0)');
        ctx.globalAlpha=1; ctx.fillStyle=sg;
        ctx.beginPath(); ctx.arc(X,Y,r*7,0,6.284); ctx.fill();
        ctx.strokeStyle='rgba(243,230,200,.45)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(X,Y,r*1.9,0,6.284); ctx.stroke();
      } else {
        var glow=ctx.createRadialGradient(X,Y,0,X,Y,Math.max(r*3.4,9));
        glow.addColorStop(0, full+'3A'); glow.addColorStop(1, full+'00');
        ctx.globalAlpha=a*0.85; ctx.fillStyle=glow;
        ctx.beginPath(); ctx.arc(X,Y,Math.max(r*3.4,9),0,6.284); ctx.fill();
      }
      ctx.globalAlpha=a; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(X,Y,Math.max(r,1.2),0,6.284); ctx.fill();
      if(n.kind==='chapter' && n.trend && n.trend.n){
        var tr=n.trend, segs=[['moved',MAPCOL.interest],['effort',MAPCOL.strength],['pain',MAPCOL.tension]];
        var rr=r+4, st=-Math.PI/2, tot=tr.moved+tr.effort+tr.pain || 1;
        ctx.lineWidth=2.4; ctx.globalAlpha=a*0.95;
        segs.forEach(function(sg){
          var v=tr[sg[0]]; if(!v) return;
          var sw=(v/tot)*Math.PI*2*0.94;
          ctx.strokeStyle=sg[1]; ctx.beginPath(); ctx.arc(X,Y,rr,st,st+sw); ctx.stroke();
          st += sw + Math.PI*2*0.02;
        });
      }
      /* まだ小項目がたたまれている枝には、外側に点線の輪を出す。
         「押すとひらく」ことが、見ただけで分かるようにする。 */
      if(n.hidden){
        ctx.globalAlpha = a*0.55; ctx.strokeStyle = n.branch || MAPCOL[n.kind] || '#8E97B5';
        ctx.lineWidth = 1; ctx.setLineDash([2, 3.2]);
        ctx.beginPath(); ctx.arc(X, Y, r+4.5, 0, 6.284); ctx.stroke();
        ctx.setLineDash([]);
      }
      if(n.confirmed){ ctx.globalAlpha=a; ctx.strokeStyle='#D8B56A'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(X,Y,r+3,0,6.284); ctx.stroke(); }
      if(n.kind==='tension'){ ctx.globalAlpha=a*.9; ctx.strokeStyle=MAPCOL.tension; ctx.lineWidth=1;
        ctx.setLineDash([2,3]); ctx.beginPath(); ctx.arc(X,Y,r+4.5,0,6.284); ctx.stroke(); ctx.setLineDash([]); }
      var stgN = stageOf(n);
      /* 芽はうすい輪、変わりつつある仮説は割れた輪。育ち方が目で分かるように */
      if(stgN==='seed'){
        ctx.globalAlpha=a*.35; ctx.strokeStyle=col; ctx.lineWidth=.8;
        ctx.beginPath(); ctx.arc(X,Y,r+3,0,6.284); ctx.stroke();
      } else if(stgN==='changing'){
        ctx.globalAlpha=a*.6; ctx.strokeStyle='#B08153'; ctx.lineWidth=1;
        ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(X,Y,r+4,0,6.284); ctx.stroke(); ctx.setLineDash([]);
      }
      if(n===sel){ ctx.globalAlpha=1; ctx.strokeStyle='#F7F1E6'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(X,Y,r+7,0,6.284); ctx.stroke(); }
      ctx.globalAlpha=1;
    });
  }

  /* ---- ラベルと当たり判定（HTML／キーボード対応） ---- */
  function syncDom(){
    if(!view||!layer) return;
    /* 星を選んでいるあいだ、レンズは引っこむ。読むものが2つ重ならないように */
    var lw=$('#mapLens'); if(lw && lw.dataset.has==='1') lw.hidden = !!sel;
    var pad = 66;
    Array.prototype.forEach.call(layer.children, function(el){
      var n = view.byId[el.dataset.id];
      if(!n){ el.style.display='none'; return; }
      var X=sx(n), Y=sy(n), r=radiusOf(n)*cam.z;
      var show = X>-40 && X<W+40 && Y>-30 && Y<H+30;
      el.style.display = show ? '' : 'none';
      if(!show) return;
      if(el.classList.contains('nhit')){
        /* 指で押せる大きさを必ず確保する。見た目の点は小さくても、
           押せる範囲は44px以上あける。 */
        var d=Math.max(44, r*2+16);
        el.style.width=d+'px'; el.style.height=d+'px';
        el.style.left=X+'px'; el.style.top=Y+'px';
      } else {
        var lx = Math.max(pad, Math.min(W-pad, X));
        el.style.left=lx+'px'; el.style.top=(Y+r+9)+'px';
        el.style.opacity = String(alphaOf(n));
        var labelIt = view.labelSet[n.id] || n===sel ||
                      (sel && view.edges.some(function(e){ return (e.a===sel&&e.b===n)||(e.b===sel&&e.a===n); }));
        el.style.visibility = labelIt ? 'visible' : 'hidden';
        el.style.fontSize = (n.kind==='evidence'? .6 : .66)+'rem';
      }
    });
    avoidCollisions();
  }
  /* ラベル同士が重なったらずらし、それでも無理なら隠す */
  function avoidCollisions(){
    var sumEl=$('#mapSum'), stageTop=stage.getBoundingClientRect().top;
    var top = Math.min(H*0.46, headBottom(stageTop) + 10);
    var bottom = H - 96;                            /* ヒントと「全体を見る」の帯は避ける */
    var items = Array.prototype.filter.call(layer.children, function(el){
      return el.classList.contains('nlabel') && el.style.visibility!=='hidden' && el.style.display!=='none';
    });
    items.forEach(function(el){ el.classList.remove('tight'); });
    items.sort(function(a,b){
      var na=view.byId[a.dataset.id], nb=view.byId[b.dataset.id];
      return (nb.display||0)-(na.display||0);
    });
    /* 星そのものも障害物にする。文字が丸に重なると読めなくなるため。 */
    var placed=[];
    view.nodes.forEach(function(n){
      var rad = radiusOf(n)*cam.z;
      if(rad < 4.5) return;                          /* 小さな点は文字が乗っても読める */
      var X=sx(n), Y=sy(n), rr=rad+3;
      if(X<-60||X>W+60||Y<-60||Y>H+60) return;
      placed.push({l:X-rr, r:X+rr, t:Y-rr, b:Y+rr, node:n.id});
    });
    items.forEach(function(el){
      var w0=el.offsetWidth, h0=el.offsetHeight;
      var x=parseFloat(el.style.left), y=parseFloat(el.style.top);
      /* 近いところから順に空きを探す。遠すぎる位置は使わない（どの星の名か分からなくなるため） */
      var tries=[[0,0],[0,-(h0+16)],[w0*0.52,0],[-w0*0.52,0],[w0*0.52,-(h0+12)],[-w0*0.52,-(h0+12)],
                 [0,h0+10],[w0*0.52,h0+10],[-w0*0.52,h0+10],[w0*0.8,h0*0.4],[-w0*0.8,h0*0.4],
                 [0,-(h0+16)*2],[w0*0.8,-(h0+16)],[-w0*0.8,-(h0+16)]];
      tries.sort(function(a,b){ return (a[0]*a[0]+a[1]*a[1])-(b[0]*b[0]+b[1]*b[1]); });
      var ok=false;
      var MAXD = 108;                                  /* 星から離れすぎたら出さない */
      function tryPlace(w0,h0){
        for(var i=0;i<tries.length;i++){
          var cx=Math.max(w0/2+6, Math.min(W-w0/2-6, x+tries[i][0]));
          var cy=Math.max(top, Math.min(bottom-h0, y+tries[i][1]));
          if(Math.hypot(cx-x, cy-y) > MAXD) continue;
          var r={l:cx-w0/2, r:cx+w0/2, t:cy, b:cy+h0};
          var hit = placed.some(function(q){
            if(q.node===el.dataset.id) return false;    /* 自分の星の上に置くのは当然なので除く */
            return !(r.r<q.l-4||r.l>q.r+4||r.b<q.t-2||r.t>q.b+2);
          });
          if(!hit){ el.style.left=cx+'px'; el.style.top=cy+'px'; placed.push(r); return true; }
        }
        return false;
      }
      ok = tryPlace(w0,h0);
      if(!ok){                                        /* 入らなければ一行に縮めてもう一度 */
        el.classList.add('tight');
        var w1=el.offsetWidth, h1=el.offsetHeight;
        tries.sort(function(a,b){ return (a[0]*a[0]+a[1]*a[1])-(b[0]*b[0]+b[1]*b[1]); });
        ok = tryPlace(w1,h1);
        if(!ok) el.classList.remove('tight');
      }
      if(!ok) el.style.visibility='hidden';
    });
  }
  function buildDom(){
    layer.innerHTML='';
    /* 大事な星ほどあとに置く＝重なったとき上に来て、必ず触れる */
    view.nodes.slice().sort(function(a,b){ return (a.display||0)-(b.display||0); }).forEach(function(n){
      var hit=document.createElement('button');
      hit.className='nhit'; hit.dataset.id=n.id; hit.type='button';
      hit.setAttribute('aria-label', (KINDJA[n.kind]||'')+'：'+(n.label||'いまの自分')+
        (n.hidden ? '。押すと'+n.hidden+'件の内訳がひらきます' : '')+'。ドラッグで動かせます');
      if(n.hidden) hit.setAttribute('aria-expanded','false');
      else if(opened[n.id]) hit.setAttribute('aria-expanded','true');
      hit.onclick=function(ev){ ev.stopPropagation(); if(hit._sup){ hit._sup=false; return; } select(n); };
      hit.addEventListener('pointerdown', function(ev){
        ev.stopPropagation(); hit.setPointerCapture(ev.pointerId);
        /* 触れた瞬間は、まだ何も動かさない。動かした瞬間から掴む。
           ここで力を起こすと、掴もうとした星が逃げてしまう。 */
        nodeDrag={n:n, x:ev.clientX, y:ev.clientY, moved:0, id:ev.pointerId, live:false};
        sim.held = n.id;
      });
      hit.addEventListener('pointermove', function(ev){
        if(!nodeDrag || nodeDrag.id!==ev.pointerId) return;
        var dx=(ev.clientX-nodeDrag.x)/cam.z, dy=(ev.clientY-nodeDrag.y)/cam.z;
        nodeDrag.moved += Math.abs(ev.clientX-nodeDrag.x)+Math.abs(ev.clientY-nodeDrag.y);
        nodeDrag.x=ev.clientX; nodeDrag.y=ev.clientY;
        if(!nodeDrag.live){
          if(nodeDrag.moved < 3) return;            /* 指のふるえでは動かさない */
          nodeDrag.live = true; sim.drag = n.id;
        }
        n.x += dx; n.y += dy;                       /* 掴んだ星は指のとおりに */
        if(n === sim.root){
          /* 中心を動かすと、まわりの星もふわ〜っと一緒に付いてくる */
          sim.list.forEach(function(m){
            if(m===n) return;
            m.vx += dx*SIMC.carry; m.vy += dy*SIMC.carry;
          });
        }
        simWake();                                  /* ばねで、枝ぜんぶが有機的に追ってくる */
      });
      function endDrag(ev){
        if(!nodeDrag || nodeDrag.id!==ev.pointerId) return;
        if(nodeDrag.moved>=8) hit._sup=true;         /* 動かした星も固定しない。また流れてよい */
        sim.drag = null; sim.held = null; nodeDrag=null;
        simWake();                                  /* 離すと、まわりが静かに整い直す */
      }
      hit.addEventListener('pointerup', endDrag);
      hit.addEventListener('pointercancel', endDrag);
      layer.appendChild(hit);
      if(n.kind==='self') return;                 /* 中央に文字は置かない */
      var lb=document.createElement('div');
      lb.className='nlabel'; lb.dataset.id=n.id; lb.setAttribute('aria-hidden','true');
      lb.innerHTML = '<span class="mk">'+esc(({value:'VALUE',interest:'LIKES',strength:'STRENGTH',
        condition:'CONDITION',tension:'TENSION',wish:'WISH',turningPoint:'TURNING',chapter:'CHAPTER',
        recommendation:'NEXT',experiment:'EXPERIMENT',self:'',evidence:''})[n.kind]||'')+'</span>'+
        '<span class="lb">'+esc(n.label||'いまの自分')+'</span>';
      layer.appendChild(lb);
    });
  }

  /* ---- 選択と詳細カード ---- */
  function select(n){
    /* 1回目：小項目がひらく。2回目：くわしく読める。3回目：たたんで戻る。 */
    if(n.id!=='self'){
      if(n.hidden){                                  /* まだたたまれている → ひらく */
        opened[n.id] = 1; sel = n; carded = false;
        computeKin(); rebuildKeepSel(n); return;
      }
      if(opened[n.id] && sel===n && !carded){        /* ひらいている → くわしく読む */
        carded = true; showCard(n); panIntoView(n); draw(); syncDom(); return;
      }
      if(opened[n.id] && sel===n && carded){         /* 読んだあと → たたんで戻る */
        delete opened[n.id]; sel = null; carded = false;
        computeKin(); rebuildKeepSel(n, false); return;
      }
    }
    sel = (sel===n)?null:n; computeKin(); carded = !!sel;
    if(sel){ showCard(sel); panIntoView(sel); } else hideCard();
    draw(); syncDom();
  }
  /* ひらき直したあとも、選んだ星と、ひらいた小項目の見え方をそろえる */
  function rebuildKeepSel(n, keep){
    var id = n.id;
    var beforeIds = {}; view.nodes.forEach(function(m){ beforeIds[m.id]=1; });
    view = compose(S.mapMode);
    sel = keep===false ? null : (view.byId[id] || null);
    computeKin(); buildDom(); renderChips();
    $('#mapSum').textContent = summarize(view);
    renderInsights(); renderLens();
    fit();                       /* 先に、ひらいたあとの姿で画面に収める */
    /* そのうえで、新しく出てきた小項目だけ親のところから咲くように出す */
    var fresh = view.nodes.filter(function(m){ return !beforeIds[m.id]; });
    if(fresh.length && !reduce && sel){
      sim.flight = {t0: performance.now(), dur: 460, items: fresh.map(function(c){
        return {n:c, fx:sel.x, fy:sel.y, tx:c.x, ty:c.y};
      })};
      fresh.forEach(function(c){ c.x = sel.x; c.y = sel.y; });
    }
    /* ひらいた直後はカードを出さない。まず枝が見える。もう一度押すと読める。 */
    if(sel && !fresh.length){ showCard(sel); panIntoView(sel); } else hideCard();
    simWake(); draw(); syncDom();
  }
  /* 選んだ星と、そこから中心へ戻る道すじが、カードに隠れないように寄せる */
  function panIntoView(n){
    var card=$('#nodeDetail'), st=stage.getBoundingClientRect();
    var lim = card ? Math.max(160, card.getBoundingClientRect().top - st.top - 16) : H-160;
    var ys=[sy(n)], p=view.tree.parentOf[n.id];
    while(p){ var m=view.byId[p]; if(m) ys.push(sy(m)); p=view.tree.parentOf[p]; }
    var lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
    var dy=0;
    if(hi>lim-14) dy = (lim-14)-hi;
    if(lo+dy < 120) dy = 120-lo;
    if(dy) cam.y += dy/cam.z;
  }
  function hideCard(){ $('#nodeDetail').classList.remove('on'); }
  function evLine(id){
    var e = G.entries[id]; if(!e) return '';
    var kindJa = ({moved:'心が動いた',effort:'力を使った',pain:'引っかかった'})[e.eventType]||'';
    if(e.isChoice) kindJa += '・選んだ';
    if(e.isWish)   kindJa += '・願った';
    var d = e.occurredAt ? fmtMD(e.occurredAt) : '時期不明';
    return '<div class="nd-ev"><span class="d">'+esc(d)+'</span><span class="t">'+esc(e.rawText)+
           '<em>'+esc(kindJa)+'</em></span></div>';
  }
  /* 線を押せるようにする。曲線は3点で近似して、いちばん近い線を返す。 */
  function edgeAt(px, py){
    if(!view) return null;
    var best=null, bd=16;
    view.edges.forEach(function(e){
      if(!e.rel || !e.hit) return;
      var h=e.hit;
      var pts=[[h.ax,h.ay]], STEPS=8;
      for(var i=1;i<=STEPS;i++){
        var u=i/STEPS, iu=1-u;
        pts.push([iu*iu*h.ax + 2*iu*u*h.mx + u*u*h.bx,
                  iu*iu*h.ay + 2*iu*u*h.my + u*u*h.by]);
      }
      for(var k=0;k<pts.length-1;k++){
        var d=segDist(px,py,pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1]);
        if(d<bd){ bd=d; best=e; }
      }
    });
    return best;
  }
  function segDist(px,py,x1,y1,x2,y2){
    var dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
    var u = L ? Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy)/L)) : 0;
    var qx=x1+u*dx, qy=y1+u*dy;
    return Math.hypot(px-qx, py-qy);
  }
  function showRelCard(e){
    var el=$('#nodeDetail'), b=$('#ndBody');
    var meta = RELJA[e.rel] || {t:'つながり', c:'#8E97B5'};
    var h = '<p class="nd-k"><i style="background:'+meta.c+'"></i>つながり</p>'+
      '<p class="nd-stage" style="border-color:'+meta.c+'55;color:'+meta.c+'">'+esc(meta.t)+'</p>'+
      '<h4>'+esc(e.a.label)+' と '+esc(e.b.label)+'</h4>'+
      '<div class="nd-sec"><h5>なぜ結ばれている？</h5><p>'+esc(e.why)+'</p>'+
      '<p class="nd-stagenote">これは見立てです。違うと感じたら、そのままにしておいて大丈夫です。</p></div>';
    b.innerHTML=h; el.classList.add('on');
  }

  /* 星が属している領域。決めきれないときは決めない。 */
  function cardDomain(n){
    var ds = {};
    (n.evidenceIds||[]).forEach(function(id){
      var e=G.entries[id]; if(!e) return;
      if(e.domainConfidence!=null && e.domainConfidence < MAPC.DOMAIN_MIN) return;
      ds[e.domain] = (ds[e.domain]||0)+1;
    });
    var ks = Object.keys(ds).sort(function(a,b){ return ds[b]-ds[a]; });
    if(!ks.length) return 'まだ決めていない';
    if(ks.length>=2 && ds[ks[1]] >= ds[ks[0]]*0.8) return DOMJA(ks[0])+'と'+DOMJA(ks[1])+'の両方';
    return DOMJA(ks[0]);
  }
  /* いちばんつらかった記録の強さ。意味づけを急がないための目安 */
  function cardDistress(n){
    var m=0;
    (n.evidenceIds||[]).forEach(function(id){
      var e=G.entries[id]; if(!e) return;
      if(e.energy==='drain' || (e.violatedNeeds||[]).length)
        m = Math.max(m, (e.emotionalIntensity||0)*0.7 + ((e.violatedNeeds||[]).length?0.3:0));
    });
    return m;
  }
  /* この星につながっている関係線を、種類つきで返す */
  function cardRels(n){
    var mine = {};
    (n.evidenceIds||[]).forEach(function(id){ mine[id]=1; });
    if(n.kind==='evidence' && n.entry) mine[n.entry.id]=1;
    return (G.rels||[]).filter(function(r){
      return r.kind!=='orphan' && (mine[r.a] || mine[r.b]);
    }).slice(0,3);
  }
  /* 問いはひとつだけ。答えを出させるためではなく、置いておくため。 */
  function cardQuestion(n, stg){
    if(stg==='seed')     return 'これは、これから何度も戻ってくることでしょうか。それとも、この一度きりのことでしょうか。';
    if(stg==='changing') return 'いまのあなたなら、これをどんな言葉で言い直しますか。';
    if(stg==='tension')  return 'この2つが両方あるまま進めるとしたら、どんな進み方になりそうですか。';
    if(n.kind==='condition')  return 'この条件は、いまの場所でどのくらい満たせていますか。';
    if(n.kind==='friction')   return 'これは、あなたの側の話でしょうか。それとも、場所の側の話でしょうか。';
    if(n.kind==='strength')   return 'これを使っているとき、あなたは何をしているときですか。';
    if(n.kind==='wish' || n.kind==='experiment' || n.kind==='recommendation')
      return '今週のうちに、これを15分だけ試すとしたら、何をしますか。';
    if(n.kind==='evidence')   return 'この日のことを、いまはどう思い出しますか。';
    return 'これは、あなたが選んできたことでしょうか。それとも、選ばされてきたことでしょうか。';
  }

  function showCard(n){
    var el=$('#nodeDetail'), b=$('#ndBody');
    var col = MAPCOL[n.kind]||'#8E97B5';
    var h='<p class="nd-k"><i style="background:'+col+'"></i>'+esc(KINDJA[n.kind]||'')+'</p>';
    if(n.kind==='self'){
      var vs = view.values;
      var mt = (S.months[todayISO().slice(0,7)]||{}).title;
      h += '<h4>いまの自分</h4><p class="sum">'+
        (vs.length? '記録からは、'+vs.map(function(v){ return '「'+esc(v.label)+'」'; }).join('、')+'が強く現れています。'
                  : 'まだ一つの軸に決めず、記録を集めています。')+'</p>';
      h += '<div class="nd-sec"><h5>今月のテーマ</h5><p>'+esc(mt||'まだ名前がありません')+'</p></div>';
      b.innerHTML=h; el.classList.add('on'); return;
    }
    var stg0 = stageOf(n);
    if(stg0) h += '<p class="nd-stage stg-'+stg0+'">'+esc(STAGEJA[stg0])+'</p>';
    h += '<h4>'+esc(n.label)+'</h4>';
    if(n.autoLabel && n.autoLabel!==n.label)
      h += '<p class="nd-was">はじめの言葉：'+esc(n.autoLabel)+'</p>';
    if(n.summary) h += '<p class="sum">'+esc(n.summary)+'</p>';
    /* ── ① 事実 ──
       まず、何がどれだけあったか。ここには解釈を混ぜない。 */
    var st = n.stat||{n:(n.evidenceIds||[]).length, months:1, days:1, domains:1};
    var mix = n.evidenceMix;
    var facts = [];
    if(st.n) facts.push('記録の数：'+st.n+'件');
    if(st.days) facts.push('日付の違う日：'+st.days+'日');
    if(st.months) facts.push('またいだ月：'+st.months+'か月');
    if(n.firstSeenAt) facts.push('最初に現れた：'+n.firstSeenAt);
    if(n.lastSeenAt)  facts.push('最近現れた：'+n.lastSeenAt);
    facts.push('領域：'+cardDomain(n));
    h += '<div class="nd-sec"><h5>事実</h5><div class="nd-meta">'+
         facts.map(function(f){ return '<span>'+esc(f)+'</span>'; }).join('')+'</div>';
    if(mix){
      var kinds=[];
      if(mix.choice)   kinds.push('何かを選び直した記録が'+mix.choice+'件');
      if(mix.outcome)  kinds.push('それで結果が変わった記録が'+mix.outcome+'件');
      if(mix.praised)  kinds.push('人から反応があった記録が'+mix.praised+'件');
      if(mix.violated) kinds.push('侵されたときに痛んだ記録が'+mix.violated+'件');
      if(kinds.length) h += '<p class="nd-factline">'+esc(kinds.join('、')+'あります。')+'</p>';
      if(mix.objects && mix.objects.length>=2)
        h += '<p class="nd-factline">'+esc(mix.objects.slice(0,3).join('・')+'に共通して現れています。')+'</p>';
    }
    h += '</div>';
    var evs0=(n.evidenceIds||[]).slice(0,5).map(evLine).join('');
    if(evs0) h += '<div class="nd-sec"><h5>根拠になった記録</h5>'+evs0+'</div>';
    /* つらさの強い記録は、意味づけを急がない */
    if(cardDistress(n) >= .72)
      h += '<p class="nd-hold">ここに残しました。今は、意味を決めなくても大丈夫です。</p>';

    /* ── ② 見立て（仮説）── */
    h += '<div class="nd-band">見立て</div>';
    /* モヤモヤは4層で見せる。原因を能力に閉じず、環境との相性として置く。 */
    if(n.kind==='friction' && n.layers){
      h += '<div class="nd-sec nd-layers">'+
        '<div class="ly"><b>起きたこと</b><span>'+esc(n.layers.happened||'')+'</span></div>'+
        '<div class="ly"><b>期待していたこと</b><span>'+esc(n.layers.expected||'')+'</span></div>'+
        '<div class="ly"><b>不足していた条件</b><span>'+esc(n.layers.lacked||'')+'</span></div>'+
        '<div class="ly"><b>侵害された価値観</b><span>'+esc((n.layers.violated||[]).join('、'))+'</span></div>'+
      '</div>';
      if(n.fitNote) h += '<p class="nd-fit">'+esc(n.fitNote)+'</p>';
    }
    /* 葛藤は、どちらも消さずに並べる */
    if(n.kind==='tension' && n.sides){
      h += '<div class="nd-sec nd-sides"><span>'+esc(n.sides[0])+'</span><em>×</em><span>'+esc(n.sides[1])+'</span></div>';
    }
    var stg = stageOf(n);
    var why;
    if(stg==='rooted')        why = st.n+'件の記録に、'+st.months+'つの月をまたいで繰り返し現れています。';
    else if(stg==='changing') why = st.n+'件の記録から出てきた言葉ですが、いまのあなたには合っていないかもしれません。';
    else if(stg==='tension')  why = st.n+'件の記録の中で、２つの気持ちが同時に出ています。';
    else if(stg==='growing')  why = st.n+'件の記録に共通して現れています。まだ仮説です。';
    else why = '1件の記録から見えた芽です。「'+n.label+'」が大事になりつつある可能性があります。';
    h += '<div class="nd-sec"><h5>なぜここにある？</h5><p>'+esc(why)+'</p>'+
         (stg? '<p class="nd-stagenote">'+esc(STAGENOTE[stg])+'</p>' : '')+'</div>';
    var rel=(n.relatedValueIds||[]).map(function(v){ return G.byId[v]? G.byId[v].label : ''; }).filter(Boolean);
    var futures = S.futures.filter(function(f){
      return (n.evidenceIds||[]).indexOf('f:'+f.id)>=0 ||
             (n.kind!=='evidence' && (f.body||'').length && (n.evidenceIds||[]).some(function(id){
               var e=G.entries[id]; return e && e.rawText && f.body && e.rawText.indexOf(f.body.slice(0,4))>=0; }));
    });
    if(rel.length) h += '<div class="nd-sec"><h5>根がつながっている価値観</h5><p>'+esc(rel.join('・'))+'</p></div>';
    var lines = cardRels(n);
    if(lines.length) h += '<div class="nd-sec"><h5>ほかの記録とのつながり</h5>'+
      lines.map(function(r){ return '<p class="nd-relline"><i style="background:'+
        ((RELJA[r.kind]||{}).c||'#8E97B5')+'"></i><b>'+esc((RELJA[r.kind]||{}).t||'')+'</b>'+esc(r.why)+'</p>'; }).join('')+
      '</div>';
    if(futures.length) h += '<div class="nd-sec"><h5>Future Memo とのつながり</h5><p>'+
      esc(futures.map(function(f){ return f.body; }).join(' / '))+'</p></div>';

    /* ── ③ 問い ──
       言い切らずに、考える場所だけ残す。 */
    h += '<div class="nd-band">問い</div>';
    h += '<p class="nd-q">'+esc(cardQuestion(n, stg))+'</p>';
    /* 最終的に決めるのは本人。5つの答え方を必ず同じ並びで置く。 */
    var hy = hypGet(n.id) || {};
    h += '<div class="nd-sec"><h5>この言葉は、いまのあなたに合っていますか</h5>'+
         '<div class="nd-fb">'+ HYPOPT.map(function(o){
           return '<button type="button" class="fbo'+(hy.v===o.v?' on':'')+
                  '" data-v="'+o.v+'"'+(o.v==='del'?' data-danger="1"':'')+'>'+esc(o.t)+'</button>';
         }).join('') +'</div>'+
         '<p class="nd-fbnote">答えは、次からの表示に反映されます。記録そのものは消えません。</p></div>';
    b.innerHTML=h; el.classList.add('on');
    Array.prototype.forEach.call(b.querySelectorAll('.fbo'), function(btn){
      btn.onclick = function(){
        var v = btn.getAttribute('data-v');
        if(hy.v===v){ hypSet(n.id, null); G=null; rebuild(); toast('答えを取り消しました'); return; }
        if(v==='reword'){
          var cur = hy.v==='reword' ? (hy.text||'') : n.label;
          var t = window.prompt('あなたの言葉で書き換えてください', cur);
          if(t===null) return;
          t = t.trim(); if(!t) return;
          hypSet(n.id, 'reword', t); G=null; rebuild(); toast('あなたの言葉にしました'); return;
        }
        if(v==='del'){
          if(!window.confirm('この仮説を地図から外します。元の記録は残ります。よろしいですか？')) return;
          hypSet(n.id, 'del'); G=null; rebuild(); hideCard(); toast('地図から外しました'); return;
        }
        hypSet(n.id, v); G=null; rebuild();
        toast(v==='me' ? '覚えました' : v==='off' ? '表示を控えます' : '保留にしました');
      };
    });
  }

  /* ---- 価値観チップ ---- */
  function renderChips(){
    var w=$('#vchips'); w.innerHTML='';
    view.values.forEach(function(v){
      var b=document.createElement('button');

      b.innerHTML=esc(v.chip||v.label)+'<b>'+(v.evidenceIds||[]).length+'</b>';
      b.onclick=function(){ chip = (chip===v.id)?null:v.id; renderChips(); draw(); syncDom(); };
      w.appendChild(b);
    });

  /* ---- 入力 ---- */
  var drag=null, pts={}, pinch=null;
  function bind(){
    stage.addEventListener('pointerdown', function(e){
      stage.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts);
      if(ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]];
        pinch={d:Math.hypot(A.x-B.x,A.y-B.y), v:cam.v}; drag=null; return; }
      drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId}; stage.classList.add('grabbing');
    });
    stage.addEventListener('pointermove', function(e){
      if(pts[e.pointerId]) pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts);
      if(pinch && ids.length===2){ var A=pts[ids[0]],B=pts[ids[1]];
        var d=Math.hypot(A.x-B.x,A.y-B.y);
        setZoom(pinch.v*d/pinch.d); return; }
      if(!drag) return;
      var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      drag.moved+=Math.abs(dx)+Math.abs(dy);
      cam.x+=dx/cam.z; cam.y+=dy/cam.z; drag.x=e.clientX; drag.y=e.clientY;
      draw(); syncDom();
    });
    function up(e){
      delete pts[e.pointerId]; if(Object.keys(pts).length<2) pinch=null;
      stage.classList.remove('grabbing');
      if(drag && drag.id===e.pointerId){
        if(drag.moved<8 && e.target===stage){
          /* 何もない所を押したら選択を解く。ただし線の上なら、その線の意味を出す。 */
          var r0=stage.getBoundingClientRect();
          var hitE = edgeAt(e.clientX-r0.left, e.clientY-r0.top);
          if(hitE){ drag=null; showRelCard(hitE); return; }
          sel=null; carded=false; computeKin(); hideCard(); draw(); syncDom();
        }
        drag=null;
      }
    }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', function(e){ e.preventDefault(); setZoom(cam.v*(e.deltaY<0?1.12:0.89)); }, {passive:false});
  }
  /* ピンチは「拡大」ではなく「深さ」。一段深くなるたびに画面に収めなおす。
     cam.v は基準倍率からの相対値（画面に収まる倍率が常に v=1）。 */
  function setZoom(v){
    cam.v = Math.max(.18, Math.min(6, v));
    if(view && view.mode==='all'){
      if(cam.v >= MAPC.STEP_IN  && lvl < 3){ lvl++; rebuild(); flashLevel(); return; }
      if(cam.v <= MAPC.STEP_OUT && lvl > 0){ lvl--; rebuild(); flashLevel(); return; }
    }
    applyV(); draw(); syncDom();
  }
  function applyV(){
    var base = cam.base || 1;
    cam.z = Math.max(MAPC.ZOOM.min, Math.min(MAPC.ZOOM.max, base * cam.v));
  }
  var LVLJA = ['年ごと','月ごと','週ごと','出来事'];
  function flashLevel(){
    var el=$('#mapLvl'); if(!el) return;
    el.textContent = LVLJA[lvl]; el.classList.add('on');
    clearTimeout(flashLevel._t);
    flashLevel._t = setTimeout(function(){ el.classList.remove('on'); }, 1400);
  }

  function fit(){
    if(!view||!view.nodes.length||!W) return;
    if(view.mode==='all'){
      /* 時系列の星図は、現在の自分を画面の中心に置く。外周がちょうど収まる倍率にする。 */
      var sumEl0=$('#mapSum'), st0=stage.getBoundingClientRect().top;
      var top0 = sumEl0 ? Math.max(120, Math.min(H*0.42, sumEl0.getBoundingClientRect().bottom - st0 + 14)) : 126;
      var bot0 = 104, band = Math.max(120, H - top0 - bot0);
      var need = (SPIRAL.rMax + 46) * 2;
      cam.z = Math.max(MAPC.ZOOM.min, Math.min(1.2, Math.min((W-24)/need, band/need)));
      cam.base = cam.z; cam.v = 1;
      cam.x = 0; cam.y = (top0 - bot0)/2/cam.z;
      return;
    }
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    view.nodes.forEach(function(n){
      x0=Math.min(x0,n.x); x1=Math.max(x1,n.x); y0=Math.min(y0,n.y); y1=Math.max(y1,n.y);
    });
    if(x0>x1) return;
    var gw=Math.max(x1-x0,140), gh=Math.max(y1-y0,140);
    var sumEl=$('#mapSum'), st=stage.getBoundingClientRect().top;
    var topPad = Math.max(120, Math.min(H*0.48, headBottom(st) + 14));
    var botPad = 86;
    var z=Math.min((W-104)/gw, (H-topPad-botPad)/gh);
    cam.z=Math.max(MAPC.ZOOM.min, Math.min(1.55, z));
    cam.base=cam.z; cam.v=1;                          /* この深さでの基準倍率 */
    cam.x=-(x0+x1)/2; cam.y=-(y0+y1)/2 + (topPad-botPad)/2/cam.z;
  }
  function rebuild(keepCam){
    view = compose(S.mapMode);
    if(!keepCam) fit();
    buildDom(); renderChips();
    $('#mapSum').textContent = summarize(view);
    renderInsights(); renderLens();
    var lg=$('#mapLegend'); if(lg) lg.hidden = (S.mapMode!=='all');
    $('#mapHint').textContent = S.mapMode==='all'
      ? '星を押すとその日の記録がひらきます。ピンチで 年 → 月 → 週 → 出来事'
      : '点線の輪がある星を押すと内訳がひらき、もう一度押すとくわしく読めます';
    draw(); syncDom();
  }
  function animateIn(){
    if(reduce){ intro=1; draw(); syncDom(); return; }
    var t0=performance.now();
    (function step(){
      var k=Math.min(1,(performance.now()-t0)/650);
      intro = k<1 ? (1-Math.pow(1-k,3)) : 1;
      draw(); syncDom();
      if(k<1) iraf=requestAnimationFrame(step); else iraf=0;
    })();
  }
  return {
    init:function(){
      stage=$('#mapStage'); cv=$('#gcv'); layer=$('#mapLayer');
      if(!cv||!cv.getContext) return;
      ctx=cv.getContext('2d'); seedSky(); bind();
      window.addEventListener('resize', resize);
      /* Esc で、選択・カード・シートを順に閉じる。キーボードだけでも出口があるように */
      document.addEventListener('keydown', function(e){
        if(e.key!=='Escape') return;
        if(Sheet.isOpen()){ Sheet.close(); return; }
        if($('#nodeDetail').classList.contains('on')){ hideCard(); carded=false; return; }
        if(sel){ sel=null; carded=false; computeKin(); draw(); syncDom(); }
      });
      $('#mapReset').onclick=function(){
        sel=null; chip=null; hideCard(); G=null; cam={x:0,y:0,z:1,base:0,v:1}; lvl=0; opened={};
        Store.saveLocal(); rebuild();
      };
      $('#ndClose').onclick=function(){ carded=false; hideCard(); draw(); syncDom(); };
    },
    show:function(mode){
      if(!cv) return;
      S.mapMode = mode||S.cfg.lastMap||'career';
      /* 覚えているビューに、タブの見た目もそろえる */
      $$('#mapTabs button').forEach(function(x){
        var on = x.dataset.m===S.mapMode;
        x.classList.toggle('on', on); x.setAttribute('aria-selected', on?'true':'false');
      });
      sel=null; chip=null; hideCard(); G=null;
      var empty = !S.logs.length;
      var e=$('#mapEmpty');
      if(empty){
        if(!e){ e=document.createElement('p'); e.className='mapempty'; e.id='mapEmpty'; stage.appendChild(e); }
        e.textContent='記録が増えると、ここにあなたの星座が育ちます。';
        layer.innerHTML=''; $('#vchips').innerHTML=''; $('#mapSum').textContent=''; $('#mapHint').textContent='';
        resize(); return;
      }
      if(e) e.remove();
      cam={x:0,y:0,z:1,base:0,v:1}; lvl=0; opened={};
      setTimeout(function(){ resize(); rebuild(); intro=0; animateIn(); }, 0);
    },
    resize:resize,
    clearSelection:function(){ sel=null; chip=null; hideCard(); }
  };
})();

var FILTERS = [['all','すべて']].concat(KINDS.map(function(k){ return [k.id,k.ja]; })).concat([['future','叶ったこと']]);

function renderYearTitle(){
