# Deploys the Supabase Edge Functions from the browser.
#
# The functions import from supabase/functions/_shared/, which the Supabase
# dashboard editor cannot reach, so the CLI has to do the bundling. Running it
# here means nobody needs a terminal: set the three secrets once, then press
# "Run workflow".
#
# SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are injected by
# Supabase into every deployed function. They are deliberately absent below —
# the platform reserves the SUPABASE_ prefix and refuses to set them as secrets.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: 'LLM provider (anthropic | openai | mock)'
        type: choice
        options: [anthropic, openai, mock]
        default: anthropic
      llm_model:
        description: 'Model id passed to the provider'
        type: string
        default: claude-sonnet-4-5

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=()
          [ -n "$ACCESS_TOKEN" ] || missing+=(SUPABASE_ACCESS_TOKEN)
          [ -n "$PROJECT_REF" ] || missing+=(SUPABASE_PROJECT_REF)
          case "${{ inputs.llm_provider }}" in
            anthropic) [ -n "$ANTHROPIC_API_KEY" ] || missing+=(ANTHROPIC_API_KEY) ;;
            openai)    [ -n "$OPENAI_API_KEY" ] || missing+=(OPENAI_API_KEY) ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The CLI rejects a malformed token only after the deploy has started,
          # in a log nobody scrolls to. Say it here, with where to get one.
          case "$ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN must start with sbp_ (this one does not)."
              echo "Generate one at https://supabase.com/dashboard/account/tokens"
              echo "It is NOT the project ref, the anon key, or the database password."
              exit 1
              ;;
          esac

          case "$PROJECT_REF" in
            sbp_*|http*|*.*)
              echo "::error::SUPABASE_PROJECT_REF looks wrong: it is the bare id from the"
              echo "dashboard URL after /project/ (about 20 lowercase letters) — not a URL,"
              echo "not a token."
              exit 1
              ;;
          esac

      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Written to a file rather than passed as arguments: a key on the
          # command line would be visible in the runner's process list.
          umask 077
          {
            echo "LLM_PROVIDER=${{ inputs.llm_provider }}"
            echo "LLM_MODEL=${{ inputs.llm_model }}"
            if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"; fi
            if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY=$OPENAI_API_KEY"; fi
          } > functions.env
          supabase secrets set --project-ref "$PROJECT_REF" --env-file functions.env
          rm -f functions.env

      - name: Deploy analyze-log
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy analyze-log --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy month-review
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy month-review --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Summary
        run: |
          {
            echo "### Edge Functions deployed"
            echo ""
            echo "| Function | Provider | Model |"
            echo "| --- | --- | --- |"
            echo "| analyze-log | ${{ inputs.llm_provider }} | ${{ inputs.llm_model }} |"
            echo "| month-review | ${{ inputs.llm_provider }} | ${{ inputs.llm_model }} |"
          } >> "$GITHUB_STEP_SUMMARY"
