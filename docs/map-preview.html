<title>crincran MAP — preview</title>
<!--
  crincran の MAP 画面を、ブラウザだけで動かせる形にしたもの。

  レイアウトの計算は app 側からの「移植」ではなく「複製」です:
    src/map/changeMap.ts     → buildChangeMap / makeRng / weightOf
    src/map/changeGroups.ts  → groupChanges
    src/theme/index.ts       → colors / spacing / radii
  数値と式を1つでも変えると、実機と違う絵が出ます。手を入れるときは、
  ここで確かめてから同じ変更を上のファイルに入れてください。逆はしない。

  データは下の CHANGES。crincran.life の 2026-09（20件）から作った、
  ありそうな読み取り結果です。中身を書き換えて絵の変化を試すためのもの。
-->
<style>

  html, body { margin: 0; padding: 0; }

    background: #000;
    color: var(--ivory);

    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  #plate {

    height: 940px;
    max-height: 100vh;

  .topbar { min-height: 44px; padding-top: var(--md); padding-bottom: var(--sm);

// ===========================================================================
// 2. 定数 — src/constants/copy.ts, progression.ts の写し
// ===========================================================================

const TARGET_SHORT = {

// §17 — phraseForConfidence (src/ai/changeRules.ts)
function phraseForConfidence(confidence) {
  if (confidence === 'strong') return '以前の記録との違いが、はっきり見えています。';
  if (confidence === 'supported') return 'この変化を示す記録が、複数あります。';
  return 'この方向につながる記録がありました。';
}

// ===========================================================================
// 3. src/map/changeGroups.ts の複製
// ===========================================================================

const TARGET_ORDER = ['month_declaration', 'year_direction', 'desired_self', 'emerging_direction'];

function groupChanges(changes) {
  const groups = new Map();
  for (const change of changes) {
    const key = `${change.linkedTargetType}:${change.linkedTargetId ?? change.linkedTargetLabel}`;
    const group = groups.get(key) ?? {
      key,
      targetType: change.linkedTargetType,
      targetLabel: change.linkedTargetLabel,
      changes: [],
      gains: [],
    };
    group.changes.push(change);
    groups.set(key, group);
  }
  for (const group of groups.values()) {
    group.changes.sort((a, b) => a.position - b.position);
    const seen = new Set();
    for (const change of group.changes) {
      for (const gain of change.gains) {
        if (seen.has(gain.label)) continue;
        seen.add(gain.label);
        group.gains.push(gain);
      }
    }
  }
  return [...groups.values()].sort((a, b) => {
    const byKind = TARGET_ORDER.indexOf(a.targetType) - TARGET_ORDER.indexOf(b.targetType);
    if (byKind !== 0) return byKind;
    return (a.changes[0]?.position ?? 0) - (b.changes[0]?.position ?? 0);
  });
}

const orderedChanges = (groups) => groups.flatMap((g) => g.changes);

// ===========================================================================
// 4. src/map/changeMap.ts の複製 — ここの数式が絵を決める
// ===========================================================================

function makeRng(seed) {
  let h = 2166136261 ^ seed.length;
  for (let i = 0; i < seed.length; i += 1) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
  return () => {
    h = (h + 0x6d2b79f5) | 0;
    let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const TITLE_DEPTH = 42;
const SECTOR_HALF_WIDTH = 44;
const ME_RADIUS = 5;
const NODE_MIN_RADIUS = 4;
const NODE_MAX_RADIUS = 7.5;
const MAX_NODES = 5;
const GLOW = { signal: 0.42, supported: 0.68, strong: 0.92 };

function weightOf(change) {
  const evidence = Math.min(1, change.evidence.length / 5);
  const settled = GLOW[change.confidence];
  const confirmed = change.verdict ? 0.12 : 0;
  return Math.min(1, evidence * 0.35 + settled * 0.53 + confirmed);
}

function buildChangeMap({ monthKey, changes, targetLabels = {}, selectedId = null, width, height }) {
  const rng = makeRng(monthKey);
  const cx = width / 2;
  const cy = height / 2;
  const me = { x: cx, y: cy, r: ME_RADIUS };

  const groups = groupChanges(changes.slice(0, MAX_NODES));
  const points = orderedChanges(groups);
  if (points.length === 0 || width <= 0 || height <= 0) {
    return { me, nodes: [], edges: [], sectors: [], groups };
  }

  const reach = (Math.min(width, height) / 2 - NODE_MAX_RADIUS * 3) * 0.6;
  const inner = reach * 0.46;
  const span = reach - inner;

  const slice = (Math.PI * 2) / points.length;
  const rotation = rng() * Math.PI * 2;

  const nodes = [];
  const edges = [];
  const sectors = [];

  const angleOf = (index) => rotation + slice * index;
  let cursor = 0;
  for (const group of groups) {
    const from = angleOf(cursor);
    const to = angleOf(cursor + group.changes.length - 1);
    const middle = (from + to) / 2;
    const labelRadius = reach + TITLE_DEPTH + 14;
    sectors.push({
      key: group.key,
      targetType: group.targetType,
      label: targetLabels[group.targetType] ?? '',
      x: clamp(cx + Math.cos(middle) * labelRadius, SECTOR_HALF_WIDTH + 2, width - SECTOR_HALF_WIDTH - 2),
      y: clamp(cy + Math.sin(middle) * labelRadius, 10, height - 10),
      angle: middle,
      changeIds: group.changes.map((c) => c.id),
    });
    cursor += group.changes.length;
  }

  points.forEach((change, index) => {
    const weight = weightOf(change);
    const angle = angleOf(index) + (rng() - 0.5) * slice * 0.4;
    const distance = inner + span * (1 - weight) * (0.5 + rng() * 0.5);

    const x = cx + Math.cos(angle) * distance;
    const y = cy + Math.sin(angle) * distance;
    const selected = selectedId === change.id;

    nodes.push({
      id: change.id,
      title: change.title,
      x, y,
      r: NODE_MIN_RADIUS + (NODE_MAX_RADIUS - NODE_MIN_RADIUS) * weight,
      glow: selected ? Math.min(1, GLOW[change.confidence] + 0.25) : GLOW[change.confidence],
      angle,
      selected,
    });
    edges.push({ id: `edge:${change.id}`, fromX: cx, fromY: cy, toX: x, toY: y });
  });

  return { me, nodes, edges, sectors, groups };
}

// ===========================================================================
// 5. 描画
// ===========================================================================

const MONTHS_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY',
                   'AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const MONTHS_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const el = (tag, className, text) => {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
};

let focusedId = null;

function formatShortDate(iso) {
  return `${iso.slice(5, 7)}/${iso.slice(8, 10)}`;
}

function render() {
  const year = Number(MONTH_KEY.slice(0, 4));
  const month = Number(MONTH_KEY.slice(5, 7));

  document.getElementById('month-plate').textContent = `${MONTHS_EN[month - 1]} ${year}`;
  document.getElementById('review-title').textContent = MONTH_TITLE;

  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  for (let m = 1; m <= 12; m += 1) {
    const item = el('div', `strip-item${m === month ? ' on' : ''}`);
    item.append(el('span', 'strip-month', MONTHS_SHORT[m - 1]));
    item.append(el('span', 'strip-year', String(year)));
    item.append(el('div', 'strip-rule'));
    strip.append(item);
  }
  strip.scrollLeft = Math.max(0, (month - 3) * 66);

  const scroll = document.getElementById('scroll');
  scroll.innerHTML = '';

  // canvas: map.tsx の式そのまま
  const plateHeight = document.getElementById('plate').clientHeight;
  const width = Math.max(260, 440 - 28 * 2);
  const height = Math.max(300, Math.min(420, plateHeight * 0.44));

  const graph = buildChangeMap({
    monthKey: MONTH_KEY,
    changes: CHANGES,
    targetLabels: TARGET_SHORT,
    selectedId: focusedId,
    width, height,
  });

  // --- 星空 ---
  const canvas = el('div', 'canvas');
  canvas.style.height = `${height}px`;
  const sky = el('div', 'sky');
  sky.style.width = `${width}px`;
  sky.style.height = `${height}px`;

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);

  for (const edge of graph.edges) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', edge.fromX); line.setAttribute('y1', edge.fromY);
    line.setAttribute('x2', edge.toX);   line.setAttribute('y2', edge.toY);
    line.setAttribute('stroke', 'rgba(194, 161, 92, 0.22)');
    line.setAttribute('stroke-width', '0.7');
    svg.append(line);
  }
  for (const node of graph.nodes) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', node.x); c.setAttribute('cy', node.y); c.setAttribute('r', node.r);
    c.setAttribute('fill', '#F3EEE2'); c.setAttribute('opacity', node.glow);
    svg.append(c);
  }
  const meDot = document.createElementNS(NS, 'circle');
  meDot.setAttribute('cx', graph.me.x); meDot.setAttribute('cy', graph.me.y);
  meDot.setAttribute('r', graph.me.r); meDot.setAttribute('fill', '#C2A15C');
  svg.append(meDot);
  sky.append(svg);

  const meLabel = el('div', 'abs me-label');
  meLabel.style.left = `${graph.me.x - 40}px`;
  meLabel.style.top = `${graph.me.y + graph.me.r + 6}px`;
  meLabel.append(el('span', 'me-text', LABELS.me));
  sky.append(meLabel);

  for (const sector of graph.sectors) {
    if (!sector.label) continue;
    const box = el('div', 'abs sector-label');
    box.style.left = `${sector.x - 44}px`;
    box.style.top = `${sector.y - 7}px`;
    box.append(el('span', 'sector-text', sector.label));
    sky.append(box);
  }

  for (const node of graph.nodes) {
    const hit = el('button', 'abs hit');
    hit.style.left = `${node.x - 60}px`;
    hit.style.top = `${node.y - 20}px`;
    const title = el('span', `node-title${node.selected ? ' on' : ''}`, node.title);
    title.style.opacity = String(Math.max(0.6, node.glow));
    hit.append(title);
    hit.onclick = () => select(node.id);
    sky.append(hit);
  }

  canvas.append(sky);
  scroll.append(canvas);
  scroll.append(el('div', 'rule'));
  scroll.append(el('div', 'heading', CHANGE_COPY.heading));

  if (graph.groups.length === 0) {
    scroll.append(el('div', 'none', CHANGE_COPY.none));
    return;
  }

  for (const group of graph.groups) {
    const block = el('div', 'group');
    block.dataset.groupKey = group.key;

    const head = el('div', 'group-head');
    head.append(el('div', 'group-kind', TARGET_HEADING[group.targetType]));
    if (group.targetLabel) head.append(el('div', 'group-target', `「${group.targetLabel}」`));
    block.append(head);

    for (const change of group.changes) block.append(renderCard(change));

    if (group.gains.length > 0) {
      const gains = el('div', 'group-gains');
      gains.append(el('div', 'group-gains-label', LABELS.whatYouGained));
      for (const gain of group.gains) {
        const row = el('div', 'group-gain');
        row.append(el('div', 'group-gain-category', GAIN_CATEGORY_JA[gain.category] ?? gain.category));
        row.append(el('div', 'group-gain-label', gain.label));
        gains.append(row);
      }
      block.append(gains);
    }

    scroll.append(block);
  }
}

const EVIDENCE_SHOWN = 3;

function renderCard(change) {
  const card = el('div', `card${focusedId === change.id ? ' focused' : ''}`);
  card.id = `card-${change.id}`;
  card.append(el('div', 'card-title', change.title));

  // §27: 記録から → 見えてきたこと → ありたい姿とのつながり。この順は動かさない。
  const shown = change.evidence.slice(0, EVIDENCE_SHOWN);
  const rest = change.evidence.length - shown.length;

  const records = el('div', 'block');
  records.append(el('div', 'section', CHANGE_COPY.fromRecords));
  for (const entry of shown) {
    const row = el('div', 'evidence');
    const head = el('div', 'evidence-head');
    head.append(el('span', 'date', formatShortDate(entry.occurredOn)));
    head.append(el('span', 'role', CHANGE_EVIDENCE_ROLE_JA[entry.role]));
    if (entry.momentTags.length > 0) {
      head.append(el('span', 'tags', entry.momentTags.map((t) => MOMENT_TAG_JA[t] ?? t).join('・')));
    }
    row.append(head);
    row.append(el('div', 'quote', entry.text));
    records.append(row);
  }
  if (rest > 0) {
    const more = el('div', 'more');
    more.append(el('span', 'more-label', CHANGE_COPY.allEvidence));
    more.append(el('span', 'more-count', `${change.evidence.length}件`));
    records.append(more);
  }
  card.append(records);

  // §16: 過去の記録が無ければ、この節ごと出さない。
  if (change.beforeState) {
    const before = el('div', 'block');
    before.append(el('div', 'section', CHANGE_COPY.before));
    before.append(el('div', 'body', change.beforeState));
    card.append(before);
  }

  const observation = el('div', 'block');
  observation.append(el('div', 'section', CHANGE_COPY.observation));
  observation.append(el('div', 'body', change.observation));
  observation.append(el('div', 'confidence', phraseForConfidence(change.confidence)));
  card.append(observation);

  const connection = el('div', 'block');
  connection.append(el('div', 'section', CHANGE_COPY.targetConnection));
  if (change.linkedTargetLabel) {
    connection.append(el('div', 'target', `「${change.linkedTargetLabel}」`));
  }
  connection.append(el('div', 'body', change.targetConnection));
  card.append(connection);

  card.append(el('div', 'rule'));

  const verdicts = el('div', 'verdict-row');
  for (const [value, label] of [['accepted', LABELS.accepted], ['adjusted', LABELS.adjusted]]) {
    const button = el('button', `verdict${change.verdict === value ? ' on' : ''}`, label);
    button.onclick = () => { change.verdict = change.verdict === value ? null : value; render(); };
    verdicts.append(button);
  }
  card.append(verdicts);

  return card;
}

// §24: 点をタップ → 対応するカードへ移動して光らせる
function select(changeId) {
  focusedId = changeId;
  render();
  const card = document.getElementById(`card-${changeId}`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ブラウザで開いたときだけ描く。__tests__/mapPreview.test.ts はこのスクリプトを
// そのまま評価して、上の buildChangeMap が app 側と同じ数を返すか比べています。
if (typeof document !== 'undefined') {
  render();
  window.addEventListener('resize', render);
}
</script>
